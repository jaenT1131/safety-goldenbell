<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>육쪽 마늘반 안전골든벨 도전!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7E6;--card:#fff;--ink:#1F2A44;--sub:#6B7280;--gold:#F4B400;--gold-d:#C98A00;--navy:#22315C;--red:#E5533D;--green:#21A35B;--line:#F0E3C4;--soft:#FFF0C7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3,.jua,button{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
#app{max-width:720px;margin:0 auto;padding:16px 16px 60px}
button{cursor:pointer;border:0;border-radius:14px;font-size:18px;padding:12px 18px;transition:transform .08s}
button:active{transform:scale(.97)}
.btn{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{font-size:15px;padding:8px 12px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 2px 0 var(--line),0 6px 18px rgba(34,49,92,.06);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--sub);font-size:15px}
.hero{background:linear-gradient(135deg,#22315C,#3A4E8C);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero h1{margin:0;font-size:26px}
.hero .bell{position:absolute;right:14px;top:6px;font-size:64px;opacity:.9;transform:rotate(12deg)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.12);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:'Jua';font-size:21px;color:var(--gold)}
.stat span{font-size:13px;opacity:.85}
.today{border:3px solid var(--gold);background:var(--soft)}
.today h2{margin:0 0 4px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.day{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Jua';font-size:15px;background:#fff;border:2px solid var(--line);color:var(--ink);padding:0}
.day .ic{font-size:20px;line-height:1}
.day.locked{background:#F3F1EC;color:#B5AFA3;border-color:#ECE7DC}
.day.open{border-color:var(--gold);background:var(--soft)}
.day.clear{background:#E6F6EC;border-color:#9FD8B5}
.day.perfect{background:#FFF3C4;border-color:var(--gold)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:#fff;color:var(--ink);border:2px solid var(--line);text-align:left;padding:14px}
.menu button small{display:block;font-family:'Gowun Dodum';color:var(--sub);font-size:13px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h2{margin:0;font-size:22px;flex:1}
.prog{height:12px;background:#EFE6D0;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FFCF3F);border-radius:99px;transition:width .3s}
.qnum{font-family:'Jua';color:var(--gold-d);font-size:18px}
.qtext{font-size:21px;line-height:1.6;margin:8px 0 16px;word-break:keep-all}
.opts{display:grid;gap:10px}
.opt{background:#fff;color:var(--ink);border:2px solid var(--line);text-align:left;font-family:'Gowun Dodum';font-size:18px;display:flex;gap:10px;align-items:flex-start;padding:14px;word-break:keep-all}
.opt .n{font-family:'Jua';background:var(--soft);border-radius:8px;min-width:30px;text-align:center;color:var(--gold-d)}
.opt.right{border-color:var(--green);background:#E6F6EC}
.opt.wrong{border-color:var(--red);background:#FDEBE7}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox button{font-size:64px;padding:18px 0;background:#fff;border:3px solid var(--line);border-radius:20px;line-height:1}
.ox .o{color:#2563EB}.ox .x{color:var(--red)}
.ox button.right{border-color:var(--green);background:#E6F6EC}.ox button.wrong{border-color:var(--red);background:#FDEBE7}
.fb{border-radius:16px;padding:14px;margin-top:14px;animation:pop .25s}
.fb.ok{background:#E6F6EC;border:2px solid #9FD8B5}.fb.no{background:#FDEBE7;border:2px solid #F3B2A6}
.fb h3{margin:0 0 4px;font-size:22px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.badge{display:inline-block;background:var(--soft);color:var(--gold-d);border-radius:99px;padding:2px 10px;font-size:14px;font-family:'Jua'}
.center{text-align:center}
.big{font-size:56px;line-height:1.1}
.codebox{font-family:ui-monospace,Menlo,monospace;font-size:18px;background:#1F2A44;color:#FFD54A;border-radius:12px;padding:12px;word-break:break-all;user-select:all;text-align:center}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:center}
.board th,.board td{white-space:nowrap}
th{font-family:'Jua';font-weight:400;color:var(--sub)}
td.l{text-align:left}
input,textarea,select{font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:110px}
.study .opt{cursor:default}
.hide-ans .ansmark{visibility:hidden}
.hide-ans .opt.right{border-color:var(--line);background:#fff}
.flip{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;cursor:pointer;word-break:keep-all}
.mini{display:grid;grid-template-columns:repeat(17,1fr);gap:3px;min-width:200px}
.mini i{display:block;aspect-ratio:1;border-radius:3px;background:#EFE9DA}
.mini i.c{background:#7FCB9C}.mini i.p{background:var(--gold)}
.rank1{background:#FFF3C4}
.tv td,.tv th{font-size:22px;padding:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:15px;z-index:50}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:40;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.rules li{margin:4px 0}
.note{font-size:14px;color:var(--sub);background:#FBF6EA;border-radius:12px;padding:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = {"days":[[[1,"다음 중 놀이기구 탑승이 제한되지 않는 사람은?",["임산부","노소약자","음주자","청소년"],4,""],[1,"평소에는 위험해 보이지 않지만 높은 곳에서 떨어지면 큰 부상을 입힐 위험이 있는 이것은 무엇일까요?",["물풍선","비둘기","터진 농구공","원반"],1,""],[1,"콩요리를 하던 넘버원. 잘못 사용한 이 제품이 엄청난 폭발 사고를 일으켰습니다. 과연 무엇일까요?",["믹서기","압력솥","전자레인지","청국장 제조기"],2,"높은 압력으로 짧은 시간에 음식을 조리할 수 있는 압력솥에 콩이나 팥 등 끈기가 있는 음식을 넣고 조리하면 폭발의 위험이 있습니다. 압력솥은 두꺼운 몸체와 뚜껑으로 되어 있고, 뚜껑 사이에는 고무가 있어 공기가 외부와 완전히 차단돼 높은 압력이 발생하게 됩니다. 온도 또한 매우 높아 어린아이는 물론 압력솥은 직접 사용하는 어른들도 사용에 주의를 해야 합니다. 맛있는 요리를 위한 안전한 압력솥 사용에 대해 알아보아요. 1. 죽이나 식혜, 콩, 팥 등 거품이나 끈기, 껍질이 있는 음식을 조리하면 압력 조절장치인 노즐을 막게 됩니다. 그러면 뜨거운 공기가 빠져나가지 못해 압력이 너무 높아져 폭팔할 위험이 생깁니다. 따라서 그런 음식은 압력솥으로 조리하는 것을 피하고, 평소에 노즐을 깨끗하게 관리합니다. 2. 표시된 최대 용량 이상의 내용물을 넣고 사용하지 않아야 합니다. 3. 조리가 끝나면 뚜껑을 열기 전 내부 증기가 다 빠져나간 후에 뚜껑을 열어야 합니다. 또한 압력솥에서 나오는 증기의 온도는 매우 높으니 가까이 가지 말아야 합니다."],[1,"가정 내에서 어린아이가 물에 빠져 부상을 입거나 숨지는 사고가 가장 많이 발생하는 것은 어디일까요?",["세탁기","세숫대야","욕조","어항"],3,"가정 내에서 어린아이가 물에 빠져 부상을 입거나 숨지는 사고가 발생합니다. 커다란 어른용 욕조뿐 아니라 어린이 전용으로 만들어진 욕조에서도 사고가 자주 일어나요. 아기는 몸에 비해 머리가 크고 균형을 잡거나 목을 잘 가누지 못하기 때문에 얕은 물에 빠져도 사고를 당하기 쉽습니다. 아기를 유아용 욕조에서 목욕시키다가 전화를 받는다거나, 손님이 찾아왔을 경우 아기를 욕조에 두고 잠시 자리를 비운 사이 사고가 일어나게 되는 것입니다. 그렇다면 어린이 익사 사고를 방지하는 방법은 무엇일까요? 1. 아기를 씻기는 도중 잠깐 나가야 할 경우에도 아기를 절대 혼자 두지 말고 타월로 감싸 데리고 나가야 합니다. 2. 아기의 몸이 욕조 안으로 미끄러지거나 넘어져서 빠지지 않도록 아기 그물이나 미끄럼 방지용 받침대 등을 설치해 놓습니다. 3. 또한 호기심이 많은 어린아이에게 변기는 재미있는 놀이 기구로 보일 수 있습니다. 뚜껑이 열린 변기 위로 올라가려다 미끄러지는 등 사고가 일어날 수 있게 때문에 아기가 있는 집에서는 변기 뚜껑을 항상 닫아 놓아야 하고 가능하면 잠금 장치를 해 두는 것이 좋습니다."],[1,"감전 사고가 났을 때 사망률이 가장 높은 곳은 어디일까요?",["전기 설비를 많이 하는 공사장","욕실 등 물기가 많은 장소","고압 전류가 흐르는 지하철","높은 전류로 가동되는 놀이시설"],2,"감전을 당하면 몸에 충격이 오고 근육이 수축되며, 심하면 심장이 멈춰 사망하기도 해요. 몸이 젖어 있으면 마른 몸일 때보다 전기에 대한 저항이 낮아져 더 큰 피해를 입게 됩니다. 게다가 욕실 등 물기가 많은 장소에서 전기에 직접 닿지 않아도 물을 통해 전기가 통할 수 있기 때문에 감전의 확률이 높아집니다. 가정 내의 감전 사고를 예방할 수 있는 방법은 어떤 것이 있을까요? 1. 습기가 많은 욕실에서는 면도기나 헤어드라이어 같은 전자 제품을 되도록 사용하지 않도록 합니다. 욕실에서 가전제품을 사용한 후에 반드시 플러그를 뽑아 욕실 밖에 보관하고, 욕실 콘센트의 안전 덮개를 덮어야 합니다. 2. 욕실은 물론 어떤 장소에서는 어린아이가 콘센트를 가지고 장난을 치거나 전자 제품을 가지고 놀지 못하게 주의해야 합니다. 3. 가장마다 설치되어 있는 누전 차단기를 정기적으로 점검해 만약의 사고에 대비합니다."],[1,"아이들이 잘못 삼켜 기도를 막는 여러 물건들. 그 중 가장 많은 비율을 차지하는 것은 무엇일까요?",["이쑤시개","장남감총알","땅콩","단추"],3,"신기한 것을 보면 일단 입으로 가져가는 아이들. 아이들의 기도 속으로 가장 흔히 들어가고, 깊숙이 들어갈 경우 폐질환을 일으킬 위험이 높은 물건은 바로 땅콩입니다. 크기가 작은 땅콩, 호두, 잣 등의 견과류는 기도로 들어갔을 때 폐까지 들어가기도 합니다. 음식을 먹을 때는 먹는 데만 집중하고 혹시 음식이 목에 걸리면 응급 처지 후 반드시 병원을 찾아 음식물이 완전히 제거되었는지를 확인하세요. 맛있는 간식인 땅콩이 위험한 물건이 되지 않도록 다음과 같이 주의하세요. 1. 말하면 먹거나, 먹는 도중 놀라거나 잘못 움직이면 음식물이 기도로 넘어가기 쉬워요. 먹을 때는 돌아다니지도, 장난을 쳐서도 안 됩니다. 2. 혹시 음식들이 기도로 들어간 경우 억지로 토하거나 다른 것을 먹어서는 안돼요. 더 깊숙이 들어가거나 질식할 위험도 있답니다. 3. 4세 이하의 어린이에게는 땅콩뿐 아니라 작은 견과류 그리고 그런 견과류가 붙어 있는 음식도 주지 않는 것이 좋습니다."],[1,"조류 독감 예방법으로 전혀 효과가 없는 것은 무엇일까요?",["손을 자주 씻는다.","항균 마스크를 쓴다.","가금육은 0゜C 이하로 냉동시킨다.","신발을 락스로 소독한다."],3,"조류뿐 아니라 사람의 생명도 위협하는 조류 독감. 조류 독감 바이러스는 고기를 냉동한다 해도 죽지 않아요. 오히려 바이러스가 더 오래 보존된답니다. 하지만 조류 독감 바이러스는 열에 약하므로 가열하면 안심하고 먹을 수 있어요. 그리고 조리 시 사용한 칼이나 도마, 행주 등도 꼭 끓는 물에 삶거나 소독해야 합니다. 확실한 예방 색신이 없는 조류 독감. 조류 독감을 예방하는 방법을 알아봅시다. 1. 손은 바이러스와 세균을 옮기는 역할을 해요. 외출 후 집으로 돌아오면 비누로 손을 깨끗이 씻어서 손에 있는 세균을 없애는 것만으로도 예방 효과가 있습니다. 2. 조류 독감은 입이나 코 등 호흡기를 통해 감염되는 경우가 많으므로 조류 독감이 의심되는 시기에는 외출할 때 항균 마스크를 씁니다. 3. 조류 독감이 유행하는 것으로 의심되는 지역에 다녀오면 신발을 락스로 소독하세요."],[1,"식품에 표백제가 사용되었는지 알 수 있는 이것은 무엇일까요?",["간장","과산화수소","식초","요오드용액"],4,"우엉, 연근 등 뿌리채소는 껍질을 벗기자마자 색깔이 변하기 때문에 신선하게 보이기 위해 표백처리를 하는 경우가 있습니다. 이때 쓰이는 표백제가 아황산염인데, 아황산염은 많이 섭취할 경우 천식을 유발하는 물질로, 식품위생법에는 콩이나 과일, 채소류 등에는 아황산염 사용이 금지되어 있습니다. 이 아황산염은 눈에 보이지 않지만 요오드 용액을 사용하면 눈으로 확인 할 수 있어요. 건강에 좋은 식품, 안전하게 먹을 수 있도록 확인해 봅시다. 1. 뿌리채소가 손질이 된 상태일 경우 표면이 지나치게 희면 표백 처리를 했는지 의심해 보고, 약국에서 쉽게 살 수 있는 요오드 용액으로 확인합니다. 2. 표백이 된 채소를 물에 담근 후 요오드 용액을 떨어뜨리면 아무런 반응이 없고, 약국에서 쉽게 살 수 있는 요오드 용액으로 확인합니다. 3. 껍질을 깐 채소는 갈색으로 변하는 것이 자연스러운 현상이므로 색이 흴수록 신선할 것이라는 생각은 잘못된 것이에요. 따라서 채소를 살 때는 되도록 껍질이 있는 것을 구입해 직접 껍질을 까서 먹는 것이 안전합니다."],[1,"수소가스로 인해 갑작스런 폭발을 일으키는 이것은 무엇일까요?",["폐형광등","애드벌룬","폐건전지","신호봉"],2,"헬륨 가스는 공기보다 가벼워 풍선에 넣어 공중으로 띄우는 데에도 사용 됩니다. 그러나 안전한 헬륨가스에 비해 가격이 싼 수소가스를 넣어 애드벌룬이나 풍선을 만드는 경우가 많은데, 수소는 공기 중에 오래 노출될 경우 폭발과 함께 화재를 일으킬 위험이 있답니다. 따라서 축제나 행사 때 많이 사용되는 애드벌룬은 원칙을 지켜 만들지 않을 경우 폭발을 일으키고 주변 사람에게 화상 등 피해를 입힐 수 있습니다. 위기탈출 넘버원과 함께 애드벌룬 속에 숨겨진 위험에서 탈출해요. 1. 애드벌룬에는 수소가스를 사용하지 말고 안전한 헬륨 가스를 넣어야 합니다. 2. 수소가스는 햇볕을 쪼이는 것만으로도 폭발할 위험이 있으니 주위에서 바람이 빠진 애드벌룬을 발견하더라도 절대로 건드리지 마세요. 3. 놀이 공원 등에서 판매하는 헬륨 풍선 역시 수소가스를 사용하는 경우가 많으므로 불꽃이 튀길 만한 물건 근처에 풍선을 가지고 다가가지 마세요."],[1,"잘못 사용하거나 너무 많이 쓰면 피부에 피멍과 곰팡이까지 생길 수 있는 이것은 무엇일까요?",["파스","스테로이드 연고","각질 제거제","자외선 차단제"],2,"스테로이드란 우리 몸에서 만들어지는 호르몬으로, 염증을 가라앉히는 역할을 하기 때문에 피부 질환은 물론 퇴행성 관절혐의 통증을 조절하는 등 많은 질환에 사용되고 있지요. 하지만 이 성분이 들어간 연고를 잘못 사용하거나 지나치게 많이 사용한다면 피부에 피멍, 물집이 생기고 세균과 곰팡이 까지 증식할 수 있습니다. 스테로이드 연고의 올바른 사용법에 대해 알아보아요. 1. 성분 중 하이드로코디손, 덱사메타손 등이 표기되어 있는 연고는 스테로이드 연고입니다. 2. 가렵다고 해서 아무 연고나 바르지 말고, 의사의 처방을 받습니다. 3. 처방에 따라 정확한 양을 지키고, 처방받은 기간 동안 사용합니다. 도중에 사용을 중단하거나 사용량을 바꿀 때에도 반드시 의사의 지시를 받아야 해요. 4. 연고 사용 후 상처 부분이 붉어지거나 피부가 붓고 트면 바로 병원으로 가야 해요."],[1,"장마가 시작되는 7월에 특히 많이 일어나는 사고는 무엇일까요?",["빗길 미끄러짐으로 인한 실족사","낙뢰로 인한 심장마비","간판 추락으로 인한 뇌진탕","장마철 습기로 인한 감전사"],4,"센 바람과 집중 호우로 안전사고가 많이 발생하는 장마철. 비로 인한 물기와 습기로 인해 이상이 생긴 신호등이나 입간판 등에서 나온 전기가 사람에 닿아 감전 사고가 많이 일어나요. 마른 날과는 달리 비가 오는 날은 사람의 발과 땅이 젖어 있는데, 이때 발과 땅 사이의 저항이 작아져 마른 상태일 때 보다 훨씬 큰 전류가 흘러 위험해집니다. 또한 피복이 벗겨진 전선이 나무에 닿아 있는 상태라면 젖은 나무에 닿기만 해도 감전 사고를 당할 수 있습니다. 넘버원과 함께 감전 사고에 대처하는 방법을 알아보아요. 1. 비가 오는 날 외출할 때에는 전기가 통하지 않도록 고무장화나 밑창이 고무로 된 신발을 신으세요. 맨발로 신는 샌들이나 슬리퍼는 신지 않도록 합니다. 2. 비가 오거나 온 후에 길을 걸을 때에는 맨홀이나 물웅덩이 밟지 말아야 하고, 신호등이나 전봇대 등 전기가 흐르는 시설물 근처에 가지 않도록 합니다. 3. 감전된 사람을 발견하면 물기가 없고 전기가 통하지 않는 나무 막대 등을 이용하여 전선 등 전기가 흐르는 물체를 떼어 내고 즉시 인공호흡을 합니다."],[1,"무거운 힘에 의해 사람이 깔려 죽는 압사 사고의 가장 많은 원인이 되는 것은 무엇일까요?",["부딪힘으로 인한 뇌진탕","흉부 압박으로 인한 질식","밟힘으로 인한 척추 손상","눌림으로 인한 장내 출혈"],2,"압사는 가구나 담벼락, 많은 사람들 등 무거운 것 아래 깔려 사망하는 것을 말해요. 특히 사람에게 깔리는 사고는 순식간에 많은 사람이 모일 때 자주 발생합니다. 우리가 숨을 쉴 때에는 가슴을 움직이게 되는데, 가슴과 배가 무거운 힘에 눌리면 기도가 열려 있어도 숨을 쉴 수 없어 사망하게 되는 것이지요. 압사사고에 대처하는 단 한 가지 방법은 바로 '질서'입니다."],[1,"컴퓨터 게임을 하다가 빛에 의한 광과민성 발작을 일으킨 경우 가장 먼저 해야 할 일은 무엇일까요?",["찬물을 먹인다.","몸을 주물러 준다.","모니터를 끈다.","정신을 차리도록 박수를 친다."],3,"광과민성 발작이란 빛의 반복적인 자극 때문에 우리 뇌의 뇌파가 갑자기 증가해 일어나는 증세예요. 만화 영화나 컴퓨터 게임의 번쩍거리는 화면, 빛에 예민한 반응을 보이는 사람의 경우에는 길의 가로수 사이로 반복적으로 들어오는 태양 광선에도 광과민성 발작을 일으킬 수 있습니다. 발작이 일어나면 원인이 되는 빛부터 빨리 차단해야 합니다. 빛 속에 도사린 위험, 넘버원과 함께 광과민성 발작을 예방하는 방법을 알아봐요. 1. 텔레비전을 볼 때는 주변 조명을 텔레비전 모니터 화면과 비슷한 정도로 어둡지 않게 조절하고 화면에서는 적어도 2~3m 떨어져 앉아야 해요. 2. 컴퓨터 게임은 지나치게 오랜 시간 동안 하면 안 됩니다. 3. 만약 발작이 일어나면 빨리 모니터를 끄고 옷을 느슨하게 풀어 몸을 편하게 해 주세요."],[1,"다음 중 귓속에 벌레가 들어갔을 때 적절한 조치는 무엇일까요?",["면봉으로 후빈다.","스포이드로 귓속에 물을 떨어뜨린다.","손전등을 귀에 비춘다.","나올 때까지 그냥 가만히 둔다."],3,"벌레가 귀로 들어가면 당황하지 말고 손전등을 귀에 비춰 벌레가 불빛을 따라 밖으로 나올 수 있게 하세요. 만약 벌레가 귓속에서 죽었다면 베이비오일을 1~2방울 떨어뜨리고 귀를 아래쪽으로 기울여 벌레가 미끄러져 나오게 합니다."],[1,"공연관람 중 비상사태가 발생하였을 때 대처방법으로 옳지 않은 것은 무엇일까요?",["정전이 되면 신속히 짐을 챙겨 대피한다.","대피지시가 있을 경우 유도등을 따라 대피한다.","화재가 발생 시 ‘불이야’하고 큰소리로 외친다.","한꺼번에 출입구에 몰려들지 않도록 앞사람 먼저 차례대로 대피한다."],1,"갑자기 정전되면 당황하지 말고 안내요원의 안내가 있기까지 자리에서 기다려야 합니다. 보이지 않는 상황에서 각자 움직일 경우 다른 사람이나 물체에 부딪혀 혼란이 가중될 수 있습니다."],[1,"다음 중 빙판길에서 넘어지지 않는 자세로 옳지 않은 것은 무엇일까요?",["몸을 앞쪽으로 약간 구부린다.","보폭을 넓혀 걷는다.","발을 떼지 말고 끌어서 움직인다.","손을 주머니에 넣지 않는다."],2,"빙판길을 걸을 때는 몸을 앞쪽으로 약간 구부리거나 무릎을 약간 구부려서 무게중심을 앞으로 가게 하고, 보폭을 줄이고, 심한 빙판에서는 발을 떼지 말고 끌어서 움직이는 것이 좋습니다."],[1,"억류 및 납치 시 대처요령으로 옳지 않은 것은?",["인질로 억류 및 납치 감금을 당했다면 저항하지 말고 급작스러운 행동을 피한다.","탈출 성공의 가능성이 있다면, 용기를 내어 시도한다.","납치범들이 무엇인가를 물어 올 때는 짧고 자연스러운 자세로 대답한다.","눈을 가리면 주변의 소리·냄새·피랍로 경사와 거리·범인 음성 등을 기억한다.","구출작전이 전개될 때는 즉시 엎드려야 한다."],2,""],[1,"신종감염병을 예방하기 위한 생활습관으로 옳지 않은 것은 무엇일까요?",["손으로 눈, 코를 자주 마사지 해준다.","흐르는 물에 비누로 손을 자주 씻는다.","채소는 흐르는 물에 씻고 가열해 먹는다.","실내를 깨끗이 하고 환기를 자주 시킨다."],1,"손은 우리 몸에서 가장 많은 세균이 사는 곳입니다. 그러므로 손으로 눈, 코, 입을 만지는 것은 감염 가능성을 높이는 것입니다."],[1,"다음 중 농촌이나 갯벌 체험활동 중 사고가 일어났을 때 올바른 대처방법은 무엇일까요?",["아파도 의젓하게 참고 구조될 때까지 기다린다.","발이 갯벌에 빠졌을 때에는 몸을 세워 최대한 발을 빼내어 본다.","발이 갯벌에 빠졌을 때에는 앞으로 엎드려 양손을 짚고 발을 빼내어 본다.","발이 갯벌에 빠졌을 때에는 바닥에 누워 등을 붙이고 머리 방향으로 몸을 밀어 나온다."],4,"갯벌에 발이 빠지면 몸무게를 분산시켜 더 빠지지 않도록 해야 합니다."],[1,"다음 중 성폭력과 관련 신고전화번호로 옳지 않은 것은 무엇일까요?",["1899-3075","1366","112","114"],4,"성폭력을 당하거나 목격했을 경우에는 원스톱지원센터/ 해바라기여성아동센터 (1899-3075), 여성긴급전화(1366), 긴급구조번호(112)에 신고할 수 있도록 합니다. 이외에도 청소년사이버상담센터(www.cyber1388.kr)을 이용할 수 있습니다."],[1,"다음 중 태풍이나 집중호우 발생 시 피해야 할 곳으로 옳지 않은 것은 무엇일까요?",["축대벽(옹벽) 주변","전신주, 가로등 근처","건물 안","공사장"],3,"태풍이나 집중호우 시 피해야 할 곳으로는 축대벽, 공사장, 하천, 배수로 주위, 전신주, 가로등, 신호등, 고압전선 근처, 돌출된 간판, 길가에 세워진 간판 등이 있습니다."],[1,"다음 중 지진해일의 전조증상이 아닌 것은 무엇일까요?",["위아래로 움직이는 해수면","유난히 부글거리는 바다 거품이 밀려옴","해안가로 많은 파도가 밀려옴","해안가로부터 바닷물이 빠져 바닥이 드러남"],3,"지진해일의 일어나기 직전의 증상은 바닷물이 빠지거나 없어지면서 바닥이 드러나고 물고기 떼가 바닥에 흩어져 있는 경우입니다. 파도가 밀려오는 것은 지진해일이 일어나는 현상입니다."],[1,"횡단보도를 건너는 안전한 방법이 아닌 것은 무엇일까요?",["보도경계석 안쪽에 멈추어 선다.","신호등의 초록불이 켜진 후에도 왼쪽, 오른쪽을 살핀다.","차의 움직임이 완전히 멈춘 것을 확인한 후 걸어서 건넌다.","초록색등에서 점멸등으로 바뀌면 재빨리 뛰어서 건너야 한다."],4,"횡단보도를 건널 때는 먼저 보도 경계석 안쪽에 멈추어 서서 신호등을 확인합니다. 신호등의 초록불이 켜지더라도 바로 건너지 말고 차도의 왼쪽, 오른쪽, 다시 왼쪽을 살핍니다. 차의 움직임이 완전히 멈춘 것을 확인한 후 차의 흐름을 살피면서 걸어서 건너야 합니다."],[1,"고속도로 상에서의 안전벨트 착용에 대한 설명 중 가장 올바른 것은 무엇인가요?",["운전자만 매면 된다.","운전자와 조수석에 탄 사람만 매면 된다.","차에 타고 있는 모든 사람이 매야 된다.","어른들만 매면 된다."],3,"고속도로에서는 안전을 위해 전좌석 안전벨트 사용이 의무화 되었습니다. 그래서 어른, 아이 구분 없이 차에 타고 있는 사람은 모두 안전벨트를 매어야 하며 어린이는 카시트와 안전벨트를 연결하여 안전을 확보해야 합니다."],[1,"소화기에 대한 설명 중 틀린 것은?",["불을 많이 사용하는 부엌에 눈에 잘 띄는 곳에 둔다.","습기가 있는 곳에 두지 않는다.","소화기가 평소 어디에 있는지 위치를 잘 파악한다.","최소한 3년에 한 번씩 교체해 주어야한다."],4,"소화기의 사용법은 다음과 같습니다. 첫째, 소화기를 불이 난 곳으로 옮겨 손잡이 부분의 안전핀을 뽑습니다. 둘째, 바람을 등지고 서서 호스를 불쪽으로 향하게 합니다. 셋째, 손잡이를 힘껏 움켜쥐고 빗자루로 쓸듯이 뿌립니다. 소화기를 관리할 때는 잘 보이고 사용하기에 편리한 곳에 두되 햇빛이나 습기에 노출되지 않도록 합니다. 소화기는 아주 작은 분말소화약제가 들어 있어 정기적(월1회 이상)으로 흔들어 주어야만 소화약제가 응고되지 않습니다. 직사광선 및 습기가 많은 장소에는 보관을 피해야 합니다. 주기적으로 내부 약제 및 압축가스를 확인하여 이상이 있을시 교환합니다. 소화기 점검요령은 다음과 같습니다. 소화기는 일상적으로 년 2회(상, 하반기) 점검을 실시하여야 합니다. 상반기는 작동기능 정검으로 소화기의 외관, 압력, 노즐 등 소화기 외관 및 기능에 관한 점검입니다. 따라서 소화기 기능상의 외관점검을 하여야 합니다. 이때에는 소화기의 압력게이지 정상위치(녹색) 여부, 소화기 안전핀 및 손잡이 부식 여부, 노즐 파손 여부, 외함 부식 여부 등을 점검하여 이상 유무를 판단하여야 합니다. 그리고 일반적인 축압식 ABC분말 소화기의 유효기간은 5년입니다."],[1,"교통사고예방을 위하여 비올 때 주의사항이 아닌 것은?",["우산이 앞이 보이는 투명우산이 좋다","우산은 눈높이와 똑같이 들어 준다.","횡단보도에서 1∼2보정도 뒤로 떨어져 있는다.","비, 바람에 모자가 차도로 달려도 급하게 뛰어들지 않는다."],2,"비가 올 때는 투명한 우산을 써 앞을 잘 보면서 걷도록 하고 천 우산을 쓸 경우 우산은 살짝 들어 시야를 확보해야 합니다. 그리고 빠른 차들이 지나갈 경우 우산이 딸려갈 수 있으므로 횡단보도에 서 있을 때는 1~2보정도 뒤로 떨어져 있어야 합니다."],[1,"자동차 특성상 갑자기 브레이크를 밟아도 일정거리를 주행한 후 멈추게 됩니다. 이 때 운전자가 물체를 발견하고 브레이크를 밟을 때까지의 시간에 주행한 거리를 무엇이라고 할까요?",["제동거리","공주거리","정지거리","주행거리"],2,"공주거리는 운전자가 차를 정지시켜야겠다고 판단한 순간부터 브레이크 페달로 발을 옮긴 후 작동시키기 직전까지 차량이 이동한 거리를 말합니다. 제동거리는 브레이크가 작동되기 시작하여 움직이는 차량이 정지한 곳 까지 이동한 거리를 말합니다. 공주거리와 제동거리를 합하여 정지거리를 의미합니다. 따라서 운전자가 갑자기 튀어나온 물체나 사람을 보고 멈추려고 해도 차는 즉시 정지하지 않기 때문에 도로로 갑자기 뛰어들거나 무단횡단을 하는 일이 없도록 해야 합니다."],[1,"눈 올 때 안전하게 걷는 방법 중 틀린 것은?",["미끄러져 넘어질 수 있으므로 차와 멀리 떨어져서 걷는다.","눈이 오면 날씨가 어두워질 수 있으므로 하얀 옷을 입고 다닌다.","신발은 미끄러운 구두보다 홈이 파져있는 운동화가 좋다.","털모자, 털목도리를 하여 몸을 따뜻하게 해 준다."],2,"눈길에서 걸어야 할 때는 반드시 인도로 걸어야 합니다. 인도에 쌓인 눈을 피해 차도로 내려오면 눈길에 제동이 제대로 되지 않은 차량으로 인해 사고가 발생할 수 있습니다. 그리고 추운 날씨 때문에 몸을 움츠리고 주머니에 손을 넣고 걷는 경우도 위험합니다. 반드시 장갑을 착용하여 중심을 잡지 못하고 넘어질 경우를 대비해야 합니다. 옷을 입을 때는 얇은 옷을 여러겹 입어 몸이 둔해지는 것을 방지하고 밝은 색 보다는 선명한 색의 옷을 입어 운전자의 시야에 잘 들어오도록 해야 안전합니다."],[1,"지진이 발생하면 어떻게 해야 하는지 틀린 내용은?",["집 밖의 경우 떨어지는 물건에 주의하며 머리를 보호한다.","집 안에서는 옷장으로 들어가 몸을 보호한다.","집 안에서는 먼저 출입문을 열어 탈출구를 확보한다.","학교 안에서는 선생님의 안내에 따라 안전하게 대피한다."],2,"지진 발생 횟수가 매년 증가하고 있는 점으로 볼 때 우리나라도 지진 안전지대로 볼 수 없습니다. 지진에 대비하여 평소 대비 훈련을 해 두어야 합니다. 지진이 발생하면 실내의 단단한 탁자 밑, 내력벽 사이의 작은 공간 등 평소 안전한 위치를 파악해 두고 비상 시 대피하도록 합니다. 옷장이나 신발장 큰 거울 등은 지진 발생 시 넘어져 파손될 우려가 있으므로 피해야 합니다. 문을 닫아두면 뒤틀림 현상 등으로 문을 열 수 없게 되어 갇힐 우려가 있으므로 미리 문을 열어두도록 하고 진동이 진행되고 있을 때에는 질서를 유지하면서 있는 곳에 그대로 머무르는 것이 좋습니다."],[1,"가스안전 수칙 4가지에 대한 설명 중 틀린 것은?",["사용 전 냄새확인과 창문열기","사용 중 불구멍과 점화확인","사용 후 점화 콕크와 중간밸브 잠그기","평상 시 LP가스 용기를 바람이 잘 통하고 직사광선을 받는 곳에 설치"],4,"4가지 가스안전 수칙은 다음과 같습니다. 첫째, 사용 전 가스불을 켜기 전 가스냄새가 나지 않는지 살펴보고 창문을 열어 가스연소 시 필요한 공기가 실내에 충분히 들어오도록 한다. 둘째, 사용 중 점화를 할 때는 불구멍을 자세히 보고 확실히 점화가 되었는지 확인한다. 불이 붙지 않았는데도 코크를 계속 열어두면 위험하다. 셋째, 사용 후 점화 코크와 중간밸브를 함께 잠근다. 장기간 집을 비워둘 때는 용기밸브(LPG)나 메인밸브(도시가스)까지 잠가야 안전하다. 넷째, 평상시 코크와 호스, 호스와 연소기 등의 이음새 부분과 호스에서 가스가 새지 않는지 비눗물이나 점검액 등으로 수시로 점검한다. 가스연소기는 항상 깨끗이 청소하여 불구멍(배너헤드)이 막히지 않도록 주의해야 한다. LP가스의 경우 온도가 40℃ 이상 올라가지 않도록 바람이 잘 통하고 그늘진 곳, 조리기구에서 멀리 떨어진 곳에 설치해야 합니다."],[1,"동물에게 물렸을 때 해야 할 내용이 아닌 것은 무엇일까요?",["응급조치로 흐르는 물로 물린 상처부위를 깨끗이 씻고 소독약을 바른다.","상처가 가벼운 경우 소독하는 것으로도 치료가 되므로 안심한다.","주인 없는 개나 고양이에게 물린 경우 바로 병원에 가서 치료를 바른다.","개에게 물렸을 경우 광견병 예방주사를 맞았는지 확인해야 한다."],2,"상처가 가벼워도 반드시 병원에 가서 진료를 받아보는 것이 좋습니다."],[1,"다음 중 태풍경보 발령 기준에 해당하지 않는 것은 무엇인가요?",["강풍(또는 풍랑) 경보기준에 도달할 것으로 예상될 때","총 강우량이 200mm이상 예상될 때","폭풍해일 경보 기준에 도달할 것으로 예상될 때","열대성 저기압 중에서 중심 최대풍속이 초당 19m 이상일 때"],4,"태풍은 북태평양 남서해상에서 발생하는 열대성 저기압 중에서 중심 최대풍속이 1초당 17m 이상의 폭풍우를 동반하고 있는 기상현상을 말합니다. 태풍의 위력이 큰 경우 강풍(또는 풍랑) 경보기준에 도달할 것으로 예상될 때, 총 강우량이 200mm이상 예상될 때, 폭풍해일 경보 기준에 도달할 것으로 예상될 때 중 하나에 해당하는 경우 태풍 경보가 발령됩니다."],[1,"자전거, 인라인스케이트를 탈 때 안전을 위해 영국에서는 이것의 착용이 법으로 정해져 있습니다. 무엇일까요?",["장갑","보안경","야광 띠","모자"],3,"자전거, 인라인스케이트 등의 레포츠 안전사고는 야간에 많이 발생합니다. 우리나라에서는 아직 야광 띠 착용이 법으로 지정되어 있지는 않지만 해가 질 무렵부터는 야광 띠를 착용하면 다른 사람의 눈에 잘 띄어 사고의 위험을 줄일 수 있어요. 넘버원과 함께 안전한 야간 레포츠 활동에 필요한 것들을 알아보아요. 1. 야간에 밖에서 운동할 때에는 반드시 야광 띠를 착용하거나 야광 스티커를 옷에 붙이세요. 2. 옷은 어둠 속에서도 눈에 잘 띄는 밝은 원색으로 입으세요. 3. 자전거를 살 때에는 후면 반사경, 페달 반사경, 사이드 반사경이 붙어 있는지 반드시 확인하세요. 의무적으로 부착하도록 지정되어 있는 것들이에요. 4. 자전거, 인라인스케이트, 킥보드 등의 바퀴 달린 기구를 구입할 때에는 되도록 형광 반사 표시가 있는 제품을 선택합니다. 5. 레포츠 활동을 할 때에는 언제나 헬멧과 보호대 등 안전 장비를 착용하고, 외부의 소리가 들리지 않을 수 있으니 이어폰을 끼지 마세요."],[1,"순식간에 일어난 손가락 절단 사고. 절단 부위에 대한 올바른 대처법은 무엇일까요?",["알코올에 담근다.","깨끗한 수건으로 싼다.","생리 식염수에 담근다.","얼음 속에 넣는다."],2,"누구나 쉽고 간편하게 사용하는 가정용 믹서. 하지만 강력해진 믹서의 성능 때문에 믹서 사고 피해자는 해마다 크게 늘어나고 있습니다. 사용 도중이나 세척 시 무심코 작동 스위치를 눌러 손바닥을 베이거나 손가락이 잘리는 등의 사고가 많이 발생하기 때문에 늘 주의해야 합니다. 절단 사고의 큰 원인이 되는 믹서의 올바른 사용법을 알아봐요. 1. 믹서를 사용한 후 칼날을 세척하다가 사고가 나는 경우가 많아요. 따라서 믹서 안에 손을 넣어 씻지 말고 따뜻한 물에 세제를 풀어 거품을 내고 20초 정도 회전시켜 세척한 후 깨끗한 물에 담가 헹굽니다. 2. 칼날을 바꿔 끼거나 날에 낀 음식 조각을 빼낼 때는 반드시 전원을 끄고, 이물질을 뺄 때는 젓가락이나 막대를 사용합니다. 3. 누르고 있다 손을 떼면 자동으로 꺼지는 안전 스위치가 부착된 믹서를 구입합니다."],[1,"안구에 직접 부상을 입은 경우 병원에 가기 전 해야 할 응급 처치법은 무엇일까요?",["흐르는 식염수로 눈을 적신다.","계란으로 마사지 한다.","수건으로 살짝 눌러 준다.","두 눈을 모두 가린다."],4,"안구에 상처를 입었을 때 두 눈을 다 가리는 이유는 눈동자 움직임 때문이에요. 안구에 직접 상처가 났을 때 눈동자를 움직이면 상처가 더 심해지는데, 다친 눈을 감더라도 다른 쪽 눈동자가 움직이면 다친 눈동자도 함께 움직이면서 상처가 더욱 커지게 되지요. 작은 상처에도 큰 충격을 받는 눈, 넘버원과 함께 안구 직접 부상의 응급 처치법을 배워 보세요. 1. 안구를 다쳤을 때에는 피가 나더라도 지혈을 하거나 비비는 등 함부로 손을 대지 않습니다. 2. 눈에 이물질이 들어가거나 박혀 있더라도 함부로 빼려 하지 마세요. 3. 안구를 다쳤을 때에는 수건이나 종이컵 등으로 양쪽 눈을 모두 가리고 빨리 병원으로 갑니다."]],[[1,"아기가 열이 나고 몸이 굳으며 손발이 떨리는 열성 경련을 일으킬 때 가장 먼저 해야 할 일은?",["옆으로 눕힌다.","인공호흡을 한다.","손발을 꽉 잡아 준다.","해열제를 먹인다."],1,"아이들의 몸에서 열이 나다가 눈이 돌아가고 몸이 파랗게 변하면서 손발을 떨면서 뻣뻣해지는 증상을 열성 경련이라고 해요. 열성 경련은 5~6개월에서 5세 사이의 어린이 100명 중 5명 정도에게 나타나는 비교적 흔한 증상으로, 대부분의 경우 10분에서 15분 안에 진정됩니다. 열성 경련 자체로는 큰 병이 아니므로 당황하지 말고 먼저 숨을 쉴 수 있도록 숨길을 확보해 주는 것이 가장 중요해요. 1. 혀가 말려 들어가는 것을 막기 위해 아이를 옆으로 눕히고 얼굴을 약간 아래로 향하게 하고 아이의 옷을 벗깁니다. 2. 경련이 어느 정도 멈추면 미지근한 물에 적신 수건으로 아이의 몸을 가볍게 누르듯 닦아 줍니다. 3. 해열제나 물을 먹이거나 인공호흡, 팔다리를 주무르는 등의 행동은 아이의 경련을 악화시키므로 삼가야 합니다. 4. 경련 시간이 너무 길거나 자주 일어나는 경우는 다른 병일 가능성이 있으므로 반드시 의사의 진료를 받아야 합니다."],[1,"인플루엔자 위험집단이 아닌 경우는?",["만성심폐질환자","일반 초등학생","당뇨, 비만인 자","임산부인","65세 이상 노인"],2,""],[1,"신종플루를 이겨내기 위한 평소 건강 생활이 아닌 것은?",["수면을 충분히 취한다.","영양분을 골고루 섭취한다.","흡연은 신종플루에 영향을 미치지 않는다.","개인 식기를 사용하고 숟가락, 젓가락도 개별적으로 사용한다.","평소 환기를 자주 시킨다."],3,""],[1,"다음 중 예초기 안전사고로 옳지 않은 것은?",["예초기 사용 시 칼날이 돌에 부딪히지 않도록 주의한다.","목이 긴 장화나 장갑, 보안경 등 안전장구 착용한다.","날카로운 것에 베인 경우 깨끗한 물로 상처를 씻고 소독약 바른 후 병원에 가서 치료한다.","눈에 이물질이 들어간 경우 일단 고개를 숙인 후 눈을 깜박 거려 자연적으로 빠져나오도록 한다.","몸이 가려울 때는 손으로 긁어 주도록 한다."],5,""],[1,"가정폭력발생 시 대처요령으로 옳지 않은 것은?",["가까운 지구대나 경찰서에 신고한다.","바로 신고하기 어려운 경우 폭력행사의 물증을 수집하고 기록해둔다.","병원에 가서 상해진단서나 치료사실 확인서를 받아둔다.","폭력행위 발생 시 피난할 장소나 길을 미리 생각해둔다.","자신의 귀중품이나 통장은 부모님이나 친지에게 맡기지 않고 자신이 간직해 둔다."],5,""],[1,"안전하게 자전거를 타기 위한 복장으로 옳지 않은 것은?",["복장은 몸에 맞는 것이 좋다.","야간에 자전거를 탈 때에는 다른 사람 눈에 잘 보일 수 있는 어두운 색 옷을 입어야 한다.","벗겨지기 쉬운 슬리퍼나 끈이 늘어져 있는 신발을 신지 않는다.","너무 큰 바지나 통이 넓은 바지, 긴 치마, 긴 목도리 등은 체인에 끼일 수 있어 위험하므로 피 해야 한다."],2,"야간에 자전거를 탈 때에는 다른 사람 눈에 잘 보일 수 있는 밝은 색 옷을 입어야 한다."],[1,"안전띠의 올바른 착용 방법으로 옳지 않은 것은?",["엉덩이를 좌석 깊숙이 두고 앉도록 한다.","안전띠가 꼬이지 않게 하고 허리띠는 골반에 어깨띠는 어깨 중앙에 걸쳐서 맨다.","안전띠는 가슴과 허리에 약간 느슨하게 맨다.","안전띠의 버클을 끼워서 ‘찰칵’하는 잠김 소리를 반드시 확인한다."],3,"안전띠는 가슴과 허리에 착 달라붙는 느낌으로 맨다. 벨트 클립으로 너무 느슨하게 매면 사고 시 안전띠의 효과를 기대하기 어렵다."],[1,"자전거 도로 중 자전거 우선도로에 대한 설명으로 옳은 것은?",["자전거만 통행할 수 있도록 분리대, 경계석, 그 밖에 이와 유사한 시설물에 의하여 차도 및 보도와 구분하여 설치한 자전거도로","자전거 외에 보행자도 통행할 수 있도록 분리대, 경계석, 그 밖에 이와 유사한 시설물에 의 하여 차도와 구분하거나 별도로 설치한 자전거도로","차도의 일정 부분을 자전거만 통행하도록 차선 및 안전표지나 노면표시로 다른 차가 통행 하는 차로와 구분한 차로","자동차의 통행량이 대통령령으로 정하는 기준보다 적은 도로의 일부 구간 및 차로를 정하 여 자전거와 다른 차가 상호 안전하게 통행할 수 있도록 도로에 노면 표시로 설치한 자전거도 로"],4,"① 자전거 전용도로, ② 자전거·보행자 겸용도로, ③ 자전거 전용차로"],[1,"급식 시간의 안전 수칙으로 옳지 않은 것은?",["급식대나 급식운반차를 놀이기구처럼 이용하지 않는다.","식판에 뜨거운 밥이나 국통이 담겨 있을 경우 한 손으로 쥐어 쏟지 않도록 한다.","식판, 젓가락, 포크 등으로 장난치지 않는다.","배식을 받을 때는 질서를 지키고 많은 학생들이 한꺼번에 몰려가지 않도록 한다."],2,"식판에 뜨거운 밥이나 국통이 담겨 있을 경우 두 손으로 꼭 쥐어 쏟지 않도록 한다."],[1,"출입문 안전수칙으로 옳지 않은 것은?",["교실 출입문이나 건물 현관문에 매달리거나 장난치지 않는다.","문을 열고 닫을 때는 주변을 확인할 필요가 없다.","문을 너무 세게 닫지 않는다.","문을 밀어 열 때는 천천히 연다."],2,"문을 열고 닫을 때는 뒷사람이 있는 확인한다."],[1,"전기 안전수칙으로 옳지 않은 것은?",["젖은 손으로 전기기구를 만지지 않는다.","전기기구를 문어발식으로 사용하지 말아야 한다.","콘센트에 완전히 접속하고, 뽑을 때에는 아무렇게 뽑아도 된다.","불량 전기기구를 사용하지 않는다."],3,"코드를 뽑을 때에는 전선을 잡아당기면 피복 안의 구리선이 끊어져 화재와 감전사고의 위험이 있으므로 반드시 플러그를 잡고 뽑아야 한다."],[1,"가스 누출 시 안전대책으로 옳지 않은 것은?",["가스누출이 발견되면 즉시 연소기 코크와 중간밸브를 잠가야 하며 용기의 밸브도 차단한다.","창문을 열어 환기를 시키시고 바닥에 남아있는 가스(LPG)는 방치해도 된다. 비나 방석으 로 쓸어야 한다.","누출된 가스가 폭발할 우려가 있으므로 주변에 라이터불, 버너 등 점화원을 제거한다.","환풍기, 선풍기 등 전기기구 스위치를 끄거나 켜면 스파크가 발생하여 폭발이 일어날 가능 성이 높기 때문에 특히 유의해야 하며 즉시 가스판매소나 도시가스 지역관리소에 연락하여 안 전조치를 받는다."],2,"창문을 열어 환기를 시키시고 바닥에 남아있는 가스(LPG)는 비나 방석으로 쓸어야 한다."],[1,"가정 내의 가스 안전 점검 방법으로 옳지 않은 것은?",["가스 불을 사용할 때에는 창문을 열어 신선한 공기로 충분히 실내를 환기시킨다.","가스레인지 주위에는 가연성 물질(빨래, 스프레이 통 등)을 가까이 두어도 된다.","비눗물이나 세제의 거품으로 가스기구와 호스의 연결부분을 수시로 점검하여 누설 여부를 살핀다.","가스레인지는 항상 깨끗이 청소하여 버너가 막히지 않도록 한다."],2,"가스레인지 주위에는 가연성 물질(빨래, 스프레이 통 등)을 가까이 두지 않도록 한다."],[1,"공연장 관람 시 안전수칙으로 옳지 않은 것은?",["공연장에서 음주 및 흡연을 할 수 있다.","공연장 내에서 관람객이 큰 소리를 지르거나 옆 사람과 장난을 해서는 안 되며, 특히 어린 이와 함께 공연을 관람하는 경우에는 더 주의가 요구된다.","관람석이 아닌 곳에 앉지 않으며, 옥상, 가로수, 담벼락 등에 올라가 관람하지 않는다.","공연 주최자의 안내에 따라 행동하여 공연이 잘 진행될 수 있도록 협조해야 한다."],1,"공연장에서는 음주 및 흡연을 할 수 없다."],[1,"선박 사고 발생 대비 방법으로 옳지 않은 것은?",["구명조끼가 어디에 있는지 확인한다.","화재가 발생하면 소화기로 불을 끄고 유리창을 깨서 환기를 시킨다.","위험한 상황일 경우 구명조끼를 입고 물속에서 행동하기 쉽도록 신발을 신는다.","승무원의 안내에 따라 질서를 유지하며 침착하게 탈출한다.","음주자는 소형선박을 이용해서는 안 된다."],3,""],[1,"다음은 에스컬레이터 안전이용문화에 관한 것이다. 옳은 행동요령은?",["노약자의 무거운 짐을 보고 못 본척한다.","쓰레기를 남몰래 버린다.","에스컬레이터 이용 중에 앞사람을 추월한다.","에스컬레이터를 타고 내릴 때 질서를 생각하지 않고 빨리 행동한다.","동전, 열쇠 등은 떨어뜨리지 않도록 가방이나 주머니에 넣도록 한다."],5,""],[1,"다음 중 복도 및 계단에서 안전수칙으로 옳지 않은 것은?",["비나 눈이 오는 날에 복도나 계단이 미끄러우므로 조심한다.","복도나 계단에서는 한쪽으로 통행을 하며, 천천히 걸어서 다른 사람의 활동을 방해하지 않도록 주의한다.","학급 단위로 또는 여러 사람이 함께 계단 이동 시 앞뒤 사람과 충분한 거리를 두고 이동하도록 한다.","계단을 오르내릴 때에는 난간을 잡고 이동한다.","계단에서는 두 칸씩 이동한다."],5,""],[1,"가정에서 쓰는 전기제품 중 대기전력 소모가 가장 큰 제품은 무엇일까요?",["세탁기","TV","TV 셋톱박스","냉장고"],3,"위성․디지털방송 신호 수신기인 셋톱박스는 디지털로 압축되어 전송되는 위성신호나 케이블방송 신호를 받아 tv에서 인식할 수 있는 신호로 변환하는 장치입니다. 이때 대기상태에서도 항상 입력되는 신호를 변환해야 하기 때문에 전력소모가 매우 높답니다."],[1,"버스 안의 승객들이 어떤 행동을 하는 순간 가장 많은 사고가 일어날까요?",["승차 시 계단에 발을 디딜 때","교통 카드를 찍을 때","하차 전 벨을 누르려고 이동할 때","서서 휴대전화로 통화를 할 때"],3,"우리 가족과 이웃의 발이 되어 주는 버스. 하지만 버스 안에서는 하는 작은 행동 하나가 큰 부상으로 이어질 수 있습니다. 그 중 가장 많은 사고를 일으키는 행동은 바로 하차 전 벨을 누르려고 이동하는 것입니다. 흔들리는 버스 안에 서 있을 경우에는 항상 손잡이를 잡아야 하지만 버스에서 내리려고 벨을 누르거나 문 쪽으로 이동할 때에는 잠깐의 방심으로 손잡이를 잡지 않는 경우가 많아요. 하지만 그 사이 버스가 급정거를 하게 되면 중심을 잃어 넘어지면서 큰 부상을 입게 됩니다. 1. 버스 안에서는 서 있을 때뿐 아니라 자리에 앉아 있을 때에도 손잡이를 잡고 있어야 해요. 벨을 누를 때에는 가까운 곳의 벨을 누르고, 벨을 누르려고 움직여야 할 때에도 반드시 손잡이를 잡습니다. 2. 버스가 멈추는 순간까지 제자리에서 움직이지 말고 기다렸다가 내립니다. 3. 버스 기사는 모든 승객이 의자에 앉고, 서 있는 승객들이 손잡이를 잡았는지 확인한 후 출발해야 해요. 또한 내리려고 기다리는 사람이 없더라도 버스를 세운 후 잠시 기다리면서 내리는 사람이 있는지 확인합니다."],[1,"학교에 들어가기 이전의 어린이들이 가장 많이 교통사고를 당하는 곳은 어디일까요?",["차도","횡단보도","집 앞","유치원 앞"],3,"미취학 어린이들이 가장 많이 사고를 당하는 곳은 바로 집 근처 100m 이내입니다. 특히 자동차의 사각지대 때문에 많은 교통사고가 발생하지요. 사각지대란 운전자가 차 내에 앉아 있을 때 보이지 않게 되는 부분으로, 룸미러로 사이드미러로도 볼 수 없는 곳입니다. 집 앞 주차장이나 골목길에 주차되어 있는 자동차 근처에서 아이들이 있는 것을 미처 발견하지 못해 사고가 나는 것이지요. 어린이 안전사고의 원인인 자동차 사각지대, 그 위험에서 탈출해 봅시다. 1. 운전자는 출발 또는 후진 시, 차 안에서 거울로만 확인하지 말고 차에서 내려 주변을 살피는 습관을 들입니다. 2. 사각지대가 더 많아지게 하는 불필요한 실내 장식과 짙은 선팅은 하지 말고 , 자동차의 트렁크에 짐을 많이 실어 문이 열린 상태로 운행하지 않아야 합니다. 3. 어린이들은 움직이지 않는 차라고 해서 차 주변에서 놀거나 차 밑을 들여다보는 등의 행동을 하지 않도록 합니다."],[1,"안전 운전을 가장 심각하게 위협하는 자동차 불법 개조인 이것은 무엇일까요?",["전조등 램프 개조","번호판 네온 조명 설치","철제 범퍼 설치","야광 계기판 설치"],1,"멋있게 보이기 위해 하는 차량 불법 개조는 자칫 대형 사고를 불러올 수 있습니다. 특히 전조등 램프 개조는 상대방의 운전을 방해해 사고의 위험을 높입니다. 전조등은 야간 운전 시 꼭 필요한 것이지만 너무 밝거나 푸른색의 불빛으로 개조한다면 맞은편에 오고 있는 운전자가 앞을 보지 못할 정도로 눈을 부시게 해 사고의 위험이 있습니다. 불법 개조는 차량을 멋있게 할지 몰라도 안전에는 큰 위협이 됩니다. 1. 지나치게 밝은 불빛으로 전조등을 개조하면 상대 운전자의 운전에 큰 방해가 되고, 사고의 위험도 높아집니다. 전조등은 원래 차량에 장착된 상태로 사용합니다."],[1,"자동차 사고가 났을 때 어린이의 생명을 위협하는 이것은 무엇일까요?",["헤드레스트(머리 지지대)","룸미러","에어백","대시 보드"],3,"사고의 위험으로부터 우리를 지켜 주는 안전 장치는 만 6세에서 13세 정도의 어린이에게 자칫 잘못하면 도리어 흉기가 될 수 있습니다. 특히 에어백은 자체에 충격이 가해지면 백이 순간적으로 부풀어 올라 탑승자가 유리창 밖으로 튕겨 나가는 것을 막아 주고 충격을 흡수해 주는 역할을 하지만 어린아이가 에어백에 잘못 맞게 되면 목뼈가 부러지는 등의 부상을 입어 사망할 위험까지 있습니다. 사고 발생 시 어린이의 피해를 가장 줄일 수 있는 방법을 알아봅시다. 1. 에어백이 터질 때의 충격은 아동을 사망하게 만들 수 있을 정도입니다. 2. 1살 이하, 몸무게 10kg이하의 유아는 뒷좌석에 유아용 후면 안전 의자를 고정시켜 뒤쪽을 보도록 앉힙니다. 또 2살 이상, 몸무게 10~20kg인 유아는 앞을 보는 전면 안전 의자를 차량에 고정시켜 태웁니다. 3. 어린이를 안고 앞좌석에 타는 행동은 절대로 해서는 안 됩니다."],[1,"지진 발생 전 사전 예방 조치로 옳지 않은 것은 무엇일까요?",["천장이나 높은 곳의 떨어질 수 있는 물건은 미리 치워둡니다.","비상시를 대비해 응급처치법을 알아둡니다.","지진 후 가족을 다시 만날 수 있는 장소와 연락방법을 미리 결정해 둡니다.","전열기, 가스기구 등을 쉽게 옮길 수 있도록 느슨하게 둡니다."],4,"전열기, 가스기구 등은 쉽게 넘어지지 않도록 단단히 고정해둡니다. 그리고 평소에 전기배선, 가스 등을 점검하고 불안전한 부분을 수리해둡니다."],[1,"전철을 타고 가다 지진을 느꼈을 경우 대처방법으로 옳지 않은 것은 무엇일까요?",["충격에 대비하여 양손으로 주변 사람을 꼭 붙잡습니다.","서둘러 출구로 뛰어나가는 것은 위험한 행동으로 자제합니다.","차내 방송에 따라 침착하게 행동합니다.","선반위에 올려둔 물건들이 떨어질 수 있음을 유념합니다."],1,"큰 충격이 닥쳐오므로 같이 흔들릴 수 있는 사람보다는 전철의 고정된 횡축(봉)이나 손잡이를 꼭 붙잡고 있어야 합니다."],[1,"자동차를 타고 가다 지진을 느꼈을 경우 대처방법으로 옳지 않은 것은 무엇일까요?",["즉시 속도를 줄이고 비상등을 켭니다.","주의를 하며 자동차를 도로의 왼쪽에 세웁니다.","자동차 라디오의 정보에 귀를 기울입니다.","대피할 필요가 있을 때는 창문은 닫고 문을 잠그지 말고 안전한 곳으로 피신합니다."],2,"자동차는 도로의 오른쪽에 세우고 통제구역에서는 운전을 금지합니다. 이는 대피하는 사람들이나 긴급차량이 통행할 수 있도록 도로의 중앙부분을 비워두기 위함입니다."],[1,"지진해일 발생 시 행동요령으로 옳은 것은 무엇일까요?",["신속히 저지대로 대피합니다.","해안가에서 하던 작업이나 활동을 계속합니다.","우리나라와는 큰 상관이 없으므로 개의치 않습니다.","지진해일 특보를 경청하며 지시에 따릅니다."],4,"일본 서해안에서 지진 발생 후 동해안에는 약 1~2시간 이내에 지진해일이 도달하므로 해안가에서는 작업을 중단하고, 위험물(충돌 시 충격이 큰 물건 등)을 이동시키며, 신속히 고지대로 대피하도록 합니다."],[1,"다음 중 폭풍해일이 발생 시 대처요령에 대한 설명으로 옳지 않은 것은 무엇일까요?",["TV나 라디오를 통한 기상상황이나 해일경보 등을 주의 깊게 듣습니다.","건물 내 높은 곳으로 이동합니다.","철근콘크리트 건물보다는 목조 건물로 이동합니다.","평소 대피장소 및 대피방법을 미리 알아둡니다."],3,"목조 주택은 떠내려 갈 가능성이 있으니 벽돌이나 철근콘크리트 건물로 이동해야 합니다."],[1,"다음 중 해일에 대비한 준비사항으로 볼 수 없는 것은 무엇일까요?",["단수, 정전에 대비하여 식수, 음료, 손전등, 라디오 등을 준비한다.","유리창, 출입문 주변을 정돈한다.","가옥 침수에 대비하여 위험한 것들을 이동시킨다.","창문과 문을 미리 열어둔다."],4,"해일 발생 시 갑자기 바닷물과 물건들이 밀려들어올 수 있으므로 창문과 문을 미리 닫고 테이프로 고정을 시킨 뒤 현관 문턱, 개구멍 등은 수건 등으로 막아둡니다."],[1,"다음 중 낙뢰에 대한 사전예방 조치로 옳지 않은 것은 무엇일까요?",["가급적 외출을 자제 합니다.","비옷보다는 우산을 준비하는 것이 좋습니다.","기상 정보를 미리 확인합니다.","대피소를 미리 파악해둡니다."],2,"우산은 금속으로 된 부분이 있을 수 있으므로 우산보다는 비옷이 안전합니다."],[1,"등산 중 낙뢰가 칠 때 행동요령으로 옳지 않은 것은 무엇일까요?",["신속히 낮은 곳으로 이동합니다.","즉시 몸을 낮추고 물이 없는 동굴 안으로 대피합니다.","야영중일 때는 이불을 깔고 앉아 몸을 웅크립니다.","가족들과 서로 껴안아 체온을 유지합니다."],4,"낙뢰는 주위 사람에게도 위험을 줄 수 있으므로 다른 사람들과 최소 5m 이상 떨어지되, 무릎을 굽혀 자세를 낮추고 손을 무릎에 놓은 상태에서 앞으로 구부리고 발을 모아야 합니다."],[1,"낙뢰를 피하기 위해 해야 할 행동은 무엇일까요?",["금속성 액세서리를 모두 풀고, 인근 나무 밑으로 대피한다.","금속성 액세서리를 풀고, 땅에 납작하게 엎드린다.","금속성 액세서리를 찬 채, 그 자리에서 몸을 낮게 웅크린다.","금속성 액세서리를 찬 채, 흩어지지 말고 모여 앉는다."],3,"벼락이라고도 하는 낙뢰는 천둥과 번개를 동반합니다. 여름철 오후, 특히 산간 지방에 가장 많이 발생하는데, 낙뢰에 직접 맞을 확률은 낮지만 감전사에 이를 수 있으므로 항상 조심해야 해요. 낙뢰는 높은 곳으로 떨어지는 성질이 있기 때문에 갑작스런 낙뢰를 만났을 때에는 무엇보다도 몸을 낮추는 것이 중요해요. 휴대 전화나 금속 등이 낙뢰에 맞을 위험을 높인다고 생각하기 쉽지만 실제로는 금속이 낙뢰를 끌어들이지 않습니다. 액세서리를 풀려고 하지 말고 재빨리 대피하는 것이 더 안전한 대피법이에요. 1. 낙뢰가 칠 경우 주위에 건물이나 자동차가 있으면 재빨리 그쪽으로 대피합니다. 2. 단 자동차의 경우 시동은 끄고, 페달과 핸들에는 손을 대지 않아야 해요. 3. 주변에 건물과 자동차가 없을 경우에는 나무 근처에는 가지 말고, 그대로 자세를 최대한 낮추고 웅크리세요."],[1,"만약 재선충이 의심되는 나무를 발견하면 어디에 신고하는 것이 가장 적절할까요?",["경찰서","학교","기상청","산림청"],4,"재선충이 의심되는 나무를 발견하면 해당 시, 군, 구 산림부서나 산림청(1599-3249)에 신고하는 것이 가장 효율적입니다."],[1,"재선충병 방제 및 예방요령으로 옳지 않은 것은 무엇일까요?",["재선충으로 죽은 나무는 기계를 이용하여 파쇄 합니다.","재선충병에 걸린 나무는 집으로 가져와 양지바른 곳에 옮겨 심습니다.","매개곤충의 우화시기에 맞춰 약제 살포를 하여 매개곤충을 죽입니다.","재선충병에 걸리지 않은 건전한 나무는 나무주사를 놓아 예방합니다."],2,"재선충병에 걸린 나무를 무단으로 이동시키거나 옮기는 것은 병을 확산시키므로 절대 해서는 안됩니다."],[1,"다음 중 쓰나미의 전조 현상으로 옳지 않은 것은 무엇일까요?",["땅이 흔들린다.","하늘에 이상한 형태의 구름이 생겨난다.","바람이 분다.","바다가 부글부글 끓는다."],3,"바닷가에서 바람이 부는 것은 자연스러운 현상이며 오히려 불던 바람이 갑자기 멈춘 경우 쓰나미를 의심해야 합니다."],[1,"다음 중 해일에 관한 설명으로 옳지 않은 것은 무엇일까요?",["태풍 시 행동요령에 맞춰 행동합니다.","지진해일의 경우 진원지가 멀기 때문에 충분히 준비할 시간이 있습니다.","해안에서 멀리 떨어진 급경사가 없고 지형이 높은 안전한 곳으로 이동합니다.","해안에서 멀리 떨어진 곳은 직접적인 파도의 영향이 없으므로 바닥에서 높이가 2~3m만 높아도 비교적 안전합니다."],2,"지진해일의 경우에는 사전예고가 어렵고 피해정도가 심하므로 사전에 충분한 주의와 준비가 필요합니다."]],[[1,"붕괴된 건축물 내부에 있을 때 올바른 행동요령은 무엇일까요?",["불안한 감정을 감추지 말고 큰소리로 웁니다.","성냥, 난로 사용하여 주변을 밝힙니다.","휴대전화를 계속 켜두고 있습니다.","사랑하는 가족을 생각합니다."],4,"가스누출 위험이 있는 경우에는 폭발의 위험이 있으므로 성냥, 난로, 스토브 등을 켜지 말아야 하며 손전등을 이용합니다. 그리고 우는 것보다는 가족을 생각하여 기운을 차리고 사기를 유지하는 것이 중요합니다."],[1,"붕괴된 건물 주변에 있을 경우 올바른 행동요령은 무엇일까요?",["신속한 구조를 위해 재빨리 건물 안으로 뛰어듭니다.","사고현장을 목격했다면 즉시 119에 알립니다.","가까이 다가가 사진을 찍습니다.","혹시 아는 사람이 있는가 싶어 주변을 서성입니다."],2,"절대로 어린이들은 붕괴된 건물로 들어가서는 안됩니다. 추가 붕괴의 위험이 있기 때문입니다. 최초로 사고를 목격했을 경우에는 신속히 주변에 알리거나 119에 신고합니다. 아울러 사고현장은 매우 혼란스럽기 때문에 구조대원들에게 방해가 되지 않도록 현장을 피합니다."],[1,"다음 중 정전 발생 시 조치사항으로 옳지 않은 것은 무엇일까요?",["한 집만 정전인지, 전체 정전인지 확인한다.","엘리베이터 이용 중 정전 시 인터폰으로 연락하고 구조를 기다린다.","불시 정전에 대비하여 가정 내 손전등, 비상식 음료, 휴대용 라디오 등을 사전에 준비한다.","엘리베이터 이용 시 일단 탈출을 시도한다."],4,"우리 집만 정전이 되었을 경우 과부화로 인한 정전일 가능성이 높으므로 누전차단기의 이상 유무를 확인한 뒤 플러그를 뺐다가 다시 작동시키면 됩니다. 엘리베이터에서는 인터폰으로 구조요청하고 임의 탈출을 시도하지 맙시다."],[1,"다음 중 비행기 탑승 전 주의사항으로 옳지 않은 것은 무엇일까요?",["비행 전 승무원의 브리핑에 귀를 기울입니다.","기내 수화물은 유사시 신속한 탈출에 방해되지 않도록 지정된 부피와 무게를 준수합니다.","비행 중 좌석에서는 항상 안전벨트를 착용합니다.","비행 중 지겨울 경우 좌석을 옮겨 다닙니다."],4,"출발 전 배정된 좌석에 착석합니다. 그리고 배정된 좌석을 마음대로 변경하고 이동하는 것은 항공기의비행에 문제를 일으킬 수 있습니다."],[1,"장시간 비행기 여행을 할 때 주의사항으로 옳지 않은 것은 무엇일까요?",["임산부는 비행 중이라도 안전벨트를 매지 않는다.","과식하지 않는다.","비행 중 휴대전화는 사용하지 않는다.","비행 중 콘택트렌즈는 빼고 안경을 낀다."],1,"먼 곳을 편리하고 빠르게 갈 수 있도록 도와주는 비행기. 몇 가지 주의 사항을 잘 지키는 것만으로도 안전하고 편안한 여행이 될 수 있습니다. 임신 초기이거나 8개월 이후의 만삭 임산부는 비행기 여행을 삼가야 하고, 6개월 이내 심장 질환을 앓는 사람, 몸에 가스가 차 있는 기흉 환자, 수술한 후 회복 기간이 지나지 않은 환자 역시 비행기 여행을 미뤄야 합니다. 넘버원과 함께 안전한 항공 여행을 떠나 봐요. 1. 임산부도 비행 중에는 안전벨트를 매야 합니다. 최대한 불편하지 않게 골반과 대퇴부에 벨트를 매 주세요. 2. 휴대전화에서 나오는 전자파는 비행기의 기계에 고장을 일으킬 수 있으니 비행기 내에서 휴대전화를 사용하면 안 됩니다. 3. 비행 전후에 과식하거나 탄산음료를 마시면, 지상과 하늘의 기압 차이로 인해 위장 계통에 있는 음식물이 부풀어 복통을 일으킬 수 있으므로 삼가야 해요. 4. 비행기 안은 건조하므로 되도록 콘택트렌즈보다 안경을 착용하세요. 5. 비행기 안에서는 1시간 간격으로 걷거나 스트레칭을 해 혈액 순환에 이상이 생기지 않게 합니다."],[1,"한 번 열었다가 닫아 둔 것 중 28゜C 실온에서 폭발의 위험이 가장 높은 것은 무엇일까요?",["녹차","이온 음료","과일 주스","오래된 우유"],3,"개봉한 주스는 용기 안으로 공기 중의 미생물이 들어가 증식하는 과정에서 가스를 발생시켜 용기 안의 압력을 증가시키고, 결국 폭발한 위험이 있습니다. 게다가 과일 주스에는 영양분과 수분이 많은데, 이는 미생물이 증식하기 좋은 환경이라 다른 음료수 보다 휠씬 위험하니 모든 음료는 일단 개봉하면 빠른 시간 안에 마셔야 합니다."],[1,"다음 중 전기화재를 예방하는 방법으로 옳지 않은 것은 무엇일까요?",["퓨즈나 과전류 차단기는 반드시 정격용량 제품을 사용합니다.","용량에 적합한 규격 전선을 사용합니다.","스위치, 분전함 등의 내부를 정기적으로 점검합니다.","못이나 스테이플러(종이찍개)로 전선을 고정시킵니다."],4,"못이나 스테이플러로 전선을 고정시킬 경우 전선피복이 벗겨져 합선의 위험이 있습니다."],[1,"방사성 물질이 누출되었다면 어떻게 행동해야 할까요?",["방사선 피폭을 줄이기 위하여 건물 밖으로 대피합니다.","환기를 위해 창문과 출입문을 열어둡니다.","가옥 내에 대피한 주민은 노란색 천을 걸어 건물 내에 대피하고 있음을 표시합니다.","자녀가 학교에 있는 경우 학교로 찾아갑니다."],3,"방사선 피폭을 줄이기 위하여 지하실이나 건물의 중앙으로 대피하고 모든 창문과 출입문을 꼭 닫습니다. 자녀가 학교에 있을 경우 학교에서 집단으로 옥내대피 또는 이동시키므로 학교로 찾아갈 필요가 없습니다."],[1,"낙진이 떨어질 때 취해야 할 행동으로 옳지 않은 것은 무엇일까요?",["외출 시는 우산이나 비옷을 휴대하여 눈·비를 맞지 않도록 주의합니다.","물이 부족할 때는 우물의 물을 퍼와 사용합니다.","옥외에 있던 물이나 식품은 폐기 또는 오염 검사 후 사용합니다.","음식물은 실내로 옮겨 놓고 옥외에서는 음식물을 섭취하지 않습니다."],2,"낙진이 떨어질 때는 가급적 건물 내에서 생활해야 하고 절대 외부의 물이나 음식 등을 함부로 섭취해서는 안 됩니다."],[1,"댐 붕괴 발생 시 관련정보를 알려주는 기관이 아닌 것은 어느 것일까요?",["산림자원공사","댐 관리기관","지자체","소방 방재청"],1,"댐 관리기관에서는 댐 직하류 경보방송을 실시하고, 지자체에서는 방송사 및 언론사를 통한 재난방송을 송출하며 소방 방재청에서는 대국민 재난온라인방송 및 재난문자서비스를 제공합니다. 산림자원공사는 댐 붕괴와 직접적인 관련이 있는 기관이 아닙니다."],[1,"산업현장 4대 필수 안전수칙으로 옳지 않은 것은?",["안전보건교육 실시","보호구 지급・착용","안전작업절차 지키기","행동지침 부착"],4,"① 안전보건교육 실시: 겉치레식 교육이 아닌 실질적인 안전보건교육이 이루어지고 근로 자들이 이를 완전히 숙지한 상태에서 작업을 할 수 있도록 한다. ② 보호구 지급・착용: 여름철에 덥고 귀찮더라고 보호구 착용을 철저히 하여 불의의 사고 에 내 몸을 지키도록 한다. ③ 안전작업절차 지키기: 안전작업절차에 따라 순서대로 작업한다. ④ 안전보건표지 부착: 안전보건표지를 부착해 언제 어디서든 안전사고의 위험을 인식하고 조심하도록 한다."],[1,"일터에 설치된 안전표지판의 종류로 옳지 않은 것은?",["금지표지","경고표지","전달표지","안내표지"],3,"① 금지표지: 어떤 특정한 행동이 허용되지 않음을 나타냄 ② 경고표지: 일정한 위험에 따라 경고를 나타냄 ③ 지시표지: 일정한 행동을 취할 것을 지시함 ④ 안내표지: 안전에 관한 정보를 제공함"],[1,"안전보건표지판의 종류로 어떤 특정한 행위가 허용되지 않음을 나타내며, 흰 바탕에 빨간색과 45°각도의 빗선으로 이루어진 표지판은?",["금지표지","경고표지","전달표지","안내표지"],1,"금비표지 - 어떤 특정한 행위가 허용되지 않음을 나타낸다. 이 표지는 흰 바탕에 빨간색과 45° 각도의 빗선으로 이루어진다. 금지할 내용은 원의 중앙에 검정색으로 표현하며, 둥근 태와 빗선의 굵기는 원외경의 10%이다. 주로 위험한 행동의 금지에 사용되는데 출입 금지, 보행 금지 등에 쓰인다."],[1,"홍수 예·경보 시 대비요령으로 옳지 않은 것은?",["피해가 예상되는 지역 주민은 대피 준비를 하고 물이 집안으로 흘러가는 것을 막기 위한 모래주머니나 튜브 등을 준비한다.","홍수피해가 예상되는 지역의 주민은 라디오나 TV, 인터넷, 스마트폰 등을 통해 기상변화를 알아둔다.","홍수 우려 때 피난 가능한 장소와 길을 미리 알아둔다.","비탈면이나 산사태가 일어날 수 있는 지역으로 이동한다."],4,"비탈면이나 산사태가 일어날 수 있는 지역에 가까이 가지 않는다."],[1,"산사태 징후가 있는 때는 현상으로 옳지 않은 것은?",["경사면에서 갑자기 많은 양의 물이 샘솟을 때","평소처럼 샘물이나 지하수가 잘 나올 때","갑자기 산허리의 일부가 금이 가거나 내려앉을 때","바람이 불지 않는데도 나무가 흔들리거나 넘어지는 때, 산울림이나 땅울림이 들릴 때"],2,"① 경사면에서 갑자기 많은 양의 물이 샘솟을 때 - 이때는 땅속에 과포화 된 지하수가 있다는 것을 나타내므로 산사태의 위험이 커진다. ② 평소 잘 나오던 샘물이나 지하수가 갑자기 멈출 때 - 이때는 산위의 지하수가 통과하는 토양층에 이상이 발생한 것을 나타내므로 위험이 많다고 볼 수 있다. ③ 갑자기 산허리의 일부가 금이 가거나 내려앉을 때 - 이는 산사태가 발생하는 조짐이므로 미리 대피하는 것이 좋다. ④ 바람이 불지 않는데도 나무가 흔들리거나 넘어지는 때, 산울림이나 땅울림이 들릴 때 - 산사태가 이미 시작된 것으로 즉시 대피하고 행정기관에 신고해야 한다."],[1,"번개를 본 후 몇 초 이내에 천둥소리를 들었다면 신속히 안전한 장소로 대피하여야 하는가?",["10초","20초","30초","40초"],3,"번개를 본 후 30초 이내에 천둥소리를 들었다면 신속히 안전한 장소로 대피한다. (약 10㎞이내에 뇌전발생)"],[1,"폭발 대비요령 옳지 않은 것은?",["누출된 가스가 폭발할 우려가 있으므로 주변에 라이터불, 버너 등 점화원을 제거한다.","가연성가스 등이 체류하지 않도록 창문 등을 열어 환기한다.","가스에 의해 눈이 따가울 경우에는 손으로 닦는다.","가스누출이 발견되면 즉시 연소기 코크와 중간밸브를 잠가야 하며 용기의 밸브도 차단한다."],3,"가스에 의해 눈이 따가울 경우에는 깨끗한 물로 씻어야 한다."],[1,"화재의 발생원인 중 물이나 나무, 기름 탱크에 떨어지는 벼락에 의해서 일어나는 화재를 무엇이라 하는가?",["전기화재","유류화재","가재화재","낙뢰에 의한 화재"],4,"낙뢰에 의한 화재: 건물이나 나무, 기름 탱크에 떨어지는 벼락에 의해서 일어나는 화재"],[1,"화재 발생 시 기본 대피방법으로 옳지 않은 것은?",["불을 발견하면‘불이야’하고 큰 소리로 외쳐서 다른 사람에게 알린다.","엘리베이터는 절대 이용하지 않도록 하며 계단을 이용한다.","높은 자세로 안내원의 안내를 따라 대피한다.","아래층으로 대피가 불가능한 때에는 옥상으로 대피한다."],3,"낮은 자세로 안내원의 안내를 따라 대피한다."],[1,"테러의 종류 중 액체, 기체, 고체상태의 독성화학물질을 살포하여 유발하는 테러를 무엇이라 하는가?",["항공테러","열차테러","화학테러","생물테러"],3,""],[1,"화재의 종류 중 발화물을 중심으로 했을 때 마그네슘, 티타늄, 지르코늄, 나트륨, 칼륨 등 가연성의 금속 화재는 몇 급 화재에 해당하는가?",["A급 화재","B급 화재","C급 화재","D급 화재"],4,"A급 화재 : 나무, 종이, 섬유류, 플라스틱 등 일반 가연물의 화재로 타고 나서 재가 남는 화재 B급 화재 : 휘발유 또는 석유와 같이 불에 타기 쉬운 가연성 액체 또는 프로판 가스와 같은 가연성 가스류 화재 C급 화재 : 변압기, 전기다리미, 거푸집 등 전기를 통한 상태의 전기 기기에서 일어난 화재 D급 화재 : 마그네슘, 티타늄, 지르코늄, 나트륨, 칼륨 등 가연성의 금속 화재"],[1,"아파트에서 화재가 발생한 경우 대처 요령으로 옳지 않은 것은?",["먼저 화재 상황을 신속히 파악하고 침착하게 화재 발생을 가족과 이웃에게 알린다.","침착하게 불이 난 건물의 위치, 건물 개요(동, 호수), 화재의 상태, 갇힌 사람의 유무 등을 117로 신고한다.","화재의 발견이 늦었거나 초기 소화 작업이 곤란할 정도로 불이 번진 경우 젖은 수건 등으 로 코와 입을 막은 후 낮은 자세로 대피한다.","아파트 계단에 연기가 가득하여 대피가 곤란한 경우에는 베란다에 설치된 비상탈출구(경량 칸막이)를 파괴 후 옆집 세대로 대피한다."],2,"화재발생 신고는 119이다."],[1,"건물이나 집에 연기가 들어올 경우 대처 요령 방법으로 옳지 않은 것은?",["방안으로 연기가 들어오지 못하도록 문틈을 옷이나 커튼, 이불 등으로 막는다. (이때, 물을 적시면 더욱 좋다.)","주위에 물이 있으면 옷에 물을 적셔 코와 입을 젖은 수건 등으로 막아 연기가 폐에 들어가 지 않도록 한다.","불길 속을 통과할 때에는 빠르게 달려 통과 한다.","연기가 많은 곳에서는 팔과 무릎으로 기어서 이동하되 배를 바닥에 대고 가지 않도록 한다."],3,"불길 속을 통과할 때에도 물에 적신 담요나 수건 등으로 몸과 얼굴을 감싸준다."],[1,"일반 소화기 사용 방법으로 옳지 않은 것은?",["소화기를 불이 난 곳으로 옮긴다.","손잡이 부분의 안전핀을 뽑는다.","바람을 정면으로 마지며 서서 호스를 불쪽으로 향하게 한다.","손잡이를 힘껏 움켜쥐고 빗자루로 쓸 듯이 뿌린다."],3,"바람을 등지고 서서 호스를 불쪽으로 향하게 하여야 한다. 불길이 자신에게 오는 것을 막을 수 있다."],[1,"건물이 무너져 갇혔을 때 구조 요청 방법으로 국제적으로 통일된 구조 요청 신호에 해당하는 것은?",["1분에 6회 짧게 신호 → 1분 쉬고 → 1분에 6회 짧게 신호(반복)","1분에 7회 짧게 신호 → 1분 쉬고 → 1분에 7회 짧게 신호(반복)","1분에 8회 짧게 신호 → 1분 쉬고 → 1분에 8회 짧게 신호(반복)","1분에 9회 짧게 신호 → 1분 쉬고 → 1분에 9회 짧게 신호(반복)"],1,"- 국제적으로 통일된 구조 요청 신호 : 1분에 6회 짧게 신호 → 1분 쉬고 → 1분에 6회 짧게 신호(반복) - 국제적으로 통일된 구조 응답 신호 : 1분에 3회 길게 신호 → 1분 쉬고 → 1분에 3회 길게 신호(반복)"],[1,"인질 상황 발생 시 대응 요령으로 옳지 않은 것은?",["납치 후 처음 15-45분이 가장 위험한 시기이며, 납치의 초기 단계에서의 납치범들은 감정 적으로 매우 격하고 위험한 상태에 있음을 감안해야 한다.","가능한 빨리 자신의 감정을 통제하여 놀라거나 자제력을 잃지 않고 침착하게 행동하여, 눈 에 띄는 행동은 자제한다.","납치범의 신경을 건드리지 않기 위해 휴대폰을 꺼둔다.","반항적인 행동은 납치범으로부터 폭력적인 반응을 가져올 수 있음을 감안, 말을 되받아치거 나 거칠게 행동하는 것은 자제한다."],3,"휴대폰을 켜두면 위치 추적이 가능하여 구출 활동에 크게 유용하기 때문에 반드시 전원을 꺼두고 있는다."],[1,"해외여행 시 여권 도난/분실 시 행동 요령으로 옳지 않은 것은?",["여권을 도난/분실했을 경우, 즉시 재외 공관(대사관, 영사관)에 신고한다.","여권을 재발급 받거나 여행증명서를 발급받아야 한다.","중국에서는 여행증명서 외에 중국 공안당국이 발행한 여권 분실 증명서가 있어야 출국이 가능하므로 반드시 중국 공안당국으로부터 여권 분실 증명서를 발급 받도록 한다.","분실 신고 된 여권은 나중에 되찾았을 경우에도 재사용 가능하다."],4,"분실 신고 된 여권은 즉시 무효가 되며, 나중에 되찾았을 경우에도 재사용이 불가하고 이미 받아놓은 비자도 효력을 잃게 된다."],[1,"건물 전체가 화염에 뒤엎였던 9.11사고. 생존자들이 건물 내에서 대피 할 수 있던 방법은 무엇이었을까요?",["옥상으로 올라가 헬기로 구조되었다.","화물용 엘리베이터로 탈출했다.","수건으로 호흡기를 가리고 구조될 때까지 기다렸다.","방화문을 닫고 비상계단으로 탈출했다."],4,"고층 건물 전체가 연기와 불꽃에 휩싸였던 9.11 사고에서 많은 사람들이 무사히 빠져나올 수 있었던 것은 연기가 퍼지지 않은 비상계단을 이용했기 때문입니다. 방화문은 건물에서 화재가 발생할 경우, 연기가 불길이 다른 층으로 번지는 것을 막아 사람들이 비상계단을 통해 안전하게 탈출할 수 있도록 하는 문을 말합니다. 소방법에 따라 평소에도 늘 닫아 두어야 해요. 화재가 발생했을 때 연기나 불길을 막아 주는 방화문, 안전한 사용법을 알아봐요. 1. 방화문은화재가 일어났을 때 불꽃과 연기가 다른 층으로 번지는 것을 막아주는 역할을 하므로 평소에도 반드시 닫아 두어야 합니다. 2. 대피할 때 방해가 될 수 있으므로 방화문 주변의 비상계단에는 화분, 자전거 등의 물건을 두지 말아야 해요. 3. 화재가 났을 때에는 연기를 마시지 않도록 젖은 수건 등의 천으로 코와 입을 막고 침착하게 비상계단으로 대피합니다."],[1,"올바른 의약품 보관방법으로 옳지 않은 것은?",["의약품은 어린이의 손이 닿지 않는 곳에 보관한다.","의약품을 사용한 후에는 항상 마개를 잠그고 표시된 방법으로 보관한다.","의약품은 사용도중 용기를 바꾸거나 옮겨 담아도 된다.","의약품은 습기, 고온, 직사광선을 피해 보관한다."],3,"의약품은 사용도중 용기를 바꾸거나 옮겨 담지 않는다."],[1,"유통기한이 지난 약의 올바른 처리방법으로 옳지 않은 것은?",["무조건 폐기한다.","유통기한이 지난 약은 효과와 품질을 보장할 수 없다.","물약은 알약이나 가루약보다 더 안정하여 오래두어도 성질이 변하지 않는다.","가정에서 사용하지 않는 의약품은 가까운 약국이나 보건소에 가져가서 폐기한다."],3,"물약은 알약이나 가루약보다 더 불안정하여 오래두면 성질이 변하기 쉽다."],[1,"인터넷 중독 예방수칙으로 옳지 않은 것은?",["컴퓨터는 자기 방에 두고 사용한다.","방과 후 할 일을 먼저 한 후 컴퓨터를 켠다.","학습이나 과제 수행을 위한 인터넷 활용을 늘린다.","하루에 사용하는 컴퓨터 시간을 미리 정해둔다."],1,"컴퓨터는 가족이 공유하는 장소에 두고 사용한다."],[1,"카페인을 몇 ㎎이상 섭취하면 중독증상이라고 부를 수 있는 증상이 나타나는가?",["300㎎","500㎎","700㎎","1000㎎"],2,"카페인을 500㎎이상 섭취하면 중독증상이라고 부를 수 있는 증상이 나타난다. 그 증상은 용량에 비례하여 불안, 불면증, 불안정, 과민성, 정신신체증상 호소(예: 근육 경축, 홍조, 오심, 소변 과다, 소화기관 장애, 불면 등)등이다. 개인에 따라 보다 소량에서도 이러한 중독증상이 나타날 수 있다."],[1,"청소년은 흡연을 시작한 지 몇 개월 내에 흡연 중독과 같은 증상을 보이며, 금연 시 금단 증상이 나타나는가?",["12개월","18개월","23개월","24개월"],3,"청소년은 흡연을 시작한 지 23개월 내에 흡연 중독과 같은 증상을 보이며, 금연 시 금단 증상이 나타날 수 있다."],[1,"인터넷 중독 중 특정한 정보를 찾는다는 목적 없이 괜히 인터넷으로 정보만을 병적으로 검색 하는 것을 무엇이라 하는가?",["인터넷채팅중독","인터넷검색중독","인터넷게임중독","인터넷음란물중독"],2,"인터넷채팅중독: 인터넷으로 하는 채팅에 병적으로 집착하여 사용하는 것 인터넷검색중독: 특정한 정보를 찾는다는 목적 없이 괜히 인터넷으로 정보만을 병적으로 검색 하는 것 인터넷음란물중독: 인터넷으로 성인음란물을 보거나, 사이버 섹스 등을 병적으로 하는 것"],[1,"스마트폰 중독으로 인한 문제점이 아닌 것은?",["부모와의 소통 강화","공부나 학습 방해","장시간 스마트폰을 들여다보면 시력이 저하될 수 있음","수면장애"],1,"스마트폰 중독의 문제점 · 부모와의 대화 단절 · 공부나 학습 방해 · 장시간 스마트폰을 들여다보면 시력이 저하될 수 있음 · 수면장애 · 사이버공간에서의 따돌림을 많이 겪을 수 있음"]],[[1,"인터넷게임을 중독적으로 사용하면 가장 먼저 나타나는 신체질환은?",["안구 건조증 및 시각 장애 : 가장 ! 동상에 걸리면 물집과 통증이 생길 뿐만 아니라 3도 이상인 경우에는 뼈에 악영향을 끼쳐 성장에 문제를 일으킬 수 있습니다. 동상에 걸렸을 때에는 최대한 아전하게 손상된 피부 조직을 녹이는 것이 중요해요. 이때 직접 열을 가하면 화상을 입는 등 오히려 상태가 악화되니 미즈근한 물에 30분 이상 동상 부위를 담가 피부 조직을 서서히 녹여야 하고 물집이 생겨도 절대로 터뜨리면 안돼요. 예방과 신속한 조치로 동상의 위험에서 탈출해요. 1. 동상은 젖은 옷이나 신발을 착용했을 때 휠씬 쉽게 생겨요. 스키장이나 눈썰매장에서 반드시 방수가 되는 장갑과 신발, 옷을 착용하세요. 2. 옷이 젖은 경우에는 바로 갈아입고, 마른 수건으로 피부의 물기와 땀을 닦은 후 잘 말려야 합니다. 3. 추운 곳에서는 한 시간 이상 놀지 말고, 놀고 난 뒤에는 반드시 따뜻한 곳에서 충분히 쉬어야 해요."],[1,"크게 베인 상처 때문에 일어난 과다 출혈에 대한 응급조치로 옳은 것은 무엇일까요?",["상처의 윗부분을 끈으로 단단히 감아서 지혈한다.","상처 부위의 작은 유리 조각까지 모두 제거하고 지혈한다.","상처 부위를 그대로 둔 채, 피가 나는 곳을 직접 지혈한다.","피가 젖은 수건을 계속 갈아 주면서 지혈한다."],3,"우리 몸의 혈액은 체중의 약 7%로, 체중이 25kg인 어린이의 혈액량은 약 ①8L 정도입니다. 이중 700ml 정도의 피만 흘러나가도 목숨을 잃게 돼요. 피부에 큰 상처가 나면 많은 양의 피가 한꺼번에 빠져나오는데, 빨리 지혈하지 않으면 과다 출혈로 목숨을 잃을 수도 있을 만큼 위험합니다. 강한 압력으로 피가 흐르는 동맥에 상처를 입은 경우 2~3분 안에 ①5L의 피가 나오므로 빨리 지혈하지 않으면 생명을 잃게 됩니다. 응급 상황인 과다 출혈이 일어났을 때는 이렇게 하세요. 1. 상처 위에 깨끗한 천이나 거즈를 대고 세게 누르면서 지혈합니다. 천이 젖어도 갈지 말고 덧대 가면서 사용하세요. 천을 뗄 때 천에 붙은 상처 부분이 함께 떨어져 피가 더 많이 날 수 있습니다. 2. 상처 부위를 끈 등으로 묶으면 신경 조직이나 혈관이 손상되고 피부의 조직이 상하므로 묶어서는 안돼요. 3. 상처에 이물질이 박혀 있으면 그대로 둡니다. 이물질이 혈관을 막아 피가 천천히 흐르게 하고 있을 수도 있고, 이런 경우 이물질을 뽑아내면 출혈이 더 심해집니다. 이물질이 움직이지 않도록 고정하고 환자를 병원으로 옮깁니다."],[1,"혼자 있다가 뱀에 물렸을 때 가장 먼저 해야 할 행동은 무엇일까요?",["상처 윗부분을 피가 통하지 않게 힘껏 묶는다.","물린 부위에 부목을 댄 후 상처를 심장보다 낮게 한다.","상처 부위에 십자 모양 칼집을 낸 후 피가 흐르게 한다."],2,"독사에게 물렸을 때 가장 먼저 해야 할 응급 처치는 독이 피를 통해 온몸으로 퍼지지 않도록 막는 것입니다. 흔히 독사에게 물리면 독을 입으로 빨아내야 한다고 생각하지만 입 안에 작은 상처라도 있을 경우 오히려 위험해지므로 이 방법은 삼가야 해요. 생명을 위협하는 독사의 독! 넘버원과 함께 독사의 위험에서 탈출해요. 1. 독서에게 물린 경우 빨리 119에 신고하여 구조를 요청해야 합니다. 2. 구조를 기다리는 동안 상처 부위의 근육을 절대로 움직이지 말고, 상처 부위의 높이를 심장보다 낮춰야 해요. 3. 상처 부위의 위쪽으로 10cm쯤 떨어진 곳을 부목 등의 딱딱한 것을 대서 움직일 수 없게 고정시킵니다. 4. 칼로 칼집을 내 피를 흘리거나 입으로 독을 빠는 방법은 감염의 위험이 있으므로 해서는 안 됩니다. 5: 피가 흐르면 지혈하지 말고 계속 흐르도록 둡니다."],[1,"즐거운 바다에서의 물놀이를 할 때 방심하는 사이에 무서운 사고로 이어질 수 있습니다. 다음 중 안전을 위협하는 행동은 무엇일까요?",["튜브에 공기를 가득 채운다.","물에 들어가기 전에 준비 운동을 충분히 한다.","안전한 곳의 경계를 표시한 부표를 넘어선 곳까지 가지 않는다.","바다에서 고립됐을 때 가슴을 양손으로 감싸고 웅크린다."],1,"즐거운 바다의 물놀이. 그렇지만 방심하는 사이에 무서운 사고로 이어질 수 있습니다. 물놀이를 할 때 많이 사용하는 튜브에는 공기를 가득 채워야 한다고 생각하지만 실제로는 살짝 눌리는 정도인 70%만 채우는 것이 안전 하다는 것, 알고 있나요? 공기는 온도가 높아질수록 팽창하는 성질을 가지고 있고, 그 힘은 고무가 터질 정도로 큽니다. 공기가 가득 채워진 튜브에 뜨거운 햇볕이 오래 쬐인다면 튜브 안의 공기가 팽창해 터질 위험이 있습니다. 따라서 손으로 눌렀을 때 살짝 눌리는 정도만 채우는 것이 안전합니다. 1. 물에 들어가기 전에 물의 깊이와 온도를 파악하고, 준비 운동을 합니다. 또한 구조 요원과 의무실의 위치를 알아 두어야 해요. 2. 물속에서 위급한 상황이 생기면 한쪽 팔을 최대한 높이 들고 흔들어 도움을 청하세요. 또한 안전한 곳의 경계를 표시한 부표를 넘어선 곳까지 가서는 안 되고, 해수욕장의 안내 방송에 귀 기울여야 해요. 3. 다른 사람들과 떨어져 물속에 고립된 위기 상황일 경우 심장의 온도가 떨어지지 않도록 양손으로 가슴을 감싸 안고 몸을 웅크리는 것이 안전한 자세입니다."],[1,"한여름에 강한 햇볕을 받으면 표면 온도가 80℃ 이상까지 올라가서 어린아이가 손을 댈 경우 2도 화상까지 입을 수 있는 이것은 무엇일까요?",["벤치","보도블럭","자동차","잔디 운동장"],3,"한여름에 강한 햇볕을 받은 자동차의 표면 온도는 80℃ 이상까지 올라갑니다. 특히 검은색 자동차는 피부가 약한 어린아이가 2도 화상까지 입을 수 있을 정도로 뜨거워지지요. 같은 자동차라도 색에 따라 표면 온도가 다른 이유는 색에 따라 빛에 대한 반사율이 다르기 때문입니다. 흰색은 반사율이 높아 온도가 많이 올라가지 않지만 검은색은 빛을 반사하는 것보다 흡수하는 양이 많기 때문에 온도가 더욱 높아집니다. 게다가 자동차의 주재료인 철은 나무나 돌 등의 물체보다 빠른 시간에 열이 전해져 다른 사물보다 온도가 금방 높아지게 됩니다. 흉기가 될 수 있는 한여름의 자동차, 안전한 자동차 이용에 대해 알아보아요. 1. 검은색 차인 경우에는 되도록 그늘에 주차하거나 지하 주차장을 이용합니다. 햇볕이 뜨거우면 차 내부의 온도 역시 높이 올라가므로 창문을 1~2cm정도 열어 두는 것도 좋아요. 2. 뜨거워진 차에 탈 때에는 좌우 문을 모두 열어 실내의 뜨거운 공기를 빼낸 후 타세요. 어린이가 탈 때에는 좌석을 만져 온도를 확인한 후 탑니다. 3. 성인에 비해 체온 조절 기능이 떨어지는 아이들은 차 안의 높은 온도로 인해 열사병이 걸리거나 질식을 할 위험이 있으므로 어린이를 혼자 차 안에 두면 절대 안 됩니다."],[1,"전철을 탈 때의 주의사항으로 옳지 않은 것은 무엇일까요?",["객차와 객차 사이의 연결 부분에는 타지 않는다.","타고 내릴 때 발이 빠지지 않도록 조심한다.","노란 선에서 한 걸음 물러서서 전철을 기다린다.","전철에 타서는 출입문에 기대어 있는다."],4,""],[1,"자동차에서 옆에서 밀어서 열고 닫는 슬라이딩 도어에 의한 사고를 예방할 수 있는 방법으로 옳지 않은 것은 무엇일까요?",["슬라이딩 도어를 닫기 전에는 손이나 발이 문틀에 걸쳐 있지 않은지 확인한다.","어린이가 탔을 경우 보호 잠금 장치를 이용해 어린이가 문을 함부로 여닫지 못하게 한다.","경사가 진 길 위에서 슬라이딩 도어를 열고 닫는다.","옆에 다른 차량이 오는 것을 확인한 후 인도에 바짝 붙여 차를 세운다."],3,"옆으로 밀어서 열고 닫는 슬라이딩 도어에 의한 사고는 심할 경우 사망에 이를 정도로 피해가 엄청납니다. 이런 문은 닫히는 힘이 일반 여닫이문의 약2배에 달하고, 문의 이음새가 날카로운 금속으로 처리되어 있어 그 사이에 신체 일부가 끼인다면 큰 사고로 이어질 수 있습니다.또한 경사진 길 위라면 문을 살짝만 건드려도 빠른 속도로 닫혀 위험도가 더욱 높습니다. 1. 슬라이딩 도어를 닫기 전에는 손이나 발이 문틀에 걸쳐 있지 않은지 2. 어린이가 탔을 경우 보호 잠금 장치를 이용해 어린이가 문을 함부로 여닫지 못하게 합니다. 3. 옆에서 오는 다른 차량은 문이 열리는 것을 보지 못해 교통사고로 이어질 수 있으니 차는 항상 인도에 바짝 붙여 세웁니다."],[1,"14세 이하 어린이가 당하는 안전사고 중 가장 많이 일어나는 사고는‘찔림, 베임'입니다. 이러한 안전사고를 예방할 수 있는 방법으로 알맞은 것은 무엇일까요?",["다 먹은 아이스크림 막대는 입에 문 채로 다닌다.","가위는 사용한 후 벌려진 상태로 그대로 둔다.","칼이나 뾰족한 연필은 사용한 후에 반드시 제자리에 둔다.","꼬치 음식은 꼬치에 꽂힌 채로 음식을 먹는다."],3,"어린이 안전사고는 집, 놀이터, 학교 등 시간과 장소에 관계없이 늘 일어나요. 그 중 14세 이하의 어린이가 가장 많이 당하는 부상은 바로 찔림, 베임입니다. 특히 우리가 사용하는 빨대, 포크, 옷걸이, 우산, 가위, 이쑤시개 등에 다치는 경우가 많아요. 끝부분이 뾰족하고 날카로워 잘못 다루거나 보관하면 나는 물론 타인까지 다치게 할 수 있기 때문입니다. 위기탈출 넘버원과 함께 찔림, 베임 사고로부터 안전해지는 법을 배워 보세요. 1. 다 먹은 아이스크림 막대나 포크 등을 입에 문 채로 다니지 않도록 합니다. 2. 꼬치 음식은 그릇에 음식을 빼서 먹고, 음료를 마실 때는 되도록 빨대 대신 안전한 컴을 이용합니다. 3. 가위나 칼, 뾰족한 연필 등의 위험한 물건을 사용한 후에는 반드시 제자리에 둡니다. 특히 가위는 꼭 오므려 놓고, 칼은 칼날을 꼭 넣어 두어야 합니다."]],[[1,"동화책은 위험해 보이지 않지만 의외로 많은 어린이들이 동화책에 찍히거나 베이는 사고를 당합니다. 이런 사고를 예방하는 방법으로 알맞지 않은 것은 무엇인가요?",["모서리가 둥글게 처리되어 있는 동화책을 구입한다.","헝겊, 스펀지로 되어 있어 안전사고의 위험이 적은 동화책을 구입한다.","책표지 모서리가 날카로워도 그냥 둔다.","날카로운 종이의 날 부분에는 투명 테이프를 붙인다."],3,"알록달록한 그림과 재미있는 이야기가 있는 동화책. 위험해 보이지 않지만 의외로 많은 어린이들이 동화책에 찍히거나 베이는 사고를 당합니다. 동화책 겉표지는 쉽게 구겨지지 않도록 딱딱한 소재로 되어 있기 때문이에요. 이런 단단한 표지는 모서리가 날카롭고 강하기 때문에 부딪히면 큰 상처가 날 수 있습니다. 또한 선명한 색을 위해 사용한 두꺼운 종이에 손을 베이는 경우도 많아요. 넘버원과 함께 안전하고 즐겁게 동화책을 읽어 보아요. 1. 어린이용 책은 모서리가 둥글게 처리되어 있거나 헝겊, 스펀지로 되어 있어 안전사고의 위험이 적은 것으로 구입합니다. 2. 이미 구입한 책의 경우 표지의 모서리가 가위로 잘라 둥글고 뭉툭하게 만듭니다. 3. 날카로운 종이의 날 부분에는 투명 테이프를 붙여 베임 사고를 방지합니다."],[1,"어린이가 사탕이 목에 걸려서 기도가 막혔을 때 가장 먼저 해야 하는 취해야 하는 응급처치법은 무엇일까요?",["뒤에 서서 배꼽과 명치 사이를 강하게 친다.","심폐소생물을 실시하면서 구조대를 기다린다.","똑바로 눕혀 기도를 확보하고 인공호흡을 한다.","손가락을 입 속 옆쪽으로 깊숙이 넣어 기도의 이물질을 빼낸다."],1,"기도에 이물질이 걸려 기도가 막혔을 때 의식이 있는 두 살의 이상의 어린이와 어른의 경우에는 하임리히 응급처치법을 이용합니다. 기도가 막혔을 때는 하임리히 응급처치법으로 위기에서 탈출해요. <의식이 있는 경우> 1. 구조하는 사람이 환자의 뒤에 서서 한 손을 환자의 배꼽 위쪽에 두고 그 위에 다른 손을 올립니다. 2. 두 손을 감싸 쥐고 복부를 등쪽으로 강하게 밀쳐 올리는 동장을 이물질이 나올 때까지 반복합니다. 3. 이물질이 나왔더라도 몸 안에 손상을 입지 않았는지 확인하기 위해 병원에 가야 해요. <의식이 없는 경우> 1. 민감한 부위인 가슴을 꼬집어서 의식이 없으면 고개를 돌려 눕히고 손가락을 입속 옆쪽으로 깊숙이 넣어 기도의 이물질을 훑어 빼냅니다. 2. 이물질을 제거하고도 의식이 돌아오지 않으면 심폐소생술을 실시하면서 구조대를 기다립니다."],[1,"차량 운행 중 신호위반이 되는 경우 2가지는 무엇일까요?",["적색 신호 시 정지선을 초과해 정지","교차로에 이르기 전 황색 신호 시 교차로에 진입","황색 점멸 신호 시 주의하면서 진행","적색 점멸 신호 시 정지선 직전에 일시 정지한 후 교통상황에 주의하며 진행"],1,"적색 신호는 차량이 멈추라고 하는 신호입니다. 그러므로 적색 신호에는 정지선을 넘기 전에 정지해야합니다. 황색 신호에는 운전자들이 흔히 속도를 내어 빨리 지나가려고 하지만 황색 신호도 교차로의 정지선 직전에 정지해야 하는 신호입니다. 적색 신호, 황색 신호 모두 정지선을 넘어가면 신호 위반이 될 뿐만 아니라 보행자나 다른 방향에서 진행하는 차량에 위험요소로 작용할 수 있기 때문에 정지선에 반드시 정지하는 습관을 들여야 합니다. 부모님들께도 꼭 강조해주세요."],[1,"교차로에 접근 중인 차량이 자신의 진행 신호가 바뀌는 것을 보고 정지선에 정지해야할지 계속 진행할지를 결정해야 하는 구간을 무엇이라고 하나요?",["딜레마 존","노파킹 존","스피드 존","스톱라인 존"],1,"신호등이 설치되어 있는 교차로를 통과할 때 운전자는 자신의 진행 신호가 바뀔까 노심초사 하는 경우가 있습니다. 이와 같이 신호가 바뀌는 것을 보고 정지선에 서야할지 아니면 진행해야 할지를 결정해야 하는 구간을 ‘딜레마 존’이라고 합니다. 여기서 ‘딜레마’란 선택해야 할 길은 두 가지 중 하나로 정해져 있는데, 그 어느 쪽을 선택해도 바람직하지 못한 결과가 나오게 되는 곤란한 상황을 말하고, ‘존’이란 일정한 범위의 구역을 말합니다. 운전자는 교차로에 접근할 때 언제든 사람과 다른 차량이 나타날 수 있음을 잊지 말고 주의 운전을 해야 합니다."],[1,"자전거를 타기 30초전 점검 할 주요사항이 아닌 것은 무엇일까요?",["타이어의 바람상태","브레이크 작동여부","체인상태","교통 수신호 방법 익히기"],4,"자전거 안전 확인 사항은 ABC로 기억하면 좋습니다. A는 Air(바람상태), B는 Break(브레이크), C는 Chain(체인)입니다. 이 세 가지가 정상적이지 않으면 자전거를 제대로 운행할 수 없습니다. 그리고 자전거를 탈 때는 꼭 보호장구를 착용하고 차가 많이 다니는 도로가 아닌 자전거 전용도로를 이용하는 것이 안전합니다."],[1,"다음 중 장거리 고속버스를 안전하게 타고 있는 어린이는 누구일까요?",["안전벨트를 매지 않고 뒤돌아보고 이야기하는 아이","안전벨트를 매지 않고 졸고 있는 아이","자리에 앉지 않고 서서 장난치는 아이","안전벨트를 매고 앉아 있는 아이"],4,""],[1,"다음 중 안전한 자전거 타이어에 대한 설명으로 올바른 것은?",["구멍이 뚫린 타이어","찢어진 타이어","홈이 달아진 타이어","공기가 팽팽하게 들어간 타이어"],4,""],[1,"어린이 통학버스는 무슨 색일까요?",["빨간색","녹색","노란색","검정색"],3,""],[1,"안전한 자전거의 특징으로 볼 수 없는 것은 무엇일까요?",["자전거에 올라타서 두발 끝이 땅에 닿는 자전거","핸들의 높이가 너무 높지 않은 자전거","브레이크가 잘 듣는 자전거","반사체가 부착되지 않은 자전거"],4,""],[1,"공공장소에서 많이 일어나는 사고에 대한 설명으로 알맞지 않은 것은 무엇일까요?",["회전문, 자동문 - 손가락이나 몸이 문틈에 끼이는 사고","엘리베이터 – 문틈에 신체의 일부가 끼이는 사고","쇼핑카트 – 무빙워크에서 미끄러져 내려가 충돌하는 사고","에스컬레이터 – 신발 끈이나 신체의 일부가 끼이는 사고"],3,"쇼핑카트로 인해 일어나는 사고는 주로 아이들이 쇼핑카트 주변을 뛰어다니다가 충돌하는 사고나 탑승해서 장난을 치다가 떨어지거나 손가락 등이 카트에 끼이는 사고가 많이 일어납니다. 따라서 물건을 담는 곳에는 절대 올라타지 않고 아이들끼리 장난을 치면서 쇼핑카트를 밀고 다니는 일이 없도록 주의해야 합니다."],[1,"어린이 보호구역은 일반적으로 학교의 정문 출입구로부터 몇m를 지칭합니까?",["100m","200m","300m","500m"],3,"어린이보호구역이란 초등학교 및 유치원 주출입문에서 반경 300m 이내의 주통학로를 보호구역으로 지정하여 교통안전시설물 및 도로부속물 설치로 다음 빨리 뛰어 공을 주워온다"],2,"주차된 차 사이나 좁은 골목길에서 아이가 도로로 갑자기 뛰어나올 경우 운전자의 시야에서는 아이가 보이지 않을 수도 있고, 보고 즉시 브레이크를 밟더라도 차량은 바로 멈추지 못하므로 큰 사고로 이어질 수 있습니다. 따라서 공이 찻길로 굴러갔을 경우 찻길에서 멈춘 다음 차가 오는지 살피고 차가 오지 않을 경우 천천히 공을 주워오거나 주위에 어른이 있다면 도움을 요청해야 합니다."],[1,"화재 시 대피 방법으로 틀린 것은?",["고층건물에서 불이나면 엘리베이터를 타고 빨리 대피한다.","수건이나 헝겊에 물을 적셔 코에 대고 자세를 낮춘 뒤 대피한다.","몸에 불이 붙은 경우 멈추고, 엎드리고 몸을 구른다.","불이 난 경우 신속하게 화재가 난 곳에서 대피를 한 후 119에 신고를 하거나 소리를 질러 주변에 알린다."],1,"고층건물에서 화재가 나면 열기와 연기가 위쪽으로 빠른 속도로 번지면서 전기시설을 태워 정전이 되는 경우가 많으므로 전기로 작동하는 엘리베이터는 작동을 멈추게 됩니다. 수건이나 헝겊에 물을 적셔 코에 대고 자세를 낮춘 뒤 계단을 통해 신속히 대피해야 합니다."],[1,"횡단보도는 어느 쪽으로 걷는 것이 안전할까요?",["왼쪽","중앙","오른쪽"],3,"도로에서 보면 차량은 오른쪽으로 진행하지만 횡단보도에서 보면 차량은 왼쪽에서 진입하게 됩니다. 따라서 정지선에서 멀리 떨어져 있는 횡단보도의 오른쪽에서 건너는 것이 안전합니다."],[1,"안전한 장난감 선택 및 사용법에 대한 설명으로 바르지 않은 것은 무엇일까요?",["안전을 위해 KC마크를 확인한다.","뾰족하거나 날카로운 부분이 있는 장난감은 구입하지 않는다.","제조자명, 전화번호 등 품질표시 사항 및 A/S기간 등을 확인한다.","중고 장난감의 경우 안전하게 사용하던 것이므로 깨끗하게 닦아 안심하고 사용한다."],4,"아이들이 많이 가지고 노는 장난감. 장난감을 선택하고 사용할 때도 안전에 유의해야 합니다. 안전한 장난감을 선택하기 위해 KC마크를 확인하고, 뾰족하거나 날카로운 부분이 있는 장난감은 구입하지 않으며, 아이의 연령에 맞는지 확인하고 구입해야합니다. 그리고 제조자명, 전화번호 등 품질표시 사항 및 A/S기간 등을 확인하고 중고 장난감의 경우도 안전성 여부를 확인하고 구입해야 합니다. 장난감을 안전하게 사용하기 위해서는 사용설명서를 모두 꼼꼼히 읽고 사용해야하며 위험한 부분이나 파손된 부분은 없는지 확인해야 합니다. 그리고 밖에서 가지고 노는 장난감은 녹슨 곳이나 부러진 곳으로 인해 아이가 다치지 않도록 자주 확인해야 합니다."],[1,"카시트와 관련된 내용으로 알맞지 않은 것은 무엇일까요?",["카시트 장착에 관련 내용은 도로교통법에 명시되어 있다.","카시트를 착용하는 것만으로도 어린이 교통사고 사망률의 50%이상을 감소시킬 수 있다.","10kg미만 유아용 카시트는 뒷좌석에, 10kg 이상의 어린이용은 앞좌석에 장착하는 것이 안전하다.","고속도로와 자동차 전용도로에서 6세 미만 유아에게 유아보호용 장구를 장착시키지 않으면 과태료 3만원이 부과된다."],2,"어린이를 자동차에 태울 때는 카시트를 꼭 착용해 안전합니다. 어린이의 몸무게에 맞는 카시트를 사용하고 뒷좌석에 태워야 합니다. 카시트를 착용하는 것만으로도 어린이 교통사고 사망률의 70% 이상을 감소시킬 수 있습니다. 고속도로와 자동차 전용도로에서 6세 미만 유아에게 유아보호용 장구를 장착시키지 않으면 과태료 3만원이 부과됩니다."],[1,"헬멧 착용과 관련된 법령으로 틀린 것은 무엇일까요?",["14세 미만의 어린이가 자전거를 탈 때 꼭 착용해야 한다.","14세 미만의 어린이를 자전거에 태우고 운행할 때도 착용시켜야 한다.","어린이용 헬멧의 무게는 350g을 초과해서는 안된다.","6세 이하의 어린이가 헬멧을 착용하지 않으면 벌금 2만원이 부과된다."],3,"바퀴달린 탈 것(자전거, 인라인스케이트 등)을 탈 때는 보호장구를 꼭 착용해야합니다. 보호장구의 종류에는 헬멧, 무릎보호대, 팔꿈치보호대, 손목보호대 등이 있습니다. 1: 보호장구를 구입할 때에는 KC마크를 확인하고 아이의 몸에 맞는 보호장구를 구입해야 합니다. 2: 보호장구를 착용하기 전에 보호장구 착용의 중요성과 바른 착용법을 지도해서 어른들이 시키지 않아도 스스로 착용할 수 있도록 해야 합니다. 3: 바퀴달린 탈 것의 상태를 수시로 점검해서 안전하게 탈 수 있도록 한다."],[1,"다음 중 포탄, 미사일, 항공기 공격을 받을 경우 대처방법으로 옳지 않은 것은 무엇일까요?",["포탄 및 미사일이 떨어지는 소리가 나면 즉시 엎드린다.","책가방이나 안전모 등을 이용하여 머리를 보호한다.","포성이 멈추면 재빨리 튼튼한 건물구석이나 지하로 몸을 숨긴다.","고막이 파열되지 않도록 귀를 막고 손으로 눈을 덮고 입을 꽉 다문다."],4,"포탄, 미사일 등은 큰 굉음과 함께 충격파를 전달합니다. 이때 고막이 파열되지 않도록 하는 방법은 귀를 손으로 막고 눈을 감고 입을 조금 벌리는 것이 안전합니다."],[1,"머리를 뒤로 젖힌 후 코를 손으로 잡고 입으로 공기를 불어넣어주는 응급조치를 무엇이라 하나요?",["심장압박","인공호흡","숨쉬기 운동","그냥 놀이의 종류이다."],2,""],[1,"다음 중 뱀에 물렸을 경우 대처방법으로 옳은 것은 무엇일까요?",["뱀이 생김새를 기억하여 의사에게 알린다.","뱀에 물린 부위를 탄산수로 씻어낸다.","몸을 움직여 땀을 낸다.","상처부위를 입으로 빨아낸다."],1,"뱀은 종류가 굉장히 다양하고 종류에 따라 독의 성질도 다릅니다. 그러므로 함부로 독을 입으로 빨거나 상처를 절개하는 것은 위험하고 즉시 119에 신고하거나 병원에 이동하여 의사에게 뱀의 생김새를 알리면서 응급조치를 받는 것이 좋습니다."],[1,"어린이들의 놀이장소로서 적당하지 않은 곳은 어디일까요?",["친구들과 함께 간 넓은 공사장","우리집에서 잘 보이는 놀이터","선생님과 함께하는 학교 운동장","부모님과 함께 간 놀이공원"],1,""],[1,"어린이를 대상으로 납치·유괴 등 범죄 행위와 교통사고 예방을 위해 학교 앞이나 인적이 드문 장소에 설치하는 폐쇄회로 텔레비전 형태의 단속 장비를 무엇이라 하나요?",["거울","CCTV","반사경","망원경"],2,""],[1,"여행 중 주변 사람과 떨어져 길을 잃었습니다. 좋은 방법이 아닌 것은 무엇일까요?",["이곳저곳으로 찾아다니며 일행을 찾는다.","움직이지 말고 그 장소에서 기다린다.","다른 어른들에게 도움을 청한다.","방송실이 있는 곳이라면 방송을 요청한다."],1,""],[1,"유괴범이 어린이를 유괴할 때 가장 많이 사용하는 4가지 방법에 속하지 않는 것은?",["길을 물어보며 같이 가달라고 한다.","엄마, 아빠와 아는 사람이라고 한다.","맛있는 것을 사준다고 한다.","우리 집에 가서 재밌는 영화를 보자고 말한다."],4,""],[1,"집에 혼자 있을 때 하지 말아야 할 행동은 무엇인가요?",["집안의 모든 문을 잠근다.","집안의 모든 문을 잠그고 집 앞에서 부모님을 기다린다.","집에 혼자 있을 때 누가 오면 문을 열어주지 않는다.","집에 혼자 있을 때 누가 오면 아무도 없는 것처럼 행동한다."],2,""],[1,"집에 혼자 있는 상황에서 택배가 왔을 때 적절하지 못한 행동은?",["받는 사람 이름을 먼저 확인하고 부모님 성함이 맞으면 부모님께 전화해서 확인한다.","문은 열지 않은 채로 경비실에 맡겨달라고 말한다.","집에 아무도 없는 척 한다.","택배를 받아야 하므로 문을 빨리 열어준다."],4,""],[1,"낯선 사람이 선물이나 과자를 준다고 할 때 가장 올바른 행동은 무엇일까요?",["감사하는 마음으로 받는다.","선물을 받고 도와드릴 것이 있는지 물어본다.","부모님을 아는 사람이라면 받아도 된다.","절대로 받지 않는다."],4,""]],[[1,"다음 중 학교폭력을 당했을 때 신고하는 방법으로 옳지 않은 것은 무엇일까요?",["117에 신고한다.","학교 전담 경찰관에게 알린다.","선생님이나 부모님께 알린다.","친구에게 얘기한다."],4,"학교폭력 신고방법은 친구에게 얘기하는 것 보다는 선생님,  밀폐된 방 안에서 헤어스프레이를 너무 많이 뿌리는 것은 위험합니다."],[1,"스포츠를 할 때 가장 흔히 일어나는 손상은 무엇일까요?",["척추 손상","골반 뼈 손상","혈관 파열","무릎 연골 손상"],4,"우리 몸은 무리한 운동과 반복적인 충격 때문에 스포츠 손상이 생기는데, 스포츠 손상이 가장 많이 생기는 부위는 바로 무릎! 무릎의 관절 사이에 있는 반달 모양의 연골판이 과도한 운동과 충격을 통해 찢어지거나 손상이 되는 경우기 많습니다. 게다가 이런 부상은 엑스레이에도 나타나지 않기 때문에 방치하다가 중세를 악화 시킬 수 있는 위험이 있고, 한 번 손상이 된 연골은 재생이 불가능하고 오히려 심화되어 관절염 등 심각한 결과를 불러옵니다. 부상을 입으면 치료와 회복에 오래 시간이 걸리는 무릎 손상 대비법을 알아봅시다. 1. 점프 후 착지할 때에는 무릎을 약간 구부려 무릎으로 가는 충격을 줄입니다. 방향 전환을 할 때에는 발을 먼저 움직여 무릎 부분이 한꺼번에 뒤틀리는 일이 없도록 합니다. 2. 심한 태클이나 충돌은 무릎뿐 아니라 몸 전체에 충격을 주므로 피해야 해요. 운동의 강도와 시간을 자신의 몸 상태에 맞게 적절히 조절하고 운동 후에는 반드시 휴식을 취합니다. 3. 청소 등 집안일을 할 때 무릎 끓은 자세로 걸레질 등을 하지 말아야 해요."],[1,"공중목욕탕에서 허벅지에 상처가 난 채로 사망한 7살 어린이가 당한 사고는 다음 중 무엇일까요?",["바닥에 미끄러져 뇌진탕","배수구에 빨려 들어가 익사","사우나에서 질식","찬물로 인한 심장마비"],2,"목욕탕 욕조에 있는 배수구는 물이 빠져나가는 구멍으로, 욕조 안 물의 압력 때문에 빠져나가는 힘이 매우 셉니다. 따라서 물이 깊고 배수관이 길수록 그 힘은 커지고, 그런 배수구에 사람의 신체 일부가 끼일 경우 배수 압력이 더 커져 빼기가 더욱 힘들어지지요. 이런 배수구 사고는 어른들에게는 부상의 위험을, 어린이에게는 생명의 위협까지 불러옵니다. 넘버원과 함께 공중목욕탕에 도사리고 있는 위험에서 탈출해 봅시다. 1. 공중목욕탕의 배수관에 몸의 일부가 끼더라도 깊이 빨려 들어가지 않는 U자 모양으로 만들어야 합니다. 배수구에는 안전 마개를 달아 사고를 예방합니다. 2. 어린이들은 깊은 탕이나 사우나 혼자 들어가지 말고, 목욕탕 안에서는 반드시 보호자와 함께 다녀야 합니다. 3. 목욕탕은 미끄럽고 단단한 바닥이라 미끄러지면서 몸이 부딪히는 사고 또한 많으므로 절대 뛰어다니지 말아야 해요."],[1,"다음 중 가장 미끄러운 곳은 어디일까요?",["타일 바닥","물 묻은 아스발트 바닥","콘크리트 바닥","흙먼지 바닥"],4,"두 물체가 접촉하여 운동 할 때 그 운동을 방해하는 힘을 마찰력이라고 합니다. 신발과 땅 사이에 생기는 마찰력이 적을수록 쉽게 미끄러지게 되는데 흙은 입자의 움직임이 자유로워 마찰력이 작아지기 때문에 다른 바닥보다 더욱 쉽게 미끄러지게 되는 것입니다. 흙먼지 바닥은 비 오는 날의 아스팔트 바닥이나 마른 화장실의 타월 바닥보다 두 배나 더 미끄럽고 겨울철 꽁꽁 언 빙판길과 비슷한 정도로 미끄럽지요. 큰 부상을 입을 수 있는 미끄럼 사고, 넘버원과 함께 대처해 봐요. 1. 계단이나 화장실 타일 등은 항상 물기를 닦아 건주한 상태를 유지합니다."],[1,"텐트 안에서 잠자듯 사망한 김씨의 사망 원인은 무엇일까요?",["나뭇가지에 긁힌 상처로 인한 파상풍","계곡물로 인한 세균 감염","발목 삠으로 인한 조직 손상","저산소증으로 인한 호흡부전"],4,"잠자듯 사망한 김 씨의 사망원인은 밀폐된 텐트와 그 안에 켜 둔 휴대용 난방 기구 때문입니다. 텐트는 대부분 나일론이나 폴리에스테르로 만들어져 있고, 비를 막기 위해 방수 코팅을 하는데 이렇게 코팅을 하면 물은 물론 공기도 통하지 않습니다. 게다가 텐트 안에서 가스난로나 가스등, 휴대용 버너 등을 사용하면 산소는 줄어들고 일산화탄소가 늘어나 질식의 위험이 있습니다. 넘버원과 함께 안전한 야외 취침 방법에 대해 알아보아요. 1. 잠자기 전에는 텐트 출입구를 활짝 열어 공기를 환기시키고, 텐트 안의 통풍
