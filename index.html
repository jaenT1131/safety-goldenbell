두고 덮개를 덜어 두어야 해요. 그리고 운동 기구 위에 빨래를 널어놓거나 물건을 올려놓지 말아야 합니다. 3. 되도록 집 안에 운동 기구 두는 장소를 따로 마련해 어린이나 유아가 쉽게 다가가지 않도록 하세요."],[1,"교통사고, 추락 사고에 이어 우리나라 사망 사고 원인 3위를 차지하고 있는 이것은 무엇일까요?",["익수 사고","화재 사고","가스 질식사고","감염 사고"],1,"바다나 수영장, 계곡 등 물이 있는 곳에서 끊임없이 발생하는 익수 사고로 목숨을 잃는 사람들이 많아요. 특히 20세 이하 청소년과 어린이가 전체 사고자의 20%를 넘는다고 합니다. 수영장에 들어서자마자 물에 뛰어들거나 다른 사람을 물에 빠뜨리는 장난, 음식을 먹은 뒤 바로 물에 들어가는 행동은 매우 위험합니다. 사소한 부주의로 일어나는 익수 사고, 얼마든지 막을 수 있습니다. 1. 위경련이나 구토로 인한 질식 사고를 방지하기 위해 음식물을 먹은 뒤 최소 1시간이 지난 다음에 물놀이를 하세요. 2. 다리나 팔 등의 근육 경련을 막기 위해 반드시 준비 운동을 합니다. 3. 준비 운동을 한 뒤 심장으로부터 먼 곳, 즉 손과 발, 팔, 다리, 몸통 순으로 물을 묻혀 물을 온도에 익숙해진 다음 계단을 이용해 다리부터 천천히 물에 들어갑니다. 4. 만약 물속에서 경련이 일어났다면 일단 물 밖으로 고개를 내밀어 숨을 깊게 들이마시고 발가락 끝을 발등 쪽으로 젖혀 경련을 풀어 줍니다."],[1,"다음 중 빙판길과 비슷한 것은 무엇일까요?",["운동장","잔디밭","맨홀 뚜껑","보도블록"],3,"우리가 빙판길에서 자주 넘어지는 이유는 바로 마찰력 때문입니다. 빙판길과 맨홀 뚜껑은 표면이 매끄럽기 때문에 마찰력이 약해 쉽게 미끄러집니다."],[1,"엘리베이터를 타려고 보니 문은 열려 있는데 엘리베이터는 보이지 않습니다. 어떻게 해야 할까요?",["버튼을 눌러본다.","문을 손으로 닫아본다.","고개를 내밀어 안을 들여다본다.","가까이 가지 않고 계단을 이용한다."],4,""],[1,"다음 중 엘리베이터가 고장 나서 갇힌 경우 올바른 대처방법은 무엇일까요?",["손으로 문을 연다.","엘리베이터 천장을 통해 탈출해 본다.","침착하게 엘리베이터 문에 기대어 기다린다.","비상 버튼을 찾아 누르고 도움을 요청한다."],4,"고장 난 엘리베이터 안에서는 일어서 있는 것보다는 가장자리에 기대어 앉아있는 것이 좋습니다. 기계 이상으로 갑자기 추락하는 사고가 발생할 수 있기 때문입니다. 그리고 엘리베이터 문은 튼튼해 보이지만 버티는 힘이 없어서 위험하므로 기대지 않도록 합니다."],[1,"염색을 하다가 염색약이 눈에 들어갔을 경우의 응급 처치법은 무엇일까요?",["감은 눈을 억지로 벌리고 바람이 말린다.","감은 눈 위로 이온음료를 부어 씻는다.","감은 눈을 억지로 벌리고 흐르는 물로 씻는다.","눈을 꼭 감고 눈물을 계속 흘린다."],3,"염색약을 비롯한 락스나 세제 등 우리 가정에서 흔히 볼 수 있는 여러 가지 화학 합성물들은 강한 알칼리성을 띠고 있습니다. 이런 물질이 눈에 들어가면 염증과 녹내장, 심하면 시력을 잃을 수도 있으므로 빠른 응급 처치가 필요해요. 강한 알칼리 성질을 가진 염색약은 눈에 들어갈 경우 곧바로 흐르는 물을 이용해 씻어 내야합니다. 1. 염색약은 눈에 들어가지 않게 주의합니다. 2. 본드나 세제, 락스 등 화학 물질을 사용할 때는 보안경을 쓰는 것이 좋아요. 3. 화학 약품을 꺼내다 떨어뜨릴 위험이 있으므로 높은 곳에 보관하지 않습니다. 4. 눈에 화학 약품이 들어가면 눈이 잘 떠지지 않아요. 5. 씻어 낼 때는 화학 약품이 들어가지 않는 다른 쪽 눈에 물이 튀지 않도록 주의합니다."],[1,"심내막염, 뇌농양, 켈로이드, 후천성면역결핍증, 패혈증의 원인이 될 수 있는 이것은 무엇일까요?",["컬러렌즈","피어싱","인공 썬텐","염색"],2,"자신만의 개성을 나타내기 위해 귀나 코, 배꼽 등 신체 부위에 구멍을 뚫어 장신구를 다는 피어싱. 하지만 비위생적인 시술과 잘못된 관리로 피부에 이상이 생겨 흉터가 남거나 생명까지 위협하는 심각한 질병을 일으킬 수도 있습니다. 1. 아토피 피부염이나 금속 알레르기가 있는 경우, 저혈압이나 당뇨병 등의 병이 있는 사람의 의사와 상담 후 해야 합니다. 2. 피어싱 후에는 전용 제품을 이용해서 관리하고, 장신구도 청결하게 관리해야 합니다. 3. 부작용이 생기면 집에서 연고 등으로 혼자서 치료하지 말고 반드시 병원을 찾아야 합니다."],[1,"잘못 보관하면 눈의 각막이 헐고 각막 표면이 파이는 각막 궤양의 직접적인 원인이 되는 이것은 무엇일까요?",["비누","식염수","마스카라","미용 팩"],2,"식염수는 상처 세척뿐 아니라 콘택트렌즈 세척에도 많이 사용되고 있습니다. 오염된 식염수로 렌즈를 세척한 후 상처가 있는 눈에 사용할 경우 세균에 감염되어 몇 시간 만에 각막 궤양이 생길 수 있고, 심한 경우에는 시력을 잃을 수도 있습니다. 눈의 안전을 위해서 식염수의 올바른 사용법을 꼭 지켜야 합니다. 1. 개봉한 식염수는 뚜껑을 열어 두면 공기 중의 세균이 들어가 번식하므로 사용 후 바로 뚜껑을 닫아야 합니다. 2. 모든 식염수는 냉장 보관해야 하고 반드시 개봉한 지 일주일 안에 사용합니다. 3. 대부분의 식염수는 용기가 크기 때문에 작은 병에 덜어서 보관해 필요할 때마다 하나씩 꺼내 써 공기 중에 노출되는 것을 줄여야 합니다. 4. 사용했던 식염수 통을 다시 사용하면 반드시 뜨거운 물로 20분 이상 소독해야 합니다."],[1,"어린이들이 좋아하지만 어린이의 얼굴과 손에 찍힘 사고나 베임 사고를 일으키는 이 물건을 무엇일까요?",["선글라스","음료캔","리모컨","동화책"],4,"알록달록한 그림과 재미있는 이야기가 있는 동화책. 위험해 보이지 않지만 의외로 많은 어린이들이 동화책에 찍히거나 베이는 사고를 당합니다. 동화책 겉표지는 쉽게 구겨지지 않도록 딱딱한 소재로 되어 있기 때문이에요. 이런 단단한 표지는 모서리가 날카롭고 강하기 때문에 부딪히면 큰 상처가 날 수 있습니다. 또한 선명한 색을 위해 사용한 두꺼운 종이에 손을 베이는 경우도 많아요. 넘버원과 함께 안전하고 즐겁게 동화책을 읽어 보아요. 1. 어린이용 책은 모서리가 둥글게 처리되어 있거나 헝겊, 스펀지로 되어 있어 안전사고의 위험이 적은 것으로 구입합니다. 2. 이미 구입한 책의 경우 표지의 모서리가 가위로 잘라 둥글고 뭉툭하게 만듭니다. 3. 날카로운 종이의 날 부분에는 투명 테이프를 붙여 베임 사고를 방지합니다."],[1,"츠츠가무시증, 렙토스피라증과 함께 3대 가을철 발열성 질환인 이것은 무엇일까요?",["파상풍","풍진","식중독","유행성 출혈열"],4,"야외 활동을 하기에 적당한 가을. 하지만 질병에 노출되기도 쉬워요. 열과 두통, 눈의 충혈을 일으키며 신증후성 출혈열이라고도 불리는 유행성 출혈ㅇㄴ 들쥐의 배설물에 의해 전염됩니다. 이 질병은 늦봄과 늦가을에 많이 발생하고, 감기 증상으로 시작해 복통과 요통을 동반합니다. 치료가 가능하지만 시기를 놓치면 사망에 이를 수 있는 무서운 질병이지요. 예전보다 사망률은 줄었지만 저혈압 환자의 사망률은 상대적으로 높으니 조심해야 합니다. 넘버원과 함께 유행성 출혈열의 위험에서 탈출해 보아요. 1. 풀발 위에 옷을 올려 두지 말고, 그냥 앉거나 눕지도 말고 반드시 돗자리를 이용하세요. 2. 긴 옷을 입어 노출을 줄이고 소매 끝이나 바지 끝은 양말 속에 넣어 진드기가 옷 안으로 들어오지 못하게 합니다. 3. 물이나 흙에서 작업을 할 경우 장화, 방수 장갑, 보호 장갑 등을 반드시 착용합니다. 또한 야외 활동 후에는 깨끗이 목욕을 하고 옷은 세탁 후 햇볕에 말리세요."],[1,"부주의한 처리로 인해 손과 발에 심각한 상해를 입히는 이것은 무엇일까요?",["주차 금지 표지판","화분","쓰레기봉투","자전거"],3,"골목길 등 사람이 자주 지나다니는 곳에 쓰레기봉투를 부주의하게 내놓으면 지나가던 사람들, 특히 우리 주변을 깨끗하게 해 주시는 환경미화원분들이 부상을 입을 수 있어요. 쓰레기봉투는 비교적 질긴 비닐로 되어 있지만 날카로운 물건을 넣었을 경우 비닐을 뚫고 나와 봉투를 만지는 사람들을 다치게 할 수 있습니다. 함부로 내놓은 쓰레기가 이웃에게 큰 상처를 입힐 수 있다는 것을 잊지 말고 남을 배려하는 마음으로 다시 한 번 확인하는 습관을 들여야 해요. 쓰레기봉투의 올바른 사용법, 우리 모두의 안전을 위해 꼭 알아 둡시다. 1. 깨진 유리나 칼 등 날카로운 물건은 신문지나 헝겊으로 두툼하게 감싸고 테이프로 감아 봉투를 찢고 나오지 않도록 합니다. 2. 이렇게 처리해 담은 쓰레기봉투의 겉면에 ‘유리 조심’ 표시를 해 주세요. 3. 판유리 등 큰 유리는 반드시 ‘소규모 건설 폐기물 포대’에 넣어 분리 배출하세요."],[1,"망막이 다치거나 실명이 되는 등 눈에 직접적으로 노출할 때 심각한 부상을 일으킬 수 있는 이것은 무엇일까요?",["비눗방울","레이저 포인트","실내등","카메라 후레쉬"],2,"공업용, 의료용뿐만 아니라 조명 등에 사용하는 레이저는 눈에 직접 닿을 경우 시력을 잃을 수 있는 위험이 있습니다. 레이저의 등급은 4단계로 나누어지는데 3단계부터는 레이저 빛이 닿자마자 풍선이 터지거나 철판이 뚫리는 등 눈에 직접 닿았을 때 심각한 부상을 입힐 수 있을 정도로 위험합니다. 또한 레이저 포인트나 아이들이 자주 가지고 노는 장난감 레이저 등에 눈이 노출될 경우, 망막이 다치거나 실명이 되는 사고로 이어질 수 있습니다. 이런 위험에서 벗어날 수 있는 방법을 알아볼까요? 1. 회의를 할 때 사용하는 레이저 포인터는 절대로 얼굴을 향해 비추지 말아야 해요. 레이저 프린터나 스캐너 등을 사용할 때는 빛이 눈에 닿지 않도록 멀리 떨어져 사용합니다. 2. 문구점에서 쉽게 구입할 수 있는 레이저 장난감은 매우 위험한 물건이므로 구입하지 않도록 합니다. 3. 레이저 제품을 이용할 때에는 레이저를 막아 주는 보안경을 착용합니다. 4. 조명 등에 사용되는 레이저는 절대 사람을 향해 빛이 가지 않도록 하고 되도록 사용을 하지 않는 편이 좋아요."],[1,"사람을 상대로 하는 강도, 절도가 가장 많이 발생하는 곳은 어디일까요?",["동네 골목길","대로변","술집, 유흥가 근처","지하 주차장"],3,"최근에는 어디서든 강도, 절도 사건이 많이 일어나고 있지만 특히 사람이 많이 다니고, 대부분 술에 취한 사람들이 많은 술집이나 유흥가 근처에서 가장 많은 사건이 발생하고 있어요. 점점 늘어나고 있는 절도, 강도 사건에 대응하는 방법을 알아봅시다. 1. 술 취한 사람이 쓰러져 있는 것을 발견하면 112에 신고해 주세요. 2. 인적이 드문 골목길에서는 혼자 다니지 말고, 누군가 따라오는 느낌이 들면 근처 가게로 들어가 상황을 살핍니다. 의심되는 사람이 계속 서성이면 역시 112에 도움을 요청합니다. 3. 길가에서는 차도에 너무 바짝 붙어서 걸어가지 말고 가방은 몸과 가깝게 드는 습관을 들입니다. 주차장에서도 수상한 사람을 발견하면 경비실 등에 연락을 해 도움을 받습니다. 4. 범인과 직접 마주친 경우 호루라기를 불거나 큰 소리를 내 범인을 당황하게 하고 주위 사람의 이목을 끌어 도움을 받습니다."]],[[1,"댕기열, 말라리아, 일본뇌염 등의 각종 심각한 질병을 옮기는 이 벌레는 무엇일까요?",["파리","진드기","모기","바퀴벌레"],3,"질병이 있는 사람의 피를 빨아먹은 후 다른 사람의 피를 빨아먹을 때 병을 전염시키는 모기는 사람뿐 아니라 동물에게도 피해를 입혀요. 또한 예전에는 여름철에만 모기를 볼 수 있었는데 환경의 변화로 요즘에는 일 년 내내 모기가 생겨나고 있지요. 모기가 되가 전의 알과 유충을 없애 모기의 피해를 줄여야 해요. 1. 집 안에서 모기 알과 유충이 들어 있는 물을 발견하면 거즈나 헝겊으로 배수구를 막고 그 위로 물을 버려 알과 유충을 걸러 내어 따로 버리세요. 2. 마당에 고인 물이나 화분에 고인 물 등에는 식용유를 뿌리면 유충들을 제거할 수 있어요. 모기 알을 발견한 경우, 알에 뜨거운 물을 부으면 됩니다. 3. 저수지, 논, 호수 등의 맑은 물에는 미꾸라지를 풀어놓아 모기 유충을 잡아먹게 합니다. 4. 모기가 갑자기 많이 늘어난 곳은 지역 보건소에 신고해 방역을 하도록 합니다."],[1,"형광증백제가 들어 있는 것으로 밝혀진 제품은 무엇일까요?",["두루마리 휴지","종이컵","화장솜","위생 물티슈"],1,"형광증백제란 제품의 색을 하얗게 보이게 하는 화학 염료예요. 우리가 자주 사용하는 두루마리 휴지뿐 아니라 수건, 옷, 종이 등 수 많은 물건에 들어있지요. 하지만 피부가 예민한 사람들은 형광증백제에 지속적으로 노출될 경우 피부가 빨갛게 부어오르는 접촉성 피부염이 생길 위험이 있습니다. 우리 주변에서 자주 사용되는 형광증백제 제품들, 어떻게 사용해야 안전 할까요? 1. 두루마리 휴지는 화장실용이므로 화장실에서 사용하고 얼굴이나 손을 닦을 때에는 형광 처리가 되지 않은 미용 티슈를 사용하세요. 2. 최근에는 형광증백제가 들어 있지 않은 두루마리 휴지도 많이 나오고 있어요. 예민한 피부를 가진 사람은 되도록 무형광 제품을 구입하세요. 3. 형광증백제가 음식물로 옮겨갈 수 있으므로 흰 종이에는 과자 등의 음식물을 담지 않아야 합니다."],[1,"일 년에 평균 스물여덟 건의 지하철 운행 중단을 불러 온 이것은 무엇일까요?",["전기 합선","역내 누수","문에 이물질이 끼임","비상문 작동"],3,"모두가 안전하고 편리하게 사용해야 할 지하철. 그러나 승객들의 부주의나 장난 때문에 운행 중단이 일어나고 안전사고의 위험까지 불러옵니다. 지하철은 문에 물건이 끼여 있더라도 그대로 출발하는 경우가 많습니다. 물건을 감지하는 센서가 잘 인식하지 못하기 때문이에요. 지하철 문 이물질 끼임의 안전 대책에 대해 알아봐요. 1. 장난으로 막대나 신문 등의 이물질을 문에 끼우면 절대 안 됩니다. 2. 문이 닫히려는 지하철에 타기 위해 가방이나 몸의 일부를 넣는 행동은 매우 위험하므로 절대 해서는 안 돼요. 3. 만약 출입문에 이물질이나 사람이 끼이면 그 즉시 전동차 내부 앞뒤에 위치한 인터폰으로 기관사에게 연락하세요."],[1,"옷에 불이 붙어 생기는 화상 사고의 가장 많은 원인이 되는 것은 무엇일까요?",["촛불","라이터","전기난로","가스레인지"],4,"옷에 직접 불이 붙어 생긴 화상은 피부에 심각한 후유증을 남겨요. 이런 화상 사고는 잠깐의 부주의로 일어납니다. 옷에 불이 붙는 원인은 가스레인지, 라이터, 담배의 순으로 조사되었습니다. 집 안에서 입는 옷은 대부분 헐렁하기 때문에 가스레인지의 불꽃 근처에 헐렁한 소맷부리나 옷자락이 닿아 불이 옮겨 붙어 사고가 일어나곤 합니다. 잘못하면 위험한 사고의 원인이 되기도 하는 가스레인지. 안전한 사용법을 알아볼까요? 1. 가스레인지를 사용할 때는 잠옷, 목욕 가운, 파자마 등의 늘어지는 부분이 많은 옷은 입지 않아야 합니다. 2. 어린이들은 가스레인지 근처에서 놀거나 부모님 없이 혼자 가스레인지를 사용하면 안 됩니다. 3. 합성 섬유 옷은 불도 잘 붙고, 불이 붙었을 때 피부가 입는 손상이 큽니다. 옷은 되도록 천연 섬유로 된 옷을 입는 현이 건강과 안전 모두에 좋아요."],[1,"풀을 깎는 기계인 예초기. 예초기로 인해 부상을 가장 많이 입는 신체 부위는 어디일까요?",["눈","손","등","배"],1,"성묘를 앞두고 벌초를 하거나 잔디를 예초기로 깎을 때 잡풀 사이에 돌이나 나뭇가지 등 많은 이물질이 있습니다. 이런 상태에서 예초기로 풀을 깎는 다면 이물질들이 예초기의 날에 부딪혀 깨진 모래나 돌, 나뭇가지 등의 이물질이 사람의 얼굴 높이 까지 튀어 올라 얼굴이나 눈을 다치게 하는 것입니다. 예초기 사고, 올바른 사용으로 방지할 수 있어요. 1. 예초기와 예초기 날은 안전 검사를 받는 제품인지 확인한 후 구입하고, 예초기의 날 중 일자날이라 불리는 일체형 2도 날은 풀이 잘 잘리는 대신 위험하기 때문에 나일론 날이나 관절형 날을 이용하세요. 2. 예초기를 사용할 때는 보호 마스크와 보호 장갑, 보호 안경과 무릎 보호대를 반드시 착용합니다. 3. 기계와 날을 연결하는 볼트가 단단히 조여졌는지 꼭 확인하고, 튀는 돌 등의 이물질을 막아 줄 수 있도록 안전 커버를 달고 풀을 베야 해요. 4. 돌 등이 튈 것에 대비해 주변에 사람이 없을 때 작업하고, 풀이 날에 엉키면 반드시 예초기의 시동을 끄고 장갑을 낀 손으로 엉킨 풀을 제거합니다."],[1,"한쪽 콧구멍에서 콧물과 악취가 나고 열과 거친 숨소리 등의 증상이 나타나게 되는 원인은 무엇일까요?",["콧속 이물질","소아 감기","부딪혀서 생긴 코 내부 골절","소아 중이염"],1,"양쪽 콧구멍에서 콧물이 나고 열이 나면 감기 증상일 수 있지만, 한쪽만 막히거나 콧물, 피 악취가 나면 아이의 콧구멍을 의심해 보세요. 성장 발달 과정에 따르면 생후 18개월에서 3살 사이의 유아들은 주변의 물건을 보이는 대로 삼키는 것은 물론 물건을 자신의 몸속에 집어넣는 행동을 보인다고 합니다. 따라서 아이가 있는 집에서는 아이의 손이 닿는 곳에 작은 물건을 놓지 않도록 하는 것이 최선의 방법입니다. 또한 콧구멍에 이물질이 들어갔을 때는 고개를 앞으로 숙이게 하고 병원으로 가야 해요. 코에 들어간 이물질, 안전하게 제거하는 방법을 알아봅시다. 1. 핀셋이나 면봉 등으로 이물질을 무리하게 빼려 하면 안됩니다. 오히려 이물질이 더 깊숙이 박혀 코 안쪽이나 기도까지 손상을 입힐 수 있습니다. 2. 아이를 거꾸로 들고 두드리지 마세요. 몸을 거꾸로 하면 이물질은 오히려 더 안쪽으로 들어갑니다. 3. 코에 물이나 기름을 넣으면 이물질이 몸 안으로 더 쉽게 넘어갈 수 있으므로 절대로 해서는 안 됩니다."],[1,"취급이 잘못될 경우 어린아이에게 치명적인 사카자키균이 발생할 수 있는 것은 무엇일까요?",["요구르트","보리차","분유","딸기우유"],3,"보통은 아기에게 먹이기 직전에 분유를 물에 타지만 한밤중에 먹일 때나 여행 시 분유를 미리 타 놓고 실온에 두기도 하는데, 분유에는 단백질과 지방이 풍부하기 때문에 물에 탄 분유를 오랜 시간 실온에서 보관할 경우 각종 세균이 번식할 수 있습니다. 사카자키 균은 어린아이들에게 뇌수막염과 심각한 소화기 질병을 일으킬 수 있어요. 이 세균에 감염될 경우 사망률이 20~50%에 달한다는 연구 결과가 있습니다. 올바른 분유 보관으로 사카자키 균의 위협에서 벗어나요. 1. 분유는 세군이 파괴되도록 70゜C 이상의 물을 사용합니다. 또한 물에 탄 분유는 15゜C이상의 상온에 장시간 보관하지 말고 반드시 냉장 보관해야 해요. 2. 개봉한 지 20일 이상이 지난 분유는 아기에게 먹이지 않습니다. 그리고 아기가 먹다 남긴 분유 또한 아기의 침과 입안의 세균에 의해 오염될 수 있으니 버려야 합니다. 3. 사용한 우유병과 젖꼭지는 사용 후 즉시 씻고 뜨거운 물에 삶아 소독해 줍니다. 분유를 먹인 후 아기의 입은 물에 적신 깨끗한 거즈로 닦아 주세요."],[1,"소비자 보호원이 조사한 결과, 가정의 주방에서 대장균이 가장 많이 검출된 곳은 어디일까요?",["행주","도마","냉장고 신선실 및 채소칸","수저통"],3,"깨끗해 보이는 주방도 위생관리가 잘못 되었을 경우 세균의 서식처가 될 수 있어요. 한국소비자원의 조사 결과 냉장고 신선실 및 채소칸, 행주, 도마, 수저통 순으로 대장균이 검출되었다고 합니다. 채소와 과일 생선과 고기가 뒤섞여 있는 냉장고의 신설실과 채소칸, 하지만 깨끗하게 관리하지 않으면 식중독을 일으키는 황색포도상구균이나 복통과 설사를 일으키는 대장균이 번식할 수 있습니다. 가정의 위생을 책임지는 냉장고 관리, 넘버원 과 함께 알아봐요. 1. 세균이 자랄 수 없도록 냉동실 온도는 영하 15゜C, 냉장실 온도는 영상 5゜C 이하로 유지합니다. 또한 남은 음식을 보관할 때는 서로 섞이거나 물이 흐르지 않도록 개별 포장해야 해요. 2. 냉장고 청소는 최소한 일주일에 한번, 살균소독제를 희석한 물로 청소하고 물기가 남지 않게 닦아 둡니다. 3. 또한 도마나 행주 등 항상 물에 젖어 있는 주방 기구들은 주기적으로 살거나 소독을 해 주어 항상 청결하게 유지해야합니다."],[1,"어린이 중독사고 중 가장 많은 원인을 차지하는 이것은 무엇일까요?",["약","건전지","세제","접착제"],1,"우리나라 5세 미만 어린이의 중독 사고는 일 년에 약 8,500건이나 일어납니다. 그중 80% 이상이 가정에서 발생하고 있는데, 가장 높은 비율을 차지하는 것은 바로 약 중독이에요. 어린이 중독 사고를 일으키는 약의 종류는 여러 가지가 있지만 그중 철분제는 사탕이나 초콜릿처럼 새콤달콤한 맛과 알록달록한 색으로 만들어진 것이 많아 아이들이 많은 양을 먹을 위험이 있어요. 어린이가 영양제를 과다 복용하게 되면 설사, 구역질, 구토 등을 하게 되고 심하면 부종이나 성장 지연 증상이 나타날 수 있으니 정해진 용량을 지켜서 먹어야 합니다. 잘못 먹으면 오히려 독이 되는 약! 안전한 약 복용에 대해 알아보아요. 1. 지나치게 많은 양의 약을 복용했을 때는 먹은 약을 토하게 합니다. 2. 그런 다음 되도록 빨리 병원으로 갑니다. 갈 때는 먹은 약의 용기나 빈병을 가져가 무슨 약을 먹었는지 알 수 있도록 해주세요. 3. 치료 후 증상이 나아져도 후유증이 있을 수 있으므로 지속적인 관찰이 필요해요."],[1,"빙초산으로 인한 화학 화상을 입었을 때 가장 먼저 해야 할 일은 무엇일까요?",["빙초산이 묻은 부위에 우유를 붓는다.","이불을 엎어 준다.","빙초산이 묻은 부위에 물을 붓는다.","옷을 벗긴다."],4,"화학화상이란 피부나 옷에 강산, 강알칼리 등의 성질을 가진 화학물질이 닿았을 때 이 물질들이 피부 속으로 스며들며 일어나는 심각한 화장이에요. 이런 경우는 몸에 더 이상 해로운 물질이 스며들지 않도록 옷을 먼저 벗겨 상처 부위에서 떨어지도록 해야 해요. 빙초산은 수분이 거의 섞이지 않아 매우 농도가 강한 초산이에요. 원래는 물과 섞어서 식초 대용으로 사용하기 때문에 일반 가게에서도 쉽게 구할 수 있고, 가정에서도 흔히 볼 수 있어 사고의 위험 크답니다. 가정에 하나 쯤 있는 빙초산! 생각보다 위험한 물건이 될 수도 있습니다. 1. 가정에서 사용할 때는 빨간 글씨로 ‘위험’이라고 써 놓고, 어린이 손에 닿지 않는 곳에 보관해요. 2. 옷을 벗기는 사람의 손에 빙초산이 닿지 않게 조심해야 하며, 흐르는 미지근한 물로 15~30분 이상 씻어 피부에 빙초산이 남지 않도록 한 후 병원으로 가야 합니다."],[1,"식중독에 걸려 잦은 설사로 탈수 현상이 일어날 때 빠르고 효과적으로 몸에 수분을 보충해줄 수 있는 이것은 무엇일까요?",["생수","우유","탄산음료","이온음료"],4,"식중독에 걸리면 대부분 설사를 하게 됩니다. 그러면 몸에 수분이 많이 빠져나가 탈수 현상을 일으키므로 수분을 보충해 줘야 하지요. 빠르고 효과적으로 몸에 수분을 보충해 주는 것이 바로 이온 음료랍니다. 이온음료는 사람의 체액과 비슷한 농도를 가지고 있어 물보다 약 3배 빨리 흡수됩니다. 또한 탄수화물, 나트륨, 칼륨, 마그네슘 등의 무기질과 비타민 C 등 사람의 체액에 포함된 성분들이 비슷하게 들어 있어 몸속에서 빠져나간 필수 성분까지 보충해 줍니다. 식중독으로 인한 탈수 현상! 이렇게 대처하세요. 1. 이온 음료 중에서도 가급적 색소가 들어가지 않은 투명한 것이 좋습니다. 2. 이온 음료가 없는 경우에는 응급 처치용으로 물 1L에 소금 1스푼, 설탕 4스푼을 잘 녹여 마시거나, 미즈근한 보리차를 마시도록 합니다. 3. 주스나 커피, 탄산음료, 우유 등은 오히려 상태를 악화시키므로 마시지 말아야 합니다."],[1,"우리도 모르는 사이 몸속으로 들어가 건강을 위협하는 이것은 무엇일까요?",["휴지","비타민 알약","녹말 이쑤시개","인형의 털"],4,"털 인형에서는 생각보다 훨씬 많은 양의 털이 빠져나오기 때문에 이 털이 입과 코를 통해 몸속에 들어가면 호흡기 질환인 천식이나 알레르기 일으키고, 소화되지 않고 몸에 오래 남아 있으면 내장까지 상하게 한답니다. 특히 아기들은 물건을 입으로 가져가려는 습성이 있기 때문에 더욱 위험합니다. 넘버원과 함께 털 인형의 위험에서 벗어나 봐요. 1. 털 인형을 구입할 때는 인형의 털 부분을 어두운 색 옷에 문질러 털이 빠지지 않는지 확인 합니다. 2. 아이들에게 될 수 있으면 털 인형 대신 고무 인형이나 헝겊 인형을 주세요. 3. 특히 무조건 물건을 입으로 가져가는 0~2세의 아기에게는 털 인형을 아예 주지 않는 것이 좋습니다."],[1,"열탕화상, 접촉화상 다음으로 많이 일어나고 최근 더 증가하고 있는 화상의 종류는 무엇일까요?",["가스레인지의 불꽃화상","러닝머신에 의한 마찰 화상","전기밥솥에 의한 증기 화상","전기 콘센트에 의한 전기화상"],3,"이 화상사고의 특징은 뜨거운 물에 화상을 입었을 때보다 더 깊은 상처를 남긴다는 점이에요. 취사 중인 전기밥솥에서 나오는 증기의 온도는 80゜C 가 넘습니다. 이것은 깊은 2도 화상을 입힐 수 있는 온도이지요. 게다가 압력밥솥의 경우 증기의 힘까지 강해 연약한 아이의 피부에 더 큰 상처를 입힐 수 있답니다. 점점 사고가 많아지고 있는 증기 화상은 전기밥솥을 통해 자주 일어납니다. 넘버원과 함께 증기 화상에 대처하는 방법을 알아봐요. 1. 스팀 청소기, 스팀다리미, 전기 포트, 전기밥솥, 가습기 등의 위험한 물건은 어린이의 손이 닿지 않는 곳에 두고, 사용 후에는 반드시 전원을 끄고 온도가 내려간 것을 확인하세요. 2. 증기 화상을 입었을 때는 즉시 흐르는 물로 상처 부위의 열을 식혀 주고 깨끗한 거즈로 상처 부위를 덮고 곧바로 병원으로 가야 합니다. 3. 증기 화상은 피부 속까지 화상을 입히거나 후유증의 가능성이 높으므로 다 나은 것처럼 보여도 3~4주 후에 다시 병원에 가서 검사를 받아야 합니다."],[1,"아파트 발코니 추락사고의 주요 원인이 되고 있는 것은 무엇일까요?",["위성 안테나","방범창","에어컨 실외기","방충망"],4,"방충망은 흔들리거나 떨어지지 않는지 자주 점검하고, 낡았을 경우 틀에서 떨어지기 쉬우므로 적어도 2년에 한 번 정도는 바꿔 주어야 합니다."],[1,"가정에서 영·유아 안전사고가 가장 많이 일어나는 가구는 무엇일까요?",["침대","식탁","책상","장롱"],1,"가장 안전해야 할 가정이지만, 위험을 잘 모르는 어린아이는 가정의 가구에서도 사고를 당합니다. 끼이고, 부딪히고 떨어지는 사고가 자주 발생하는 침대는 편안한 잠자리를 제공하면서도 많은 위험 요소를 가지고 있습니다. 아기가 사용하는 요나 쿠션, 베개, 매트리스 등은 너무 푹신한 것을 사용하면 안 됩니다. 자면서 움직이다가 얼굴에 파묻히면 질식의 위험이 있기 때문이지요. 가장 편안한 장소여야 할 침대! 안전하게 사용하는 방법을 알아봅시다. 1. 아기를 재울 때는 안전바가 있는 유아 전용 침대를 사용하고, 안전바에 머리나 다리가 끼지 않도록 매트리스나 패드로 막아 둡니다. 2. 유아용 침대가 없으면 아기용 요를 바닥에 깔고 재웁니다. 단 벽이나 모서리, 가구 옆은 피해주세요 3. 아기 얼굴은 위를 보도록 눕히고, 잠든 곳 주변에 인형이나 푹신한 베개를 두지 마세요. 4. 아기보다 나이가 많은 형제나 어른이 가까이 잘 때에는 몸을 뒤척이다 아이가 깔리는 사고가 날 수 있으므로 거리를 두고 잠을 자는 것이 좋습니다."],[1,"전기 합선과 과열로 인해 화재 위험이 있는 것은 무엇일까요?",["형광등","선풍기","휴대전화 충전기","전자모기향"],2,"소방방재청 통계 결과 한 해 동안 선풍기로 인한 화재가 200여 건이나 발생해 많은 인명 피해와 재산 피해를 냈다고 합니다. 선풍기는 몸체와 모터, 날개로 이루어져 있어요. 모터의 축이 날개와 연결되어 회전하면서 시원한 바람이 나오는 것이지요. 바로 이 모터에서 문제가 일어나 화재가 나게 되는 경우가 가장 많아요. 여름철 필수품 선풍기! 선풍기 화재 원인에는 어떤 것이 있을까요? 1. 선풍기의 모터 안에 먼지가 많이 쌓이면 과열이 되었을 때 발화의 원인이 될 수 있으니 평소에 관리를 꼼꼼하게 해야 합니다. 2. 빨래를 빨리 말리기 위해 가끔 선풍기 위에 빨래를 올려놓은 경우가 있는데, 옷이 날개에 걸리게 되면 날개는 움직이지 않고 모터만 돌아가기 때문에 모터가 과열 돼 화재가 발생할 수 있게 됩니다. 3. 선풍기를 너무 오래 시간 켜 놓거나, 30゜C 이상의 장소에서 오래 사용을 해도 화재가 발생하기 쉽습니다. 또한 습기가 많고 통풍이 되지 않는 곳에 보관하면 모터 부분에 녹이 슬 위험이 있으니 피해야 합니다."],[1,"화재가 발생하면 유독가스에 의한 질식사망자가 많이 발생하는데, 다음 중 유독가스를 가장 많이 발생시키는 물건은 무엇일까요?",["공책이나 종이","나무로 만든 마루","소파의 스펀지","이불"],3,""],[1,"옥상에서 장마 대비를 위한 공사를 하던 중 갑자기 발생한 화재, 원인은 무엇일까요?",["옥외에 스프레이식 해충약을 뿌렸다.","일회용 라이터를 사용했다.","롤러로 유기 용제형 발수제를 발랐다.","붓으로 수용성 페인트칠을 했다."],3,"장마철에 물이 새는 것을 막기 위해 옥상이나 벽면에 바르는 유기 용제형 발수제는 시너, 솔벤트 등 불이 쉽게 붙는 물질로 이루어져 있습니다. 이 물질은 인화점이 매우 낮아 온도가 조금만 올라가도 쉽게 불이 붙기 때문에 기온이 높은 여름철에 작업을 하면 화재의 위험이 높아지는 것입니다. 또한 온도가 높아진데다 작업 과정에서 롤러와의 마찰열과 정전기 때문에 불이 날 위험성이 더욱 높아지게 되지요. 가정에서도 많이 사용하는 발수제의 안전한 사용법을 알아봅시다. 1. 발수제를 바를 때에는 반드시 안전복장을 착용하고 근처에 소화기를 비치해 두어야 해요. 2. 되도록 전문 회사의 수용성 발수 제품을 사용하고, 유기 용제형 발수제를 쓸 때는 한 낮이나 지나치게 건조한 날은 피해서 작업합니다. 3. 옥상에는 옥상 전용 발수제를 사용하고, 마찰로 인한 화재 위험을 줄이기 위해 롤러보다는 붓이나 스프레이로 칠하는 것이 좋습니다."],[1,"다음 중 미아가 가장 많이 발생하는 곳은 어디일까요?",["집 근처","시장","어린이집 주변","공원"],1,"매년 3,000명이 넘는 아이들이 사라지고 있는 미아 사고. 익숙한 곳이라고 생각하는 집 근처에서도 잠깐의 방심으로 가장 많은 미아가 발생하고 있습니다. 가정의 행복을 파괴하는 미아 사고. 넘버원과 힘께 예방법을 알아봐요. 1. 어린 아이들은 호기심이 강하고 어른들과는 시간 개념이 다르므로 ‘잠깐이니까’ 라는 생각으로 아이기 혼자 있게 해서는 안 돼요. 또한 사람이 많은 공공장소에서는 보호자와 아이가 항상 손을 잡고 있어야 해요. 2. 아주 어린 아이에게는 만일 미아가 됐을 때 전화번호, 부모님의 이름을 말할 수 있도록 평소에 반복적으로 외우게 합니다. 3. 외출할 때에는 이름과 연락처가 적힌 마아 방지용 팔찌나 목걸이를 착용해요. 하지만 미아 방지용 주소나 연락처 등을 눈에 잘 띄는 곳에 붙이면 오히려 유괴의 위험이 있으므로 잘 보이지 않는 옷 안쪽이나 신발 안쪽 등에 붙입니다."],[1,"집안에서 아이들이 안전을 가장 위협하는 이것은 무엇일까요?",["에어컨","액자","화분","텔레비전"],4,"우리가 매일 생활하고 있는 집 안에도 어린이의 안전을 위협하는 물건이 많습니다. 그 중 텔레비전이 넘어지면서 그 밑에 유아가 깔리면 목숨을 잃는 사고가 나기도 합니다. 텔레비전은 크고 무거워서 잘 쓰러지지 않을 것 같지만 무게 중심이 앞쪽에 있어 의외로 쓰러지기가 쉬워요. 텔레비전뿐 아니라 서랍장, 화장대, 책장 등도 아이들이 딛고 올라가다 넘어지게 되면 아이가 그 밑에 깔리는 큰 사고가 일어날 수 있습니다. 텔레비전 압사 사고를 피하는 방법은 무엇일까요? 1. 텔레비전은 앞부분이 설치대 밖으로 나오지 않도록 최대한 안쪽으로 밀어 놓아야 해요 2. 높은 곳으로 기어오르기 좋아하는 아이들은 칸칸이 있는 서랍을 열고 이것을 발판삼아 위로 오르는 경우가 있기 때문에 서랍장이나 책장, 책상 위에 아이들이 좋아하거나 무거운 물건을 놓지 않습니다. 3. 바퀴가 달린 가구나 다리가 가늘고 높은 가구는 움직이거나 넘어질 위험이 있으니 바닥과 닿는 면이 넓은 것을 사용하는 게 좋아요. 4. 집 안의 가구들이 균형이 맞는지 수시로 확인하고, 흔들리거나 넘어질 위험이 있는 가구는 벽에 고정시키는 방법도 있습니다."],[1,"가정에서 많이 볼 있는 약품의 잘못된 보관법은 무엇일까요?",["손에 닿은 약은 다시 약병에 넣지 않는다.","여름에는 알약도 냉장고에 넣는다.","안약은 사용 후 용기 뚜껑을 소독해야 한다.","약 보관 상자에는 습기 제거제를 넣는다."],2,"손쉽게 아픔을 가라앉혀 주는 약. 그렇지만 올바르게 보관하지 않으면 변질되기 쉽습니다. 하지만 변질된 약은 오히려 우리 몸에 독이 될 수 있어요. 약은 대부분 습기에 약합니다. 특히 알약은 겉면에 코팅까지 되어 있어 더욱 습기에 약하지요. 냉장고 안에 보관하면 안과 밖의 온도 차이 때문에 넣었다가 꺼냈다 하면 변질이 더욱 쉽게 되고, 심하면 곰팡이가 피기도 해요. 위기탈출 넘버원과 함께 올바른 약 보관 방법을 알아보아요. 1. 알약은 상온에 보관하고 먹을 분량만큼만 꺼내서 먹어야 해요. 손의 땀과 세균 때문에 약이 변질되기 쉽거든요. 2. 안약은 용기 입구가 눈꺼풀에 닿지 않도록 넣고, 사용 후에는 알코올을 묻힌 면봉으로 뚜껑과 입구를 닦아 주세요. 3. 유효 기간 이 지난 약은 먹거나 사용하면 절대로 안 됩니다. 특히 가루약은 공기가 닿는 면적이 넓기때문에 알약보다 유효 기간이 훨씬 짧아요. 4. 약을 보관 상자에 넣어 보관할 때에는 습기 제거제를 넣고, 약의 색이 변했다거나 알약들이 서로 붙어 있다면 약이 변질되기 시작했다는 신호이므로 절대 복용하지 말아야 합니다."],[1,"몸이 아파 약을 먹어야 할 때 해야 할 행동으로 바람직하지 않은 것은 무엇일까요?",["부모님께 알린다.","집에 있는 약을 찾아서 먹는다.","반드시 용도와 용법을 알고 먹는다.","의사나 약사의 처방을 받는다."],2,""],[1,"한국 소비자원이 분석한 초등학생 안전사고 중 가장 많이 발생하는 사고유형은?",["충돌, 충격사고","넘어짐, 미끄러짐","눌림, 끼임","전기, 고온화상"],2,""],[1,"뛰어갈 경우, 천천히 걷는 것보다 사고위험이 몇 배 높을까요?",["7배","14배","18배","22배"],1,""],[1,"화재 사고 사망자가 생기는 가장 큰 원인은 다음 중 무엇일까요?",["화재 사실을 늦게 알아 피난 시간이 부족함","이동 중 부장을 입어 움직일 수 없음","장애물 때문에 대피할 길을 찾지 못함","베란다로 뛰어내리는 등 위험한 방법으로 대피함"],1,"화재는 시작된 집뿐만 아니라 옆집이나 윗집 등으로 순식간에 번지게 되고, 연기는 그보다 더 빨리 번져 질식사 등을 일으킬 수 있습니다. 따라서 화재가 시작되는 그 즉시 이를 알고 대처하는 것이 가장 중요해요. 빨리 알려 줄일 수 있는 화재 피해! 화재경보기로 대비해요. 화재경보기는 불이 시작되면 발생하는 열이나 연기 등을 감지해 큰 소리를 내면서 사람들에게 화재 사실을 알립니다. 하지만 텔레비전 등의 생활 소음이나 방음 장치 때문에 이 소리를 듣지 못해 큰 피해를 입는 경우가 많다고 해요. 또한 평소의 관리 소홀로 작동을 하지 않아 경보기가 울리지 않을 수도 있다고 합니다. 1. 문을 닫아도 집 안까지 경보기 소리가 전달될 수 있는 단독형 경보기를 방이나 거실, 부엌에 설치합니다. 2. 화재경보음이 가정 내의 소음에 묻혀 들리지 않는 일이 없도록 텔레비전이나 오디오의 볼륨은 적당한 수준으로 유지합니다. 3. 이웃집에서 화재가 날 경우를 대비해 현관문 등 밖으로 통하는 길목에도 설치하면 더욱 안전합니다."],[1,"명확한 주의 문구가 없어 부딪힘 사고의 위험이 큰 이것은 무엇일까요?",["입간판","현수막","유리문","전봇대"],3,"바쁜 일상에 쫓기는 사람들은 급하게 걷다 유리문에 부딪히는 경우가 많아요. 게다가 요즘은 투명도가 높아 유리가 있는지조차 구별하기 힘든 백유리를 사용하기 때문에 유리에 부딪혀 다치는 사고가 많아지고 있어요. 특히 급히 뛰어가는 사람이나 시력이 나쁜 사람, 주의가산만한 어린이 등이 사고의 위험에 노출되어 있습니다. 안전한 거리를 위해 유리문을 이렇게 사용해야 해요. 1. 멀리에서도 한눈에 유리문인지 알아볼 수 있도록 식별 표시를 해 둡니다. 2. 유리문은 부딪혔을 경우 깨지지 않도록 일반 유리보다 튼튼한 강화 유리를 사용해야 큰 피해를 막을 수 있습니다. 3. 보행자들은 건물에 드나들 때 급하게 뛰지 않아야 하고, 항상 유리가 있는지 주의하는 것이 좋습니다."],[1,"한해 200건의 접수가 이뤄지는 이것에 의한 사고로 어린이가 중상을 입거나 사망하기도 합니다. 무엇일까요?",["회전문","셔터","무빙워크","화물용 엘리베이터"],1,"백화점 등의 큰 건물에 있는 회전문은 냉난방비의 낭비를 줄이고, 건물모양을 보기 좋게 만들지만 사용자의 부주의나 안전관리가 부족할 때는 커다란 사고를 부릅니다. 우리나라는 아직까지 회전문에 대한 안전 기준과 인식이 부족해 안전장치들이 제대로 작동하지 않는 경우가 많아요. 안전수칙을 지켜 사고가 일어나지 않도록 조심해야 해요. 위기탈출 넘버원과 함께 회전문을 안전하게 이용하는 법을 알아보아요. 1. 수동 회전문은 너무 세게 밀면 안돼요. 회전 날개에 뒤따라오던 사람이 다칠 위험이 있습니다. 2. 회전문에 들어가기 전에 문이 돌아가는 속도를 눈여겨보고 안의 공간이 충분할 때 들어가야 합니다. 3. 통과하는 도중에 부채꼴 모양의 공간의 가운데쯤 서서 여유 있게 움직이세요. ★ 회전문 안전 기준 비상 정지 버튼 - 긴급 상황 때 수동으로 회전문을 멈출 수 있는 버튼 근접식 안전 센서 - 끼임 사고 등 비상시에 가까이 손을 대는 것만으로 자동으로 회전문이 멈추게 하는 안전 센서 비상 전지 버튼 - 갑자기 회전문을 멈춰야 할 때 수동으로 회전문을 멈출 수 있는 장치 회전 날개 접힘 기능 - 회전문에 갇혔을 때 쉽게 탈출할 수 있도록 회전 날개를 접을 수 있음"],[1,"엘리베이터를 타고 윗층으로 올라가려던 철수는 영희가 엘리베이터에 타기위해 뛰어오는 것을 발견하였습니다. 다음 중 어떤 행동을 해야 할까요?",["나랑 별로 친하지 않으므로 문 닫힘 버튼을 눌러 먼저 올라간다.","영희가 들어올 때까지 문 열림 버튼을 눌러준다.","문이 닫히지 않게 손으로 문을 잡는다.","빨리 뛰어오라고 발로 쿵쿵 소리를 낸다."],2,""],[1,"에스컬레이터의 움직이는 손잡이 밖으로 머리를 내밀면 어떻게 될까요?",["바람이 불어 머리가 시원하다.","아무런 문제가 없다.","멋져 보인다.","옆 기둥에 부딪히거나 머리가 끼어 다칠 수 있다."],4,""],[1,"에스컬레이터 계단 위에 표시된 노란색 선은 무엇을 의미할까요?",["예쁘게 꾸미려고","노란 안전선 안에 발을 올려놓으라고","어린이를 위한 놀이시설","물감이 남아서"],2,""],[1,"유모차를 끌고 에스컬레이터를 이용하려는 아주머니를 보았습니다. 다음 중 어떤 행동을 해야 할까요?",["유모차가 계단에서 떨어지지 않도록 아래에서 받혀준다.","에스컬레이터에서 유모차를 끌고 타면 위험하니 엘리베이터를 이용하라고 말씀드린다.","유모차를 앞질러 먼저 에스컬레이터에 탑승한다.","무시하고 지나간다."],2,""],[1,"아이들이 놀 때 착용하지 말아야 할 이것은 무엇일까요?",["슬리퍼","벙어리장갑","모자 달린 옷","마스크"],3,"옷에 달린 모자와 끈은 미끄럼틀이나 철봉 같은 놀이 기구에 걸렸을 때 어린이 혼자 힘으로 걸린 부분을 빼내지 못해 사고가 발생하기 쉽습니다. 놀 때뿐만 아니라 자동차 문에 걸리는 일도 많아요. 따라서 어린이는 되도록 모자가 달린 옷을 입지 않는 것이 좋습니다. 실제로 미국소비자 제품안전 위원회와 세이프 키즈 코리아에서는 아이들이 놀이를 할 때 이런 옷은 반드시 피해야 한다고 경고했습니다. 모자 달린 옷의 위험성과 안전한 옷차림에 대해 알아보아요. 1. 통이 큰 바지나 길게 늘어진 옷, 목걸이나 끈이 달린 장갑, 늘어지는 목도리 등은 놀이기구나 문, 에스컬레이터 등에 끼기 쉬우니 피해야 해요. 2. 어두운 옷보다는 밤에도 눈에 잘 띄는 밝은색 옷을 입는 것이 교통사고의 위험을 줄여줍니다. 3. 슬리퍼나 끈 달린 운동화도 사고를 불러올 수 있어요. 슬리퍼는 벗겨질 위험이 있으니 외출 시에는 되도록 신지 말고, 끈 달린 운동화는 끈이 제대로 묶여 있는지 늘 확인합니다. 4. 또한 겨울철 늘어진 목도리의 경우, 난로나 모닥불 옆을 지나다 목도리에 불이 불어 화상의 위험까지 있으니 밑으로 늘어지지 않도록 합니다."],[1,"아파트 등 공동 주택에 있는 공동출입문 때문에 일어나는 사고 중 가장 많은 것은 무엇일까요?",["문을 지나다 발목이 삐었다.","문 사이에 손가락이 끼어 절단됐다.","닫히는 문에 부딪혀 코피가 났다.","출입문 유리가 깨지며 파편에 베었다."],4,"아파트 등 공동 주택에는 사람들이 지나다니도록 만들어 놓은 공동 출입문이 있어요. 그런데 이 공동 출입문을 드나드는 어린이들에게 사고가 끊이지 않고 있습니다. 사고의 가장 큰 원인은 작은 충격에도 쉽게 깨지고, 깨진 조각도 날카로운 일반 판유리를 사용한다는 데 있어요. 판유리는 빠른 속도로 부딪히기만 해도 쉽게 깨지는 경우가 많아 사고가 일어날 가능성도 높답니다. 위기탈출 넘버원과 함께 어린이의 공동 출입문 사고를 막는 방법을 배워 보세요. 1. 공동 출입문의 유리는 반드시 잘 깨지지 않고, 깨지더라도 뭉툭하게 조각이 나는 강화 유리를 사용해야 합니다. 2. 강풍에 의해 문이 세게 닫히며 사고가 나기도 합니다. 사고를 막기 위해 힌지가 제대로 작동하는지 수시로 점검해 줍니다. 3. 일반 출입문에도 바람에 의한 사고를 막기 위해 문에 속도 제어 장치인 도어 클로저를 달고, 손 보호대 등 안전장치를 설치해 사고를 예방합니다."],[1,"스케이트보드에 의한 사고를 예방하는 방법으로 옳지 않은 것은 무엇일까요?",["보호 장구를 착용한다.","공원과 같이 안전한 장소에서 탄다.","밤에 자주 이용한다.","전문가들의 묘기를 흉내 내지 않는다."],3,""],[1,"성장에 가장 중요한 역할을 하는 성장판을 다치게 할 가능성이 가장 높은 동작은 무엇일까요?",["흙이 깔려있는 운동장에서 달리기를 하다 슬라이딩 했다.","거실에서 스트레칭을 하다 허리를 삐었다.","인조 잔디 위에서 줄넘기를 하다 엉덩이를 다쳤다.","아스팔트에서 인라인스케이트를 타다 바닥에 손을 디디며 넘어졌다."],4,"늘 부딪히고 넘어지곤 하는 우리 어린이들. 이렇게 다치면 성장에 가장 중요한 역할을 하는 성장판이 손상되는 일이 많아요. 주로 관절 부분에 있고 연골 조직으로 되어있는 성장판. 성장판이 손상되면 성장이 멈추거나 팔다리의 변형 등 후유증을 남길 수 도 있습니다. 따라서 평소의 올바른 운동 습관이 중요합니다. 성장판이 다치지 않도록 안전하게 운동하는 방법을 알아볼까요? 1. 운동은 아스팔트처럼 딱딱한 곳이 아니라 넘어졌을 때 충격을 흡수할 수 있는 흙이나 잔디가 깔린 운동장에서 해야 합니다. 2. 인라인스케이트를 탈 때는 무릎, 손목, 발목 보호대와 헬멧을 반드시 착용합니다. 3. 높은 곳에서 뛰어내리거나, 관전에 무리한 힘이 가해지는 운동은 삼가야 합니다. 4. 관절 부위를 다쳤을 때는 반드시 병원에서 정밀한 진단을 통해 성장판 손상여부를 확인합니다."]],[[1,"운동장을 뛸 때 일반적으로 시계 반대 방향으로 도는 이유는 무엇일까요?",["습관적인 행동이다.","더 편하기 때문이다.","운동장이 좁기 때문이다.","원심력에 의한 심장의 부담을 줄이기 위함이다."],4,""],[1,"다음 중 어린이들에게 가장 뛰어난 능력은 무엇일까요?",["판단능력","위기대응능력","행동능력","모방능력"],4,""],[1,"어린이들에게 허리 통증을 호소하게 만들고, 척추 부상을 입힐 수 있는 이것은 무엇일까요?",["의자","자전거","책가방","스케이트 보드"],3,"10명 중 3명의 어린이들에게 허리 통증을 호소하게 만드는 책가방, 무거운 책가방을 메면 척추가 받는 압력이 늘어나면서 턱이 가슴 쪽으로 숙여지고, 키가 작아질 수도 있습니다. 또한 척추가 S자 형으로 휠 위험이 있고, 심한 경우 척추가 옆으로 휘면서 몸 안의 내장에 나쁜 영향을 주는 척추 측만증이 생길 수도 있습니다. 책가방 착용 시 가장 중요한 바로 것은 책가방의 무게와 메는 방법! 그렇다면 허리에 무리가 없는 올바른 책가방 착용법은 무엇일까요?"],[1,"초등학생에게 가장 위험한 학교 시설물은 무엇일까요?",["계단","놀이기구","수돗가","운동장"],1,"우리 어린들이 매일 등교해 생활하는 학교에도 어린이의 안전을 위협하는 것은 곳곳에 있지요. 그중 우리 어린이들이 가장 조심해야할 것은 바로 계단입니다. 계단 사고를 예방하기 위해 가장 중요한 것은 질서에요. 계단에서 내려올 때는 장난치지 말고, 한 걸은 한 걸음 발을 바꿔 천천히 내려오면 계단은 더 이상 위험한 곳이 아닙니다. 1. 아이들이 안전하게 오르내릴 수 있도록 계단에 꼭 난간을 설치하고 이상이 없는지 수시로 점검합니다. 2. 아이들이 충분히 발을 디딜 수 있도록 계단 폭을 25cm 이상으로 넓게 만들고, 한 칸씩 오르기 쉽도록 계단은 촉을 20cm 이하로 맞춰야 합니다. 또한 미끄러짐을 방지하기 위해 미끄럼 방지턱을 설치하고 닳지 않았는지 늘 확인합니다. 3. 아이들이 미끄러져도 미끄러짐을 충분히 흡수해 줄 수 있는 고무나 금속으로 미끄럼 방지턱을 설치해야 합니다."],[1,"학교에서 일어나는 안전사고 중 가장 많이 일어나는 사고는 무엇일까요?",["넘어짐 및 미끄러짐","학생 간의 충돌","눌림 및 깔림","날카로운 물건을 베임"],1,"안전해야 할 학교에서도 사고가 끊이지 않고 있습니다. 그중 가장 많이 일어나는 사고는 학생들의 부주의와 신고 있는 간편한 슬리퍼에 의해 일어나지요. 슬리퍼는 신고 벗기 편하기 때문에 많은 학생들이 좋아하지만 밑창과 발등을 덮는 밴드 부분만 있어 벗겨지기 쉽습니다. 게다가 밑창이 평평하고 매끄럽기 때문에 다른 신발에 비해 미끄러질 위험이 큽니다."],[1,"어린이 안전사고 중 119 구조대 출동 원인 1위를 차지한 것은 무엇일까요?",["추락사고","장난감 삼킴 사고","폭발사고","문잠김 사고"],4,"안전을 위해 현관문에 다양한 잠금장치를 설치하는 경우가 많습니다. 하지만 순간의 부주의와 작동 방법을 모르는 경우 오히려 위험에 갇힐 수 있어요. 아이가 집에 혼자 있을 때 아이가 잠금장치를 잘못 눌러 보호자가 집으로 들어가지 못하게 되거나 이중, 삼중으로 되어있는 잠금장치를 열지 못하고 집안에 갇히는 사고가 일어나게 됩니다. 이러한 사고를 피하기 위해서는 현관문에 대한 안전교육이 필요해요. 현관문 잠김 사고를 막기 위해 꼭 체크 하세요. 1. 평소 아이들에게도 잠금장치 작동법을 반복적으로 익히게 해 위급한 상황에서도 문을 열 수 있도록 합니다. 2. 비상시를 대비해 현관문 잠금장치 옆에 여는 방법을 자세히 적어 놓습니다. 3. 어린아이나 노약자는 되도록 집에 혼자 두지 않는 것이 중요합니다."],[1,"많은 생활용품 속에 포함 된 것으로, 우리 몸속에 들어와 건강을 위협하는 이것은 무엇일까요?",["환경 호르몬","전자파","방사선","오존"],1,"‘내분비 장애물질’이라고도 부르는 환경 호르몬은 해로운 화학 물질이 우리 몸으로 들어와 마치 호르몬인 것처럼 작용하면 암, 기형아 출산, 유전자 변형 등 수 많은 질환을 불러일으키는 위험한 물질입니다. 환경 호르몬은 각종 플라스틱 제품, 헤어스프레이, 세제, 샴푸, 새 가구와 벽지 등 화학제품으로 만들어진 물건에서 발생해요. 생활에서 늘 사용하는 물건에서 나오기 때문에 우리는 환경 호르몬과 함께 살고 있다고 할 수 있을 정도랍니다."],[1,"대형 마트 안, 어린이의 안전을 위협하고 특히 머리 부상 등의 심각한 사고를 가져오는 이것은 무엇일까요?",["쇼핑카트","무빙워크","진열대","상자"],1,"부모님과 어린이가 함께 즐겨 찾는 대형 마트. 무거운 물건을 들고 다니는 수고를 덜어 주기 위해 유용하게 쓰이는 쇼핑 카트가 있습니다. 하지만 카트 때문에 어린이들이 자주 사고를 당하고 있습니다. 따라서 유아를 카트에 태웠을 때는 항상 엄마나 아빠가 지켜보고 있어야 합니다. 호기심 많은 아이들의 특성상 물건에 손을 뻗고 몸을 움직이다가 물건에 부딪혀 다치거나 카트에서 떨어지는 일도 있기 때문이에요. 즐거운 쇼핑을 위해서는 규정을 지키고 안전에 주의해야 합니다. 안전하고 즐거운 쇼핑을 위한 올바른 카트 사용법은 무엇일까요? 1. 쇼핑 카트의 유아용 좌석에는 반드시 3세 이하, 몸무게 15kg 이하의 어린이만 태웁니다. 2. 휴대용 어린이 안전 의자와 벨트를 사용해 카트에 탄 어린이가 일어서거나 움직이지 않도록 합니다. 3. 유아는 반드시 카트에 좌석에 앉히고, 짐을 싣는 칸에 태우거나 어린이가 카트를 직접 밀지 않도록 합니다."],[1,"다음 중 화상에 대한 응급처치로 옳지 않은 것은 무엇일까요?",["화상부위를 신속히 수돗물에 적시거나 담급니다.","화상 부위에 붙어 있는 옷 등은 제거하지 말고 더러운 물건이 접촉하지 않도록 합니다.","화상 부위에는 간장, 기름, 된장 등을 발라 둡니다.","소독 거즈가 있는 경우에는 화상 부위를 덮어주는 것이 좋습니다."],3,"화상 부위에는 간장, 기름, 된장 뿐 아니라 로션, 연고, 기름 등을 바르지 않습니다. 이는 2차 감염의 우려가 있습니다."],[1,"다음 중 올바른 에스컬레이터 이용방법은 무엇일까요?",["신발 끈이 잘 묶여 있는지 확인한다.","뒷사람을 위해 걸어 올라간다.","재미삼아 역방향으로 이용할 수도 있다.","유모차나 카트기를 가지고 탈 수 있다."],1,"에스컬레이터를 타기 전에는 신발 끈이 잘 묶여 있는지, 바지가 끌리지는 않는지 등을 확인하고 발밑을 잘 보고 계단에 올라섭니다."],[1,"다음 중 식중독 증상이 나타났을 때 올바른 대처방법은 무엇일까요?",["집에 있는 약을 먹어 구토와 설사를 멈추도록 한다.","설사 증세가 있는 사람은 탈수 방지를 위해 충분한 물을 섭취한다.","탈수 방지를 위해 과일즙이나 탄산음료를 많이 마신다.","즉시 밥을 많이 먹어 체력을 보충한다."],2,"독물을 체외로 배출해야 하므로 구토 설사 시 임의로 약을 먹어 멈추게 하면 안됩니다. 그리고 지사제 등 설사약은 함부로 복용하지 말고 반드시 의사의 지시를 따라야 합니다. 지사제는 설사를 통하여 자연적으로 몸 밖으로 배출되는 세균이나 세균성 독소 등의 배출을 막아 몸 속에 쌓이게 하여 더 심각한 증상을 초래할 수 있습니다."],[1,"다음 중 물에 들어갈 때 준비사항으로 옳지 않은 것은 무엇일까요?",["준비운동을 한 다음 다리부터 서서히 들어간다.","식사 후 2시간 이내에는 물에 들어가지 않는다.","수영에 자신이 있는 경우 배 밑으로 헤엄쳐 나가는 정도는 괜찮다.","초보자는 수심이 얕다고 안심해서는 안된다."],3,"수영에 자신이 있더라도 배 혹은 떠 있는 큰 물체 밑을 헤엄쳐 나가는 것은 매우 위험합니다. 그리고 숨을 들이쉰 상태에서 부력으로 배 바닥에 눌려 빠져나오기 어려울 때는 숨을 내뱉으면 몸이 아래로 가라앉기 때문에 배 바닥에서 떨어져 나오기 쉽습니다."],[1,"건설 현장에서 추락 사고가 가장 많이 일어나는 곳은 어디일까요?",["공사를 위해 뚫은 구멍","임시로 설치한 통로","이동식 사다리","경사진 지붕"],1,"산업 재해 중 가장 흔하게 발생하는 추락사고, 특히 건설 현장에서 많이 일어납니다. 건설 현장에는 추락의 위험이 많은 구멍이 많을뿐더러 난간이 없는 임시 통로나 높은 곳에서 아슬아슬하게 작업할 때가 많지만 귀찮다고 안전 조치를 소홀히 하는 것이 가장 큰 문제입니다. 산업 현장에서의 추락사고, 조금만 주의하면 막을 수 있어요. 1. 추락 위험이 있는 구멍에는 안전 표시를 해 아래로 떨어지는 것을 방지합니다. 2. 높은 곳에서 작업할 때에는 아래에 반드시 추락 방지망을 설치해 만일의 사고에 대비합니다. 3. 작업할 때에는 항상 안전모를 쓰고, 2m 이상 높은 장소에서 일할 때에는 몸이 아래로 떨어지더라도 몸을 안전하게 잡아 주는 안전대를 반드시 착용합니다."],[1,"다음 중 체육 활동 중 사고가 있어났을 때 대처하는 방법으로 옳지 않은 것은 무엇일까요?",["즉시 선생님께 알린다.","119에 신고하거나 보건 선생님께 도움을 청한다.","상처가 난 경우, 흐르는 물로 상처를 씻어내고 지혈한다.","상처에 이물질이 박혀있는 경우 무조건 제거하고 선생님께 알린다."],4,"상처에 이물질이 깊이 박혀있는 경우는 손쉽게 제거하기 어렵습니다. 이럴 때는 그대로 두고 119나 선생님께 알려 조치를 받을 수 있도록 해야 합니다. 그리고 뼈가 다쳤다고 생각되면 함부로 움직이지 말고 반드시 구조대를 기다립니다."],[1,"이공원에서 놀이기구가 타다 사고가 났을 때 대처하는 방법으로 옳지 않은 것은 무엇일까요?",["놀이기구가 고장이 나 멈추면 뛰어내리거나 주변사물을 이용해서 탈출한다.","넘어지거나 떨어져 다친 경우 함부로 움직이지 않는다.","즉시 주변의 어른에게 도움을 요청한다.","당황하지 말고 침착하게 기다린다."],1,"놀이기구가 멈추면 함부로 움직이지 말고, 안전요원에게 알린 후 통제에 따라야 합니다."],[1,"다음 중 상처에서 피가 날 경우 대처방법으로 옳지 않은 것은 무엇일까요?",["일회용 장갑을 끼고 소독을 한다.","상처부위는 심장위치보다 낮게 한다.","소독한 거즈나 깨끗한 천으로 상처부위를 완전히 덮는다.","상처 치료용 거즈 위에 붕대를 감고, 병원에 간다."],2,"상처에서 피가 날 경우 상처부위를 심장위치보다 높게 올려 심장에서 뿜어져 나오는 피가 상처 쪽으로 쉽게 도달하지 못하도록 하여 출혈을 줄이는 것이 좋습니다."],[1,"장소별로 지켜야 할 물놀이 안전수칙으로 알맞은 것은 무엇일까요?",["바닷가나 강가에서는 물의 깊이는 가슴정도가 적당합니다.","바닷가에서는 안전보호장치인 튜브를 꼭 착용합니다.","계곡에서 물놀이를 하다가 비가 오면 즉시 물에서 나와 대피해야 합니다.","수영금지 지역에서는 어른과 함께 얕은 곳에서만 조심해서 물놀이를 합니다."],3,"바닷가나 강가에서 놀기 적당한 물의 깊이는 배꼽정도가 적당합니다. 물살이나 파도를 확인하고 입수해야 하며 수영금지 지역에서는 물놀이를 해서는 안됩니다. 그리고 튜브는 수영보조기구이지 안전보호장치가 아니므로 주의해서 사용해야 합니다.‘’"],[1,"차내 안전사고가 발생하는 이유로 볼 수 없는 것은 무엇일까요?",["차안에서 장난을 치다가 차가 갑자기 멈출 때","차가 갑자기 서면 관성의 법칙에 의하여 몸이 앞으로 쏠리게 되고 차 내부의 돌출물이나 유리창에 부딪침","안전띠를 매지 않았을 때","차문을 꼭 잠갔을 때"],4,""],[1,"6세 미만의 유아를 차에 탑승시킬 때의 주의사항으로 틀린 것은 무엇일까요?",["차의 앞자리에 안고 탄다.","운행 중 문을 열지 않도록 잠금장치를 확인한다.","유아용 보호 장구를 장착한다.","차내에 어린이만 남겨두고 내리지 말아야 한다."],1,""],[1,"교통질서와 안전 지키기 실천을 위해서 해야 할 것이 아닌 것은 무엇일까요?",["평소의 교통안전 생활에 대해 반성한다.","교통규칙 지키기 및 안전생활에 대한 약속은 할 필요가 없다.","교통 실천계획을 세우고 앞으로 지켜나간다.","교통안전 생활에 대한 다짐을 글이나 말로 표현한다."],2,""],[1,"과속방지턱의 정확한 설치규격은?",["높이 10cm, 너비 2m","높이 10cm, 너비 3.6m","높이 12cm, 너비 3.6m","높이 12cm, 너비 2m"],2,""],[1,"일반적으로 14세 이하 특히 5~9세의 어린이 교통사고 사망자의 성별비교에 대해 올바른 설명은?",["여아가 남아보다 사망위험이 1.2배 많다.","여아가 남아보다 사망위험이 1.8배 많다.","남아가 여아보다 사망위험이 1.2배 많다.","남아가 여아보다 사망위험이 1.8배 많다."],4,""],[1,"자전거의 수신호 중 왼팔을 차체의 밖으로 45도 밑으로 편 동작은 무엇을 나타내는 동작인가?",["좌회전","우회전","정지","서행"],3,"좌회전 시: 왼팔을 수평으로 펴거나 오른팔의 팔꿈치를 굽혀 수직으로 올린다. 정지할 때: 왼팔을 차체의 밖으로 45도 밑으로 편다. 우회전시: 오른팔을 수평으로 펴거나 왼팔의 팔꿈치를 굽혀 수직으로 올린다. 뒤차에게 앞지르기를 시킬 때: 왼팔을 수평으로 펴서 손을 앞뒤로 흔든다. 서행할 때: 왼팔을 45도 밑으로 펴서 상하로 흔든다."],[1,"자전거가 천천히 속도를 줄여야 할 곳이 아닌 곳은 무엇일까요?",["좌·우에서 튀어나올 수 있는 자전거를 확인할 수 없는 교차로","도로가 구부러진 시야 방해 커브길","좁은 도로","직선도로"],4,""],[1,"택시 범죄 피해 예방 수칙으로 옳지 않은 것은?",["되도록 혼자 택시에 타지 말 것","큰 소리로 통화하며 상대방에게 택시 번호를 알려줄 것","합승은 거절하고, 앞좌석에 탈 것","112를 단축번호에 저장하고 돌발 상황에 침착하게 대응할 것"],3,"택시를 탄 경우 합승은 62, 38","72, 28","82, 18"],2,""]],[[1,"매년 1회씩‘가족에게 교통안전’을 테마로 전국 교통안전 운동에 맞춰 교통안전 빙고대회·교통안전 약속증 발급·횡단보도 건너기 체험 등을 실시하는 나라는?",["영국","스웨덴","독일","미국"],1,""],[1,"어린이 교통안전 교육이 법적 의무화되어 있고 자전거 교통안전 실습 교육장에서 소정의 교육을 이수한 어린이들에게 「자전거 운전 면허증」을 교부하는 나라는?",["영국","스웨덴","프랑스","독일"],4,""],[1,"캐나다 운전자들이 법규 위반 시 가장 무거운 처벌을 하여 이 차를 발견 시 노이로제 수준까지 이르게 할 정도로 무서워하는 차는?",["경찰차","소방차","어린이 통학차량","엠블런스"],3,""],[1,"OECD국가 중 어린이 교통사고가 가장 적은 나라는?",["스웨덴","영국","네덜란드","일본"],1,""],[1,"스웨덴의 3대 교육방침이 아닌 것은?",["3세부터 안전교육실시","어린이 교통공원서 교육하기","실제 사고사례 중심의 실습교육","사회적 공동체의식을 중시하는 교육"],2,""],[1,"국가간 교통사고 비교하는데 자동차 1만대당 사망자수를 주로 비교합니다.(2016년 기준) 이웃일본은 0.5명이며 OECD 국가의 평균은 1.0명입니다. 한국은 몇 명일까요?",["1명","1.7명","2.5명","3.1명"],2,""],[1,"일본의 가정에서 어린이 교통사고예방에 크게 기여한 예방기법은?",["교통안전 지도 그려 교육하기","스쿨존 제도","교통안전 가족회의 개최하기","강력한 위반차량 단속"],3,""],[1,"일본의 교통유아육영회는 교통사고로 부모를 잃은 유자녀를 돌보아 주는 단체로 무슨 운동을 적극 펼치고 있을까요?",["교통사고 줄이기 운동","정지선 지키기 운동","노란모자 쓰고 등교하기 운동","은혜 갚기 운동"],4,""],[1,"등하교시 방향이 같은 어린이들을 자원봉사요원이 데리고 다니며 현장에서 안전교육까지 실시하는 워킹스쿨버스(보행안전지도) 제도를 제일 먼저 실시한 나라는?",["미국","호주","뉴질랜드","캐나다"],2,""],[1,"‘Safety Wave’운동 즉, 통학버스 운전자에게 손 흔들어 주기 운동을 통해 어린이가 안전하게 차량에서 내렸는지 확인하자는 차원에서 생긴 운동을 실시하는 나라는 어디일까요?",["미국","호주","뉴질랜드","캐나다"],4,""],[1,"학생들의 교통안전을 위해 호주의 학교에서 금지령을 내리기도 한 이것은 무엇일까요?",["선글라스","햄버거","이어폰","휴대전화"],3,"길거리를 걸으면서 음악이나 라디오를 듣기 위해 자주 사용하는 이어폰. 하지만 지나치게 크게 듣거나 오랜 시간 이어폰을 통해 듣는 것은 청력에도 나쁜 영향을 미칠 뿐만 아니라 자동차의 경적 소리 등 외부의 소리가 들리지 않아 교통사고율을 높이는 위험한 물건이랍니다. 또한 보행자의 집중력을 떨어뜨려 사고가 일어나려는 상황에서 순간적으로 대처하는 능력 또한 떨어져 사고를 당할 위험이 높아집니다. 올바른 이어폰 사용으로 교통사고의 위험에서 벗어나 봐요. 1. 도로를 걸어갈 때에는 안전을 위해 이어폰이나 헤드폰을 빼거나 소리를 줄이고, 거리에서는 되도록 이어폰을 사용하지 않는 것이 좋습니다. 2. 지나치게 두꺼운 털 귀마개 역시 소리를 들리지 않게 할 수 있으므로 도로에서는 잠시 빼 주세요. 3. 인라인스케이트나 자전거를 탈 때에는 절대로 이어폰을 착용해서는 안 됩니다."],[1,"자동차에서 다른 끼임 사고에 비해 피해 정도가 가장 심각한 이 끼임 사고는 무엇일까요?",["선루프 닫음으로 인한 목 끼임 사고","안전벨트 고리로 인한 손 끼임 사고","운전석 의자 작동에 인한 손 끼임 사고","차문 닫음으로 인한 손 끼임 사고"],4,"옆으로 밀어서 열고 닫는 슬라이딩 도어에 의한 사고는 심할 경우 사망에 이를 정도로 피해가 엄청납니다. 이런 문은 닫히는 힘이 일반 여닫이문의 약2배에 달하고, 문의 이음새가 날카로운 금속으로 처리되어 있어 그 사이에 신체 일부가 끼인다면 큰 사고로 이어질 수 있습니다. 또한 경사진 길 위라면 문을 살짝만 건드려도 빠른 속도로 닫혀 위험도가 더욱 높습니다. 1. 슬라이딩 도어를 닫기 전에는 손이나 발이 문틀에 걸쳐 있지 않은지 2. 어린이가 탔을 경우 보호 잠금 장치를 이용해 어린이가 문을 함부로 여닫지 못하게 합니다. 3. 옆에서 오는 다른 차량은 문이 열리는 것을 보지 못해 교통사고로 이어질 수 있으니 차는 항상 인도에 바짝 붙여 세웁니다."],[1,"날씨가 무더운 한여름, 어린아이가 손을 댈 경우 2도 화상까지 입을 수 있는 이것은 무엇일까요?",["자동차","휴대전화","보도블럭","벤치"],1,"한여름에 강한 햇볕을 받은 자동차의 표면 온도는 80℃ 이상까지 올라갑니다. 특히 검은색 자동차는 피부가 약한 어린아이가 2도 화상까지 입을 수 있을 정도로 뜨거워지지요. 같은 자동차라도 색에 따라 표면 온도가 다른 이유는 색에 따라 빛에 대한 반사율이 다르기 때문입니다. 흰색은 반사율이 높아 온도가 많이 올라가지 않지만 검은색은 빛을 반사하는 것보다 흡수하는 양이 많기 때문에 온도가 더욱 높아집니다. 게다가 자동차의 주재료인 철은 나무나 돌 등의 물체보다 빠른 시간에 열이 전해져 다른 사물보다 온도가 금방 높아지게 됩니다. 흉기가 될 수 있는 한여름의 자동차, 안전한 자동차 이용에 대해 알아보아요. 1. 검은색 차인 경우에는 되도록 그늘에 주차하거나 지하 주차장을 이용합니다. 햇볕이 뜨거우면 차 내부의 온도 역시 높이 올라가므로 창문을 1~2cm정도 열어 두는 것도 좋아요. 2. 뜨거워진 차에 탈 때에는 좌우 문을 모두 열어 실내의 뜨거운 공기를 빼낸 후 타세요. 어린이가 탈 때에는 좌석을 만져 온도를 확인한 후 탑니다. 3. 성인에 비해 체온 조절 기능이 떨어지는 아이들은 차 안의 높은 온도로 인해 열사병이 걸리거나 질식을 할 위험이 있으므로 어린이를 혼자 차 안에 두면 절대 안 됩니다."],[1,"해수욕장 이용방법으로 옳지 않은 것은?",["모래를 다른 사람에게 뿌리면 눈에 모래가 들어갈 수 있으므로 주의한다.","자신의 허리보다 깊은 물에서 논다.","모래 속에 날카로운 물질(조개껍데기, 뾰족한 돌, 깨진 유리병 등)이 묻혀 있을 수 있으므로 항상 신발(장금장치 있는)을 신고 다녀야 한다.","수영 중에 맨발로 바위에 올라가서 장난치지 않는다.","햇볕이 심할 때는 그늘에서 쉬는 것이 좋다."],2,""],[1,"수영장 이용방법으로 옳지 않은 것은?",["수영장 안에서는 뛰지 않는다.","물에 들어갈 때와 나올 때에는 벽에 설치된 계단을 이용한다.","친구와 같이 들어가면 수영 모자와 물안경을 쓰지 않아도 된다.","수영장 안으로 유리컵이나 병을 가지고 들어가지 않는다.","친구를 수영장 안으로 갑자기 밀거나 장난을 치지 않는다."],3,""],[1,"계곡, 강에서 물놀이 할 때 주의사항으로 옳지 않은 것은?",["물살이 센 곳에서는 수영을 하지 않는다.","급격한 수온차가 있을 수 있으므로 주의해야 한다.","춥게 느껴지면 곧바로 물 밖으로 나와서 쉬도록 한다.","신발이나 물건이 떠내려가면 빠르게 직접 가서 가져온다.","경험 없는 수영자나, 어린 아이들은 구명조끼를 착용해야한다."],4,""],[1,"친구가 물에 빠졌을 때 상황별 대처요령 중 옳은 것은?",["즉시 큰 소리로 인명구조요원과 어른에게 알리고 119에 신고한다.","구명조끼를 입고 친구를 구하러 물에 들어간다.","구조한 뒤에는 체온이 떨어져 있으니 비슷한 온도의 물에 젖은 옷과 수건으로 감싸준다.","친구가 침착하게 행동할 수 있게 큰소리를 내지 않고 조용히 상황을 지켜본다.","제일 키가 큰 친구를 불러 구조하게 한다."],1,""],[1,"물놀이 안전수칙 중 옳지 않은 것은?",["교사나 부모, 안전요원들이 지켜볼 수 있는 곳에서 물놀이를 한다.","물의 깊이가 어린이의 배꼽 정도까지 차는 곳에서만 물놀이를 한다.","물놀이 도중 몸에 소름이 돋고 몸이 떨리고 입술이 파래지면 물놀이를 중지하고 밖으로 나와 타월 등으로 몸을 따뜻하게 해준다.","햇볕이 뜨거울 때는 물이 가장 따뜻하니 물놀이에 제일 좋은 시간이다.","햇볕에 가장 강한 낮 12시~3시 사이를 피해 물놀이를 하는 것이 좋다."],4,""],[1,"그네를 탈 때 안전수칙으로 옳지 않은 것은?",["그네가 완전히 정지한 후에 타고 내린다.","그넷줄을 꼬지 않고 탄다.","운동을 잘 하는 사람은 타는 도중에 뛰어내려도 된다.","다른 아이가 그네를 타고 있을 때 그 앞으로 지나가거나 그 앞에서 기다리지 않는다.","배를 깔고 엎드려서 타거나 서서 타지 않는다."],3,""],[1,"미끄럼틀을 탈 때 안전수칙으로 옳지 않은 것은?",["올라갈 때는 손잡이를 꼭 잡고 계단 하나씩 올라간다.","빨리 내려가고 싶을 때는 뒤에 친구한테 밀어달라고 한다.","미끄럼판에서는 한 사람씩 앉아서 내려온다.","엎드려 타거나 서서 타지 않는다.","가방, 장난감을 들고 타지 않는다."],2,""],[1,"회전놀이기구를 탈 때 안전수칙으로 옳지 않은 것은?",["회전하는 도중에 뛰어내리거나 뛰어오르지 않는다.","회전 중에 친구와 장난하지 않는다.","회전 중에 회전대를 멈추려면 두 손으로 잡는다.","회전대를 발로 돌리지 않는다."],3,""],[1,"가정 내 화상사고 예방법으로 옳지 않은 것은?",["부모님께 칭찬을 받기 위해 몰래 부엌에서 도울 것을 찾는다.","전자레인지, 오븐, 스토브와 같은 전열 기구는 함부로 만지지 않는다.","욕조나 세면대에서 뜨거운 물로 인한 화상을 예방하기 위해서 화상 방지용 수도꼭지를 사용한다.","집안의 전기 콘센트는 반드시 안전장치 덮개가 있는 것을 사용한다.","주방에는 뜨거운 불과 물, 날카로운 칼 등이 있어 매우 위험하므로 가능한 허락 없이 함부로 들어가지 않는다."],1,""],[1,"가전 내 감전사고 예방법으로 옳지 않은 것은?",["전기제품을 젖은 손으로 만지거나 콘센트에 젓가락 등으로 장난을 쳐서는 안 된다.","콘센트 안전덮개 등의 안전장치를 사용해야 한다.","컴퓨터 선은 직접 정리하고 만져도 된다","욕실에서 사용하는 전기기구는 사용하지 않을 때 반드시 플러그를 뽑는다.","바닥에 있는 플러그나 전선 등 걸리는 것들을 치우고 넘어지지 않게 주의한다."],3,""],[1,"가정안전 사고 예방법 중 옳지 않은 것은?",["각종 세제와 살충제, 가구 광택제 등은 함부로 만지지 않는다.","욕실에서는 미끄러지지 않도록 뛰지 않는다.","원터치 캔 등을 혼자 따지 않는다.","냉장고, 세탁기 등에 들어가지 않는다.","장난감은 원하는 곳 어디든 보관하고 내가 기억하면 된다."],5,""],[1,"어린이 보호구역과 관련한 설명으로 옳은 것은?",["최근 어린이 보호구역에서의 어린이 사고는 점점 증가하고 있다.","시속 30km로 주행하는 차보다 시속 60km로 주행하는 자동차가 보행자와 충동했을 때 보행자가 더 크게 다친다.","어린이 보호구역에 주*정차를 못 하지만 인도에 자동차, 오토바이를 세워둬도 된다.","어린이 보호구역에서는 어린이가 전동킥보드를 타도 된다."],2,"시속 60km로 주행하는 자동차가 보행자와 충돌했을 때 보행자가 크게 다칠 가능성은 92.6%다. 자동차 속도가 시속30km로 줄어들면 보행자가 크게 다칠 가능성은 15.4%로 급격히 줄어든다. 특히 속도가 빠르면 충돌 시 머리에 가해지는 충격이 커져 사망 확률도 80%이상으로 커진다고 한다."],[1,"도로를 따라 걸어갈 때 지켜야 할 수칙으로 옳지 않은 것은?",["휴대전화를 사용하거나 음악을 들으면서 걷지 않는다.","도로를 따라 걸어가야 할 때 차량을 등지고 걸어간다","비 오는 날, 어두운 날, 야간에는 가능한 밝은색의 옷을 입고 걸어간다.","밤에 걸을 때, 자동차 전조등 빛이 비추는 범위를 넘어서면 운전자가 깜깜하여 보이지 않으므로 항상 조심한다.","공을 차면서 걷거나 도로에서 인라인스케이트나 킥보드를 타는 행동은 하지 않는다."],2,""],[1,"도로를 횡단할 때 안전 수칙 문제입니다. 옳지 않은 것은?",["횡단보도라도 절대 안전한 곳이 아니므로 차량의 운전자가 ‘나’를 보았는지 확인한 후 횡단한다.","신호등 녹색불  큰 진동과 울림을 일으킵니다."],[1,"놀이공원에서 놀이기구가 타다 사고가 났을 때 대처하는 방법으로 옳지 않은 것은 무엇일까요?",["놀이기구가 고장이 나 멈추면 뛰어내리거나 주변사물을 이용해서 탈출한다.","넘어지거나 떨어져 다친 경우 함부로 움직이지 않는다.","즉시 주변의 어른에게 도움을 요청한다.","당황하지 말고 침착하게 기다린다."],1,"놀이기구가 멈추었을 때는 함부로 움직이지 말고, 선생님이나 안전요원에게 알린 후 통제에 따라야 합니다."],[1,"스키를 타는 중 사고가 났을 때 대처하는 방법으로 옳지 않은 것은 무엇일까요?",["충돌사고가 나면 선생님이나 안전요원에게 소리를 쳐 알린다.","뒤에 오는 사람과 부딪쳐서 2차 사고가 나지 않도록 길 가운데로 이동한다.","뒤에 오는 사람과 부딪쳐서 2차 사고가 나지 않도록 길 바깥쪽으로 이동한다.","넘어지거나 부딪쳐 다친 사람을 발견하면 옮기지 말고 패트롤의 도움을 요청한다."],2,"뒤에 오는 사람과 부딪쳐서 2차 사고가 나지 않도록 길 바깥쪽으로 이동해야 합니다."],[1,"다음 중 유괴의 위험을 느꼈을 때 대처하는 방법으로 옳지 않은 것은 무엇일까요?",["부모님 허락 없이 다른 사람이 주는 물건이나 음식은 거절한다.","누군가 같이 가자고 하면 거절한다.","누군가 자동차에 타라고 하면 거절하고 자동차의 진행방향으로 피한다.","다른 사람에게 이름이나 연락처를 함부로 알려주지 않는다."],3,"누군가 자동차에 타라고 하면 거절하고 즉시 자동차의 반대방향으로 피해야 합니다. 진행방향으로 피할 경우 쉽게 따라와서 강제로 차에 태울 수 있기 때문입니다."],[1,"다음 중 무더위로 쓰러진 사람을 발견했을 경우 대처하는 방법으로 옳지 않은 것은 무엇일까요?",["통풍이 잘되는 그늘로 옮긴다.","구토증세가 있으면 물을 먹여 수분을 보충한다.","체온이 내려가면 이온음료를 마시게 한다.","옷을 벗기고 찬물수건으로 몸을 감싼다."],2,"옷을 벗기고 찬물수건으로 몸을 감싸거나 찬물을 뿌린 후, 에어컨과 선풍기를 틀어 체온을 내려야 합니다. 얼굴이 창백한 경우 머리를 다리보다 낮게하여 쇼크를 예방합니다. 이때 구토증세가 있을 시 수분보충은 금물입니다."],[1,"다음 중 코피가 났을 경우 어떻게 조치하는 것이 좋을까요?",["이마와 코 사이(콧등)에 냉찜질을 한다.","이마와 코 사이(콧등)에 온찜질을 한다.","고개를 뒤로 젖힌다.","숨쉬기 답답하므로 코를 막지 않는다."],1,"코피가 날 경우 고개를 아래로 숙입니다. 뒤로 젖힐 경우 피가 기도로 넘어갈 수 있기 때문입니다. 5~10분간 코뼈 바로 아래 부분을 세게 누릅니다. 탈지면이나 깨끗한 휴지로 코피가 나는 코 속을 막아 출혈을 막습니다. 냉찜질로 코 속 혈관을 수축하여 출혈을 막습니다."],[1,"다음 중 벌에 쏘였을 경우 대처방법으로 옳지 않은 것은 무엇일까요?",["비눗물로 상처부위를 깨끗이 씻는다.","항히스타민제 연고를 바른다.","붓거나 가려우면 온찜질을 한다.","벌침을 제거하기 힘들 경우 바로 병원으로 간다."],3,"벌에 쏘인 곳을 생리식염수 또는 비눗물로 깨끗이 씻고 항히스타민제 연고를 바르는 것이 좋습니다. 쏘인 부위가 붓거나 가렵다는 것은 벌침의 독이 남아 있다는 뜻이므로 온찜질을 하면 피부와 혈관이 팽창하여 독이 쉽게 퍼져나갈 수 있기 때문에 냉찜질이 더 좋습니다."],[1,"다음 중 심폐소생술의 방법이 잘못된 것은 무엇일까요?",["어깨를 두드려 의식을 확인한다.","환자의 머리가 위에 오도록 비스듬한 곳에 눕힌다.","분당 100회의 속도로 심폐소생술을 한다.","가슴 압박 30회 실시 후, 인공호흡을 2회 실시한다."],2,"환자를 평평한 바닥에 눕히고 환자 가슴 옆에 무릎 꿇는 자세를 취하는 것이 안정적입니다. 비스듬히 눕히면 효과적인 흉부압박이 힘듭니다."],[1,"건물 전체가 화염에 뒤엎였던 9.11사고에서 생존자들이 건물 내에서 대피 할 수 있던 방법은 무엇이었을까요?",["옥상으로 올라가 헬기로 구조되었다.","화물용 엘리베이터로 탈출했다.","수건으로 호흡기를 가리고 구조될 때까지 기다렸다.","방화문을 닫고 비상계단으로 탈출했다."],4,"고층 건물 전체가 연기와 불꽃에 휩싸였던 9.11 사고에서 많은 사람들이 무사히 빠져나올 수 있었던 것은 연기가 퍼지지 않은 비상계단을 이용했기 때문입니다. 방화문은 건물에서 화재가 발생할 경우, 연기가 불길이 다른 층으로 번지는 것을 막아 사람들이 비상계단을 통해 안전하게 탈출할 수 있도록 하는 문을 말합니다. 소방법에 따라 평소에도 늘 닫아 두어야 해요. 화재가 발생했을 때 연기나 불길을 막아 주는 방화문, 안전한 사용법을 알아봐요. 1) 방화문은 화재가 일어났을 때 불꽃과 연기가 다른 층으로 번지는 것을 막아주는 역할을 하므로 평소에도 반드시 닫아 두어야 합니다. 2) 대피할 때 방해가 될 수 있으므로 방화문 주변의 비상계단에는 화분, 자전거 등의 물건을 두지 말아야 해요. 3) 화재가 났을 때에는 연기를 마시지 않도록 젖은 수건 등의 천으로 코와 입을 막고 침착하게 비상계단으로 대피합니다."],[1,"바다나 수영장, 계곡 등 물이 있는 곳에서 끊임없이 발생하는 익수 사고를 예방할 수 있는 방법으로 옳은 것은 무엇일까요?",["음식물을 먹은 뒤 바로 물놀이를 한다.","다리나 팔 등의 근육 경련을 막기 위해 준비 운동을 꼭 한다.","심장에 가까운 곳에서 먼 곳으로 물을 묻힌다.","준비운동이 끝나면 바로 물속으로 다이빙해서 들어간다."],2,"바다나 수영장, 계곡 등 물이 있는 곳에서 끊임없이 발생하는 익수 사고로 목숨을 잃는 사람들이 많아요. 특히 20세 이하 청소년과 어린이가 전체 사고자의 20%를 넘는다고 합니다. 수영장에 들어서자마자 물에 뛰어들거나 다른 사람을 물에 빠뜨리는 장난, 음식을 먹은 뒤 바로 물에 들어가는 행동은 매우 위험합니다. 사소한 부주의로 일어나는 익수 사고, 얼마든지 막을 수 있습니다. 1) 위경련이나 구토로 인한 질식 사고를 방지하기 위해 음식물을 먹은 뒤 최소 1시간이 지난 다음에 물놀이를 하세요. 2) 다리나 팔 등의 근육 경련을 막기 위해 반드시 준비 운동을 합니다. 3) 준비 운동을 한 뒤 심장으로부터 먼 곳, 즉 손과 발, 팔, 다리, 몸통 순으로 물을 묻혀 물을 온도에 익숙해진 다음 계단을 이용해 다리부터 천천히 물에 들어갑니다. 4) 만약 물속에서 경련이 일어났다면 일단 물 밖으로 고개를 내밀어 숨을 깊게 들이마시고 발가락 끝을 발등 쪽으로 젖혀 경련을 풀어 줍니다."],[1,"학교 시설물 중 초등학생의 안전을 가장 위협하는 시설물은 무엇일까요?",["수돗가","놀이기구","운동장","계단"],4,"우리 어린들이 매일 등교해 생활하는 학교에도 어린이의 안전을 위협하는 것은 곳곳에 있지요. 그중 우리 어린이들이 가장 조심해야할 것은 바로 계단입니다. 계단 사고를 예방하기 위해 가장 중요한 것은 질서에요. 계단에서 내려올 때는 장난치지 말고, 한 걸은 한 걸음 발을 바꿔 천천히 내려오면 계단은 더 이상 위험한 곳이 아닙니다. 1) 아이들이 안전하게 오르내릴 수 있도록 계단에 꼭 난간을 설치하고 이상이 없는지 수시로 점검합니다. 2) 아이들이 충분히 발을 디딜 수 있도록 계단 폭을 25cm 이상으로 넓게 만들고, 한 칸씩 오르기 쉽도록 계단은 촉을 20cm 이하로 맞춰야 합니다. 또한 미끄러짐을 방지하기 위해 미끄럼 방지턱을 설치하고 닳지 않았는지 늘 확인합니다. 3) 아이들이 미끄러져도 미끄러짐을 충분히 흡수해 줄 수 있는 고무나 금속으로 미끄럼 방지턱을 설치해야 합니다."],[1,"학교에서 학생들의 부주의와 신고 있는 슬리퍼 때문에 가장 많이 일어나는 사고는 무엇일까요?",["눌림 및 깔림","넘어짐 및 미끄러짐","학생 간의 충돌","날카로운 물건을 베임"],2,"안전해야 할 학교에서도 사고가 끊이지 않고 있습니다. 그중 가장 많이 일어나는 사고는 학생들의 부주의와 신고 있는 간편한 슬리퍼에 의해 일어나지요. 슬리퍼는 신고 벗기 편하기 때문에 많은 학생들이 좋아하지만 밑창과 발등을 덮는 밴드 부분만 있어 벗겨지기 쉽습니다. 게다가 밑창이 평평하고 매끄럽기 때문에 다른 신발에 비해 미끄러질 위험이 큽니다."],[1,"디딤판과 손잡이가 있는 난간 사이의 틈에 옷자락이나 신발 끈이 끼이는 사고가 자주 발생하고, 손가락, 발가락 끼임 사고까지도 발생하는 시설물은 무엇일까요?",["경사로","회전문","에스컬레이터","화물용 엘리베이터"],3,"움직이는 계단으로 백화점이나 공공시설에 꼭 필요한 에스컬레이터는 움직이는 특성 때문에 사고의 위험이 있어요. 에스컬레이터에서 발을 올리는 디딤판과 손잡이가 있는 난간 사이의 틈에 옷자락이나 신발 끈이 기이는 등 사고가 자주 발생합니다. 1) 에스컬레이터에서는 이야기를 하거나 장난치지 말아야 합니다. 2) 시선은 정면을 향하고 반드시 손잡이를 잡고 이용합니다, 3) 끼임 사고를 방지하기 위해 운동화 끈이 풀리지 않았는지 확인하고, 헐렁한 바지의 밑단, 긴 치맛자락 등이 끼이지 않도록 해야 합니다. 4) 에스컬레이터에 떨어진 물건을 주우려다 손이 끼일 수도 있으니 조심하세요. 또한 균형을 잘 잡지 못하여 추락의 위험이 있으니 디딤판의 노란 선 안쪽에 서야합니다."],[1,"대형 마트에서 무거운 물건을 들고 다니는 수고를 덜어주나 물건에 부딪히거나 머리 부상을 일으키는 등 어린이의 안전을 위협하는 것은 무엇일까요?",["엘리베이터","무빙워크","쇼핑카트","진열대"],3,"부모님과 어린이가 함께 즐겨 찾는 대형 마트. 무거운 물건을 들고 다니는 수고를 덜어 주기 위해 유용하게 쓰이는 쇼핑 카트가 있습니다. 하지만 카트 때문에 어린이들이 자주 사고를 당하고 있습니다. 따라서 유아를 카트에 태웠을 때는 항상 엄마나 아빠가 지켜보고 있어야 합니다. 호기심 많은 아이들의 특성상 물건에 손을 뻗고 몸을 움직이다가 물건에 부딪혀 다치거나 카트에서 떨어지는 일도 있기 때문이에요. 즐거운 쇼핑을 위해서는 규정을 지키고 안전에 주의해야 합니다. 안전하고 즐거운 쇼핑을 위한 올바른 카트 사용법은 무엇일까요? 1) 쇼핑 카트의 유아용 좌석에는 반드시 3세 이하, 몸무게 15kg 이하의 어린이만 태웁니다. 2) 휴대용 어린이 안전 의자와 벨트를 사용해 카트에 탄 어린이가 일어서거나 움직이지 않도록 합니다. 3) 유아는 반드시 카트에 좌석에 앉히고, 짐을 싣는 칸에 태우거나 어린이가 카트를 직접 밀지 않도록 합니다."],[1,"어린이 안전사고 중 119 구조대 출동 원인 1위를 차지하는 것은‘문 잠김 사고’입니다. 문 잠김 사고를 예방하는 방법으로 알맞지 않은 것은 무엇일가요?",["평소 어린이에게 잠금장치 작동법을 반복적으로 익히게 한다.","현관문 비밀번호를 문 바깥쪽에 붙여놓는다.","현관문 잠금장치 옆에 여는 방법을 자세히 적어놓는다.","어린이는 되도록 집에 혼자 두지 않는다."],2,"안전을 위해 현관문에 다양한 잠금장치를 설치하는 경우가 많습니다. 하지만 순간의 부주의와 작동 방법을 모르는 경우 오히려 위험에 갇힐 수 있어요. 아이가 집에 혼자 있을 때 아이가 잠금 장치를 잘못 눌러 보호자가 집으로 들어가지 못하게 되거나 이중, 삼중으로 되어 있는 잠금장치를 열지 못하고 집안에 갇히는 사고가 일어나게 됩니다. 이러한 사고를 피하기 위해서는 현관문에 대한 안전 교육이 필요해요. 1) 평소 아이들에게도 잠금장치 작동법을 반복적으로 익히게 해 위급한 상황에서도 문을 열 수 있도록 합니다. 2) 비상시를 대비해 현관문 잠금장치 옆에 여는 방법을 자세히 적어 놓습니다. 3) 어린아이나 노약자는 되도록 집에 혼자 두지 않는 것이 중요합니다."]],[[1,"각종 플라스틱 제품, 헤어스프레이, 세제, 새 가구 등 화학제품으로 만들어진 물건에서 발생해서 우리 몸속에 들어와 건강을 위협하는 이것은 무엇일까요?",["전자파","방사선","오존","환경 호르몬"],4,"‘내분비 장애물질’이라고도 부르는 환경 호르몬은 해로운 화학 물질이 우리 몸으로 들어와 마치 호르몬인 것처럼 작용하면 암, 기형아 출산, 유전자 변형 등 수 많은 질환을 불러일으키는 위험한 물질입니다. 환경 호르몬은 각종 플라스틱 제품, 헤어스프레이, 세제, 샴푸, 새가구와 벽지 등 화학제품으로 만들어진 물건에서 발생해요. 생활에서 늘 사용하는 물건에서 나오기 때문에 우리는 환경 호르몬과 함께 살고 있다고 할 수 있을 정도랍니다."],[1,"아동을 유괴하는 대표적인 4가지 유형이 아닌 것은?",["협박 유괴형","호기심 유발형","지인 사칭형","강제 유괴형"],1,"아동 유괴유형으로는 대표적으로 4가지 유형이 있다. 호기심 유발형, 지인 사칭형, 동정심 유발형, 강제 유괴형이다."],[1,"다음 중 태풍이나 집중호우 발생 시 가장 안전한 곳은?",["축대벽(옹벽) 주변","전신주, 가로등 근처","건물 안","공사장"],3,"태풍이나 집중호우 시 가지 말아야 할 곳으로는 축대벽, 공사장, 하천, 배수로 주위, 전신주, 가로등, 신호등, 고압전선 근처, 돌출된 간판, 길가에 세워진 간판 등이 있습니다"],[1,"학교에서 급식시간에 주의할 내용이 아닌 것은?",["반드시 손을 먼저 씻고 식사를 한다.","내가 좋아하는 반찬만 받아서 먹는다.","젓가락이나 포크로 찌르는 장난을 하지 않는다.","뜨거운 음식을 들고 움직일 대는 흘리거나 튀지 않도록 조심한다."],2,"급식을 먹기전 깨끗이 손을 씻는 습관이 중요하다. 편식하지 않도록 하며 젓가락이나 포크 등의 날카로운 부분을 주의한다."],[1,"물놀이 안전 수칙으로 옳지 않은 것은?",["부모님과 함께 물에 들어간다.","안전요원이 있는 곳에서만 물놀이를 한다.","물놀이 중 비오거나 천둥번개가 치면 물에서 나온다.","보호자가 자리를 비울 때는 형제가 같이 물놀이를 하도록 한다."],4,"물 근처에 자녀를 혼자 두거나 형제끼리 남겨두고 자리를 비우지 않아야 한다."],[1,"수초에 감겼을 때 주의할 사항으로 옳지 않은 것은?",["부드럽게 서서히 팔과 다리를 움직여 풀어야 한다.","물의 흐름이 있으면 흐름에 맡기고 잠시만 기다리면 수초가 헐거워져 이 때 털어 버리듯이 풀고 밖으로 나온다.","힘을 세게 주면 빠질 수 있으므로 발버둥 치며 급하게 빠져나온다.","침착하게 호흡하며, 서서히 부드럽게 수직으로 움직여 조금씩 헤엄쳐 나온다."],3,"급하게 발버둥 칠 경우 오히려 더 휘감겨서 위험에 빠질 수 있다."],[1,"안전한 스포츠 활동을 위한 준비운동의 방법으로 알맞지 않은 것은?",["팔, 다리에서 시작하여 몸통 부위로 실시한다.","한 부위가 아닌 전신을 충분히 움직일 수 있도록 실시한다.","주운동보다 높은 강도로 실시한다.","주운동과 관련된 부위에 맞게 다양하게 실시한다."],3,"준비운동은 주운동보다 낮은 강도로 실시해야 한다."],[0,"6세 미만의 어린이들의 낙상사고가 전체 낙상사고의 67.2%를 차지하고 있으며, 낙상 사고의 약 46.7%가 가정 내에서 발생한다.",null,"O",""],[0,"실험용 보호 장갑은 면장갑 한 종류만 있으면 된다.",null,"X",""],[0,"식품의 맛을 위해서라면 식품 첨가물을 많이 넣어 만들어도 된다.",null,"X",""],[0,"응급상황시 행동요령 중 3C가 있습니다. 3C란 Check, Call, Care를 뜻하는데요, 다음의 내용은 Check, Call, Care 중 어디에 해당할까요?",null,"X","다음 물음에 맞는 것에는 O , 맞지 않는 것에는 X 하시오 1. 사고현장에서 즉시 위하는 조치로 119신고부터 응급의료요원이 사고현장에 도착전까지 도움을 주어 위급한 상황으로부터 생명을 구하는 것을 응급처치라 한다. ( O ) 2. 위급상황시 행동요령의 3단계 중 응급처치원이 응급환자에 대해 적절한 도움을 주기위해서는 가장먼저 119에 신고를 하여야한다. 3. 응급처치의 목적은 의학적 도움 없이 환자를 치료함으로써 환자의 생명을 구하고자하는데 있다. ( O )"],[0,"응급처치원이 동의를 얻는 방법에는 묵시적 동의와 명시적 동의가 있다. 어린아이의 경우에 보호자가 없을 땐 묵시적 동의로 간주하고 응급처치를 실시한다.",null,"O",""],[0,"위급상황시에 응급처치원은 환자의 생명을 살리기 위하여 우선 약을 복용시킨 후 119에 신고한다.",null,"X","( )안에 맞는 말을 써넣으시오 11. 심폐소생술시 자신이 없을 때에는 ( 가슴압박 )만 실시하는 것만으로도 환자의 생존율을 높일 수 있다. 12. 출혈이란, 혈관손상이 일어나 혈액이 혈관 밖으로 나오는 것으로 손상부위에 따라 동맥출혈,( 정맥출혈 ), 모세관출혈로 나누어진다. 13. 출혈이 심한경우에는 먼저 지혈을 해야 한다. 지혈의 방법에는 상처위에 거즈나 헝겊을 대고 직접 누르는 직접압박과 뼈 가까이 지나는 동맥을 압박하여 혈류를 늦춰 지혈하는 ( 혈관압박 ) 방법이 있다. 14. 붕대의 종류에서 특히, ( 롤 붕대 )는 신체의 어느 부위나 드레싱을 고정하는데 가장 효과적이다. 15. 쇼크란, 순간적인 ( 혈액순환 )의 감퇴로 인하여 몸의 전 기능이 부진하고 허탈 된 상태를 말한다."],[1,"골절의 일반적인 증상이 나타나며 손끝으로 만져보면 대부분의 경우 부러진 뼈끝이 만져지고 환자의 부상당한 쪽의 팔을 밑으로 늘어뜨리면 어깨가 다른 편 어깨보다 낮아지는 골절로 맞는 것은?",["쇄골(빗장뼈)골절","아래팔뼈골절","위팔뼈 골절","주관절(팔꿈치)골절"],1,""],[1,"골절의 처치법으로 맞지 않는 것은?",["통증이 있는 부위를 가급적 움직이지 않도록 한다.","목뼈나 척추를 다친 경우 운반하지 말고 119나 응급의료기관에 신고한다.","부러진 뼈는 신속히 맞추어 통증을 줄이게 한다.","만약 출혈이 있다면 출혈부위를 심장보다 높게 한다."],3,""],[1,"심폐소생술의 중단시기가 아닌 것은?",["호흡이 돌아왔을 때","응급의료 요원이 도착하였을 때","교대 자가 있을 때","환자가 사망했다고 판단했을 때"],4,""],[1,"주관절의처치법으로 맞지 않는 것은?",["환자가 팔을 편 자세면 겨드랑이에서 손가락까 지에 이르는 부목을 손바닥 쪽에 대어준다.","구부러진 주관절은 신속히 펴서 통증을 줄여준 다.","응급처치 후 이동할 경우 삼각건을 이용하여 허리 쪽으로 묶어 고정시킨 다음 이동한다.","환자가 팔을 편 자세에서는 겨드랑이에 고임을 대어준다."],2,""],[1,"감염의 예방 방법으로 맞는 것은?",["상처 부위를 깨끗이 하는 것이 중요하다.","크지 않은 상처라도 물로 씻어내서는 안 된다.","약간의 출혈은 지혈에 신경을 쓰지 않아 도 된다.","심하지 않은 감염에는 연고를 빠르게 발라준다"],1,""],[1,"처치 및 도움으로 맞지 않는 것은?",["환자가 의식이 있다면 응급처치를 하기 전에 자신을 소개하고 허락을 받는다.","당신이 누구인지, 얼마나 많은 훈련을 받았는지, 어떻게 도울 것인지를 환자에게 설명해야 한다.","먼저 환자에게 무슨일이 일어났는지, 어느 곳 에 통증이 있는지, 알레르기 치료를 받고 있는지 물어 본다.","만약에 의식이 있거나 반응 할 수 없는 환자를 만났다면 허락은 묵시적 동의를 받을 수밖에 없다."],4,""],[1,"응급 처치시 지켜야 할 사항이 아닌 것은?",["처치자 자신의 안전을 확보한다.","자신의 신분을 밝힌다.","환자의 생사판단을 하지 않는다.","급한 경우 환자에게 진통제를 주어 고통 을 덜어준 후에 병원으로 이송한다."],4,""],[1,"염좌의 처치법으로 맞지 않는 것은?",["염좌된 손목은 팔걸이를 하여 고정시키고 발목이면 환자를 편안히 앉혀 다리를 내린다.","전문처치를 받기 전까지 짧은 거리나마 혼자서 걸여야 할 경우에는 신발을 신은 채로 붕대를 감는다.","상처가 심하면 전문응급의료요원이 도착할 때까지 움직이지 않도록 한다.","상처부위에 찬물찜질을 한다."],1,""],[1,"어린이 경련의 응급처치로 바르지 않은 것은?",["경련과 동시에 열이 있는지 의식이 있는 지 관찰한다.","침착한 마음으로 얼굴을 옆으로 돌려놓고 혀를 깨물지 않도록 주의한다.","안정을 취하고 의복을 풀어 호흡을 편하 게 한다.","고열로 오는 열성경련일 경우는 시간이 지나면 열이 떨어지면서 경련이 그치게 되므로 경과를 지켜봐야 한다."],4,""],[1,"기도폐쇄의 처치법으로 바르지 않은 것은?",["복부 밀어내기는 한 번씩 확실하게 시도 한다.","복부밀어내기 중 의식 잃고 쓰러지면 환자를 바르게 눕혀 복부 밀쳐 올리기를 계속한다.","인공호흡 시행중 공기가 들어가지 않으면 재 기도개방 한 후 인공호흡을 한다.","인공호흡 후 30회의 가슴압박을 실시한 후 이물질을 확인하고 있으면 제거 한다"],2,""],[1,"출혈이 심하지 않은 경우의 응급처치로 바르 지 않은 것은?",["병균의 침입을 막아 감염을 예방한다.","상처를 손이나 깨끗하지 않은 헝겊으로 함 부로 건드리지 않는다.","엉키어 뭉친 핏덩어리를 떼어내고 소독된 거즈로 드레싱을 한다.","흙이나 더러운 것이 묻었을 때는 깨끗한 물로 상처를 씻어 준다."],3,""],[1,"전기 접촉에 의한 화상 처치법으로 바르지 않은 것은?",["전기화상의 경우 심폐소생술, 제세동기, 쇼크, 화상처치등이 필요할 수 도 있다.","마른 무균드레싱으로 화상부위를 보호한다.","머리. 목. 척추 부상이 있을 수도 있으므로 빠르게 병원으로 옮겨야 한다.","젖은 손으로 플러그를 절대로 만지지 않는 다."],3,""],[1,"숲이나 풀이 많은 곳에서 벌레에 쏘이지 않기 위한 예방법이 아닌 것은?",["긴 소매 상의나 긴 바지를 입는다.","양말이나 신발 속으로 바지 끝을 말아 밀어 넣는다.","두건이나, 모자등을 착용하고 자주 머리 부위를 확인 한다.","화려한 색의 옷을 입어 벌레의 눈에 쉽게 뛰게 한다."],4,""],[1,"독극물을 마신 환자를 조사하는 방법으로 맞지 않는 것은?",["어떤 형태의 독극물인지 확인한다","얼마나 많은 양을 마셨는지 확인한다.","언제 마셨는지 확인한다.","무조건 토하게 한다."],4,""],[1,"현장을 조사하는 방법으로 적당하지 않은 것은?",["현장은 안전한가 조사한다.","무슨 일이 일어났는가 조사한다.","몇 명이나 다쳤는가 조사한다.","생사판정를 하여 산 사람만 운반한다."],4,""],[1,"충격의 증상으로 맞지 않는 것은?",["얼굴이 창백해진다.","식은땀이 나며 현기증을 일으킨다.","맥박은 강하고 때로는 느리다","심하면 의식이 없어진다."],3,""],[1,"응급처치원이 지켜야 할 사항이 아닌 것은?",["처치원 자신의 안전을 확보한다","환자나 부상자에 대한 생사의 판정을 하지 않는다","필요한 의약품만 사용해야 된다","어디까지나 응급처치로만 그치고, 다음은 전문의료요원에게 맡긴다"],3,""],[1,"위급한 상황에서의 행동요령이 순서대로 나열된 것 은?",["현장조사-119신고-처치및도움","현장조사-처치및도움-119신고","119신고-현장조사-처치및도움","처치및도움-119신고-현장조사."],1,""],[1,"의식있는 환자에 대한 처치 및 도움으로 옳은 것은?",["위급상황를 본 사람과 대화를 한다.","팔 다리에 상처가 보이지 않으면 움직이거나 만져서 확인한다.","성인 환자를 발견 시 발가락에서 머리까지 확인 한다.","처치원은 자신의 행동에 대해서 묵시적 동의를 받아야 한다."],1,""],[1,"제세동기 처치로 잘못 설명한 것은?",["제세동기가 도착하면 지체없이 전원 버튼을 누른다.","패드를 붙일 때 하나는 오른쪽 쇄골뼈 아래, 다른 하나는 왼쪽 젖꼭지 옆 겨드랑이 중앙선에 부착한다.","심장리듬 분석시에도 심폐소생술을 멈춰서는 않된다.","제세동시행 후 반응이 없으면 지체없이 심폐소생술 시행한다."],3,""],[1,"심폐소생술 처치방법중 잘못된 것은?",["심폐소생술 순서는 가슴압박 -기도열기 -인공호흡 순서이다.","가슴압박(30):(2)인공호흡을 실시하며 단, 영아의 인공호흡은 1회 2초간 가슴이 충분히 올라올 정도로 불어 넣는다.","호흡이 정상적으로 돌아오면 회복자세를 취해 준다.","침대위에서 의식 잃은 환자는 단단한 바닥에 옮긴 후 심폐소생술을 실시한다."],2,""],[1,"다음 중 자동제세동기 사용방법으로 옳지 못한 것은?",["전극을 부착하는 부위에 물이나 땀을 제거한다.","다른 구조자와 함께 있다면 가능한 기본소생술을 중단하지 않는다.","패드 부착부위에 털을 제거한 후에 패드를 단단히 부착한다.","사용한 전극은 재사용하기위해 조심스럽게 떼어낸다."],4,""]],[[1,"뱀에 물렸을 때 응급처치법이 아닌 것은?",["상처부위를 비눗물로 씻는다.","물린 부위를 심장보다 낮게 한다.","상처부위를 절대 절개하지 않는다.","지혈끈을 사용해 단단히 묶는다."],4,""],[1,"심부 동상의 처치법이 잘못된 것은?",["동상부위를 손으로 문지른다.","동상부위는 마른 드레싱으로 감는다.","따뜻한 물에 담근다.","전문의의 치료를 받도록 한다."],1,""],[1,"골절처치방법으로 올바른 것은?",["개방성골절시 얼음찜질은 하지않는다.","골절부위는 심장보다 낮게 한다..","골절환자의자세는 무조건 바르게 눕힌다","탈구시 처치 할 수 있다면 맞추어 준다."],1,""],[1,"호흡은 뇌의 호흡중추의 지령에 의해 작용하는데 혈액속의 무엇에 의해 영향을 받을까?",["산소.","이산화탄소","질소","백혈구"],2,""],[1,"학교에서 방과후에 집을가는데 길에 쓰러져 있는 사람을 발견하였다. 가장 올바른 행동은?",["그냥 지나간다.","다른 지나가는 사람에게 알려준다.","119에 신고한다.","엄마에게 물어본다."],3,""],[1,"야외 활동 중 벌이 날아다니고 근처에 벌집이 있는 것을 발견하였다. 위험을 인식하고 행동을 하였다 올바른 행동은?",["살충제를 뿌려 벌을 제거한다.","벌집에 불을 지른다.","조심스럽게 현장을 벋어나고 119에 신고한다.","무시하고 뛰어논다."],3,""],[1,"벌에 쏘여 벌침이 피부에 남아있어 카드로 밀어 벌침을 제거하였다. 그런데 통증이 밀려왔다. 통증을 완화시킬 응급처치방법으로 올바른 것은?",["냉찜질 한다.","온찜질 한다.","엄마에게 물어본다.","시간이 지나면 통증이 사라지기 때문에 참는다."],1,""],[0,"코피가 난 상항에서의 응급처치방법이다. 코를 잡고 앞으로 고개를 숙여 앉아 있도록 하였다. 올바른 응급처치방법인가?",null,"O",""],[1,"여름철 해수욕장에서 자주 발생하는 1도 화상의 예방이다 예방적 응급처치방법으로 잘못된 것은?",["햇빛이 뜨거울 때의 해수욕은 피한다.","햇빛 차단제(썬크림)을 바른다.","햇빛 차단되는 긴팔 옷을 입는다..","물에서 놀면 시원하여 화상을 입지 않는다."],4,""],[1,"자전거를 탈 때의 안전수칙으로 잘못된 것은?",["횡단보도를 건널 때는 자전거에서 내려 자전거를 밀고 건넌다.","자전거를 탈 때는 헬멧을 착용해야 한다.","교통량이 많은 도로나 갓길 없는 길은 조심해서 타면 된다.","밤에 자전거를 탈 때는 야광의복 및 자전거에 반사경을 부착해서 탄다."],3,""],[1,"길에 쓰러져 있는 사람을 발견을 때, 가장 올바른 행동은?",["그냥 지나간다.","지나가는 사람에게 알려주고 간다.","119에 신고한다.","엄마에게 물어본다."],3,"자전거는 가능하면 밤에는 이용하지 않아야 하며 낮에도 횡단보도를 건널 때는 자전거에서 내려서 끌고 가야 한다."],[1,"중앙선이 없고 인도와 차도의 구별이 없는 도로에서 차를 마주 보고 걸으려면 도로의 어느 쪽으로 걸어야 안전하겠는가?",["도로의 오른쪽","도로의 왼쪽","도로의 중앙부분","아무 데서나 관계없다."],2,"보도나 복도 등에서 걸을 때는 보도나 복도 계단 등의 오른쪽으로 통행하지만 보도와 차보가 구분되지 않는 이면도로에서 차를 마주보고 걸으려면 도로의 왼쪽 길 가장자리를 걷는 것이 바람직하다."],[1,"어린이가 등·하굣길에서 안전한 도로 횡단방법이 아닌 것은?",["우선 멈춘 후 횡단보도를 이용, 안전하게 건넌다.","차가 멈추었는지 반드시 확인한다.","운전자와 눈을 맞추고 차를 계속 보면서 건넌다.","횡단보도에서 빠르게 뛰어 건넌다."],4,"길을 건널 때에는 신호등이 있는 횡단보도나 없는 횡단보도 모두 안전을 살피며 걸어가는 것이 안전하다."],[1,"고속도로 상에서의 안전띠 착용에 대한 설명 중 가장 올바른 것은?",["운전자만 매면 된다.","운전자와 조수석에 탄 사람만 매면 된다.","승차중인 모든 사람이 다 매야한다.","어른들만 매면 된다."],3,"고속도로나 일반도로 모두 모든 승차자가 항상 안전띠를 매도록 하여야 한다."],[1,"통학버스나 학원 차량을 이용할 경우 안전한 행동은?",["내려야 할 곳이 다 와 가면 미리 일어나서 내릴 준비를 한다.","먼 거리를 가지 않고 내려야 하므로 안전띠는 매지 않는다.","내릴 때에 우측에서 자전거나 오토바이가 오는지 확인하고 내린다.","내가 타고 온 차 앞으로 신속히 길을 건넌다."],3,"내가 타고 온 차 앞으로 지나갈 경우 그 차량과 충돌할 수 있다."],[1,"자전거를 안전하게 타기 위한 습관 중 틀린 것은?",["눈에 잘 띄는 밝은 색 옷을 입으며 밤에는 타지 않는다.","헬멧과 무릎보호대 등 보호장구를 착용한다.","횡단보도에서는 내려서 자전거를 끌고 건넌다.","야간에는 차가 다니는 큰길에서 주의하며 자전거를 탄다."],4,"차가 많이 다니는 대로에서는 자전거를 타지 말아야 한다."],[1,"인도와 차도의 구별이 없는 동네 길에서 학원 버스를 타고 내렸을 때 어떻게 길을 건너는 것이 가장 안전하겠는가?",["버스 앞으로 바로 건넌다.","버스 뒤로 바로 건넌다.","버스가 출발하면 그 뒤로 건넌다.","주위에 버스나 다른 차가 없을 때 건넌다."],4,"학원버스에서 내렸을 때 버스가 출발하고 다른 차가 없는 것을 확인한 후 에 안전할 때 건너야 한다."],[1,"운전자가 교통사고를 일으키는 원인으로 볼 수 없는 것은?",["교통법규 무시","안전의식 부족","조급한 마음","양보하는 마음"],4,"교통사고를 일으키는 운전자의 마음에는 법규무시, 이기심, 조급증, 자기중심적인 생각 등이 있다."],[1,"비가 올 때 사고발생 위험이 커지는 이유로 틀린 것은?",["자동차 창유리에 빗방울과 김이 서린다.","자동차의 정지거리가 마른날보다 짧아진다.","어린이가 우산을 쓰고 주위를 잘 살피지 못한다.","비가 오면 운전자가 보행자를 발견하기가 평소보다 어렵다."],2,"비가 내려 노면이 젖어 있으면 정지거리가 길어지므로 위험이 가중된다."],[1,"학원버스를 타고 내릴 때 꼭 지킬 사항이 아닌 것은?",["옷은 치마, 길게 늘어진 옷, 끈 달린 옷은 내리다 옷이 차문 에 끼여 끌려갈 수 있으므로 단정한 바지 차림의 옷을 입는다.","차에서 내릴 때 손잡이를 잡고 오토바이나 자전거가 오는지 뒤를 보면서 천천히 내린다.","버스가 완전히 멈출 때까지 차도에 내려서지 않는다.","버스 안에서 떠들지 않고 조용히 스마트폰으로 게임을 한다."],4,"창문으로 머리나 손을 내밀지 말아야 하고, 차내에서는 장난은 금물이며, 내릴 때 자전거나 오토바이가 올 수 있으므로 잘 살피고 내려야 한다. 버스 내에서는 안전띠를 매고 스마트폰은 하지 않아야 한다."],[1,"열차 또는 지하철 승·하차 시 주의할 점이 아닌 것은?",["지하철을 기다릴 때 반드시 노란색 안전선 뒤에서 기다려야 한다.","전철에 탄 사람이 먼저 내린 다음 천천히 걸어서 탄다.","노약자석에 아무도 없으면 앉아도 관계없다.","전철의 경우 타고 내릴 때 전철과 승차대와 간격이 벌어져 있으므로 발이 빠지지 않도록 주의하면서 탄다."],3,"노약자선에는 노인이나 임사부 등만이 앉을 수 있음을 기억해야 한다."],[1,"어두운 밤에 길을 갈 때 올바르지 못한 것은?",["밝은 색의 옷을 입는다.","반사재가 달린 가방이나 손목 반사재 등을 차고 다닌다.","좁은 길에서 차와 마주치면 일단 멈추고 길의 가장자리에 서서 차가 지나가기를 기다린다.","빨리 다니기 위해 자전거나 인라인스케이트를 자주 이용한다."],4,"저녁 이후 시간에는 자전거 나 인라인의 발견 어렵기 때문에 타지 않도록 한다."],[1,"통학버스에서 안전하게 내리는 방법이 아닌 것은?",["버스에서 내릴 때는 옷이나 가방 끈이 걸리지 않도록 한다.","버스에서 내리다 물건을 떨어트리면 소리쳐 알린다.","버스에 내려서 버스 근처에서 친구들과 이야기한다.","버스에 내릴 때는 뒤쪽의 오토바이나 자전거가 오지 않는지 확인하고 내린다."],3,"버스에서 내린 후에는 버스 근처에 있게 되면 버스운전자가 발견하기 어렵기 때문에 위험하다."],[1,"인라인 스케이트를 탈 때 안전수칙으로 틀린 것은?",["안전하게 정지하는 방법과 넘어지는 방법 등 기초교육을 받는다.","이어폰을 귀에 꽂고 신나는 노래를 들으면서 달린다.","해가진 후에는 될 수 있으면 않는다.","헬멧과 손목보호대, 무릎보호대 등 안전 장구를 착용한다."],2,"자전거나 인라인, 그리고 보행중일 경우에도 이어폰을 꽂고 노래를 듣는 것은 위험한 행동임을 인식해야 한다."],[1,"다음 중 어떤 옷을 입는 것이 야간에 가장 잘 보이겠는가?",["파란색 계열의 옷","밝은 색 계열의 옷","검은색 계열의 옷","형광 및 반사체 옷"],4,"파란색이나 검은 색 계열의 옷은 약 30미터, 흰색 등 밝은 색 계열의 옷은 50미터, 형광 및 반사체의 경우는 120미터 정도에서 발견이 된다."],[1,"횡단보도가 없는 길을 가장 안전하게 횡단하는 방법은?",["주차된 차 바로 앞이나 뒤에서 뛰어 건넌다.","횡단보도가 없으므로 길을 건너면 안 된다.","좌우로 살펴보고 안전을 확인한 후에 도로 폭이 가장 짧은 길로 건넌다.","주・정차된 차 사이에서 신속히 건넌다."],3,"주차된 차 앞과 뒤에서 뛰어 건널 경우 주차된 자가 움직일 수가 있으며 도로에서 통행하는 차량이 갑자기 뛰어 나온 어린이를 발견하지 못할 수 있으므로 매우 위험함. 횡단보도가 없는 길에서는 좌우를 잘 살피고 차량이 없으면 도로 폭이 가장 짧은 길로 건너야 한다."],[1,"다음 설명 중 맞는 것은?",["차에서 운전하는 아저씨는 차 밖에 있는 사람을 다 잘 볼 수 있다.","속도를 내고 달리는 차는 바로 정지하지 못한다.","자동차가 후진할 경우에는 어떤 신호도 들어오지 않는다.","횡단보도 앞에서는 모든 차가 잠깐 정지했다가 간다."],2,"◦ 운전자는 사각지대가 있어서 차 밖에 있는 사람을 완전하게 잘 볼 수는 없다. ◦ 속도를 내며 달리는 자동차는 곧바로 정지할 수 없고 브레 이크를 밟은 후 어느 정도 진행한 다음 정지할 수 있다. ◦ 자동차가 후진할 경우에는 자동차 후진등에 불이 켜진다. ◦ 횡단보도 앞이라도 자동차 신호에 초록불일 경우 차량이 정지 하지 않고 달릴 수 있다."],[1,"화상을 당한 경우 올바른 응급조치 방법 중 틀린 것은?",["화상 부위를 찬물에 담근 후, 얼음이 있으면 얼음을 넣는다.","큰 화상인 경우 빨리 옷을 벗긴 후 상처를 살핀다.","화상 부위를 깨끗한 천으로 가볍게 덮는다.","된장이나, 연고 등 기타 전래 요법을 사용하지 않는다."],2,"큰 화상인 경우에는 옷을 벗기면 상처가 더 커질 수 있으므로 빨리 병원으로 옮겨 치료를 받게 해야 한다."],[1,"도로교통법에서 규정한 어린이 보호구역에서 제한할 수 있는 속도는?",["시속 10킬로미터 이내","시속 20킬로미터 이내","시속 30킬로미터 이내","시속 40킬로미터 이내"],3,"시속이란 뜻은 한 시간 동안 이동하는 속도를 말한다."],[1,"물놀이를 시작하기 전에 손과 발의 경련을 방지하기 위해 가장 먼저 해야 할 일은 무엇인가?",["준비 운동하기","밥 먹기","낮잠 자기","명상하기"],1,"준비운동을 한 다음 다리부터 서서히 들어가 몸을 순환시키고 수온에 적응시켜 수영하기 시작한다."],[1,"다음 중 에스컬레이터를 이용하는 방법으로 옳지 않은 것은?",["에스컬레이터를 탈 때 손잡이를 잡고 탄다.","에스컬레이터를 탈 때 노란선 안에 서고 핸드레일 밖으로 손이나 몸을 내민다.","에스컬레이터에서 걷거나 뛰지 않고 얌전히 탄다.","에스컬레이터에서 친구를 밀거나 잡아당기는 행동을 하지 않는다."],2,"핸드레일 밖으로 머리나 팔을 내밀지 말아야 한다."],[1,"화재 발생 원인이 되는 행동은?",["음식 조리 중에는 그 자리에서 벗어나지 않는다.","가스레인지 주변에 불에 잘 타는 물질 두지 않는다.","한꺼번에 많은 콘센트를 연결해두지 않는다.","콘센트에 먼지가 쌓이도록 방치한다."],4,"콘센트에 먼지가 쌓이면 화재로 이어질 수 있다."],[1,"다음 중 화재 발생 시 행동 요령으로 올바른 것은?",["엘리베이터를 타고 내려오는 행동","가구 밑에 숨는 행동","출입문의 금속 손잡이를 만지는 행동","작은 불일 경우 소화기나 소화전을 이용하여 불을 끄는 행동"],4,"화재발생시 대피할 때 엘리베이터를 이용하지 말고 계단 을 이용해야 한다. 가구는 불에 탈 수 있으므로 가구 밑으로 들 어가지 않는다. 쇠 손잡이가 뜨거울 수 있으므로 직접 만져서는 안 된다."],[1,"아파트 발코니 추락 사고의 주요 원인이 아닌 것은 무엇일까요?",["방충망","방범창","유리창 청소용 의자","발코니에 있는 화분"],2,"방충망은 흔들리거나 떨어지지 않는지 자주 점검하고, 낡았을 경우 틀에서 떨어지기 쉬우므로 적어도 2년에 한 번 정도는 바꿔 주어야 합니다. 아이들은 물론 어른들도 방충망에 기대지 말아야 하며, 특히 유리창 청소를 할 때는 의저 또는 화분을 딛고 올라가지 말고 긴 청소 도구를 이용해서 청소를 합니다."],[1,"놀이터 또는 놀이공원에서 놀이기구가 타다 사고가 났을 때 대처하는 방법으로 옳지 않은 것은 무엇일까요?",["놀이기구가 고장 또는 갑자기 멈추면 뛰어내리거나 주변사물을 이용해 서 탈출한다.","넘어지거나 떨어져 다친 경우 함부로 움직이지 않는다.","즉시 주변의 어른에게 도움을 요청한다.","당황하지 말고 침착하게 도움을 기다린다."],1,"이용해서 탈출한다. 놀이기구가 멈추었을 때는 함부로 움직이지 말고, 선생님이나 안전요원에게 알린 후 통제에 따라야 합니다."]],[[1,"다음 중 태풍이나 집중호우 발생 시 피해야 할 곳으로 옳은 곳은 무엇일까요?",["축대(옹벽) 주변 또는 공사장","전신주, 가로등 근처","건물 안 또는 대피소","배수로"],3,"태풍이나 집중호우 시 피하면 안될 곳으로는 축대, 공사장, 하천, 배수로 주위, 전신주, 가로등, 신호등, 고압전선 근처, 돌출된 간판, 길가에 세워진 간판 등이 있습니다."],[1,"신호등이 없는 건널목을 건너는 방법 중 틀린 방법은?",["좌우를 살펴 차량의 유.무를 확인하고 건너간다.","손을 든 다음 빨리 뛰어 간다.","운전자를 향해 손을 든 다음 차량 멈춤을 확인하고 천천히 건넌다.","차가 안 올 때까지 기다린 다음 확인하면서 건너간다."],2,"횡단보도를 건널 때는 먼저 보도 경계석 안쪽에 멈추어 서서 신호등을 확인합니다. 신호등의 초록불이 켜지더라도 차량이 신호를 무시하고 지나갈 수 있으므로 바로 건너지 말고 차도의 왼쪽, 오른쪽, 다시 왼쪽을 살핍니다. 차의 움직임이 완전히 멈춘 것을 확인한 후 차의 흐름을 살피면서 걸어서 건너야 합니다."],[1,"가정에서 가스 누출 시 응급대처 방법 중 틀린 것은?",["전기기구는 조속히 끈다.","당황하지 말고 콕크와 용기 밸브를 잠근다.","창문, 출입문을 열고 환기를 시킨다.","빗자루, 부채, 방석 등을 사용해 밖으로 쓸어낸다."],1,"가스냄새로 가스가 새는 것을 발견하면 먼저 연소기의 점화콕과 중간밸브, 용기밸브를 잠궈서 가스공급을 차단하고, 창문과 출입문을 등을 활짝 열어 누출된 가스를 밖으로 몰아내고 신선한 공기로 환기 시킵니다. LPG의 경우에는 공기보다 무겁기 때문에 방바닥으로 가라앉으므로 침착히 빗자루 등으로 쓸어내듯 환기를 시켜야 합니다. 하지만 급하다고 환풍기나 선풍기 등을 사용하면 스위치 조작시 발생하는 스파크에 의해서 점화되어 폭발할 가능성이 있으므로 전기기구는 절대 사용해서는 안됩니다."],[1,"평상시 전기와 관련된 점검사항 중 틀린 것은 무엇일까요?",["1개의 콘센트에는 가능하면 1개의 전기기구를 사용합시다.","젖은 손으로 전기기구를 만지지 않습니다.","전선의 피복이 벗겨진 것은 절대 사용하지 않습니다.","집을 비울 때는 전기기구의 코드를 콘센트에서 뽑아놓지 않아도 됩니다."],4,"장기간 집을 비울때에는 전기기구의 콘센트는 뽑아 놓는 것이 좋습니다."],[1,"감전 사고가 났을 때 가장 위험한 장소는 어디일까요?",["욕실 등 물기가 많은 장소","고압 전류가 흐르는 송전로 아래","전기 설비를 많이 하는 공사장","높은 전류로 가동되는 놀이시설"],1,"감전을 당하면 몸에 충격이 보행 불가능, 심한 통증 등을 유발하는 이타이이타이(itaiitai) 병으로 사망한 사건이 있었습니다. 이 원인이 된 중금속은?",["칼슘(Ca)","나트륨(Na)","마그네슘(Mg)","카드뮴(Cd)"],4,"이타이이타이병은 문맥적으로 “아프다 아프다”라는 의미의 일본어에서 유래된 것으로, 일본 도야마현의 진즈강 하류에서 발생한 대량 카드뮴 중독으로 인한 공해병을 말한다. 원인은 미쓰이 금속주식회사 광업소에서 버린 폐광석에 포함된 카드뮴이 체내에 농축된 것이었다."],[1,"1950년대 일본 구마모토현의 미나마타시에서 인근의 화학공장에서 바다에 방류한 폐수로 인해 OOO 중금속에 오염된 어패류를 먹은 주민들이 신경이 손상되어 사지마비나 언어장애가 일어나고 눈과 귀의 기능이 상실되는 미나마타병이 발생하였습니다. 이 원인이 된 중금속은?",["철(Fe)","수은(Hg)","칼륨(K)","마그네슘(Mg)"],2,"수은을 포함하는 폐기물에 의해 물이 오염된다. 물 속의 수은폐기물은 진흙 속에 있는 세균에 의해 유기수은으로 바뀌어, 사람이 음식으로 먹는 물고기나 다른 수중생물에 농축된다."],[1,"황사방지용 마스크나 방역용 마스크 사용시 올바른 방법은?",["마스크는 매번 세탁하여 사용한다.","마스크 착용 후 마스크의 겉면은 만져도 된다.","마스크 안쪽이 오염되었을 때는 사용하지 않는다.","수건·휴지 등을 사용하여 호흡기를 감싼 다음 그 위에 착용한다."],3,"- 황사방지용 마스크·방역용 마스크 사용시 주의점 1. 세탁하여 사용하지 마세요. 2. 착용 후 마스크의 겉면을 만지지 마세요. 3. 수건·휴지 등을 사용하여 호흡기를 감싼 다음 그 위에 착용하지 마세요. 4. 마스크 안쪽이 오염되었을 때는 사용하지 마세요. 5. 찌그러트리거나 변형하지 마세요."],[1,"1초에 하나의 방사선이 나오는 세기를 나타내는 국제 표준 단위는?",["라디안(rad)","베크렐(Bq)","킬로그램(Kg)","헤르츠(Hz)"],2,"- 1 베크렐(Bq)은 1초당 1개의 방사선이 방출됨을 의미한다. 1. 평면각 단위 2. 방사능 단위 3. 질량 단위"],[1,"커피, 차 잎 등에 들어 있으며 많이 섭취할 경우 불면증, 중독 등 부작용을 나타날 수 있는 것은?",["인슐린","카페인","타우린","구연산"],2,"- 카페인은 커피나 차 같은 일부 식물의 열매, 잎, 씨앗 등에 함유된 알칼로이드의 일종으로 피로를 줄이는 등의 효과가 있으며 장기간 다량 복용할 경우 카페인 중독을 야기할 수 있다."],[1,"우리가 활동하는데 필요한 에너지를 만들며, 뇌가 활발하게 활동하는데 도움을 주는 영양소는?",["비타민","지방","단백질","탄수화물"],4,"- 탄수화물은 감자, 고구마, 떡 등에 많이 함유되어 있는 영양소이며, 우리가 활동하는데 필요한 에너지를 만든다. 뇌는 포도당(탄수화물)을 에너지로 사용함"],[1,"다음 중 지용성 비타민이 아닌 것은?",["비타민 A","비타민 C","비타민 D","비타민 E"],2,"비타민 C는 수용성 비타민이다."],[1,"채소류와 과일류에 많이 있는 영양소이며 장 운동을 도와 변비 예방에 좋은 영양소는?",["식이섬유","탄수화물","단백질"],1,""],[1,"다음 중 자외선 차단제 사용법이 올바르지 않은 것은?",["외출 30분전에 충분한 양을 골고루 발라준다.","하루에 한번만 바른다.","눈 주변은 피해서 바르고, 눈은 비벼서는 아니 된다.","집에 돌아오면 깨끗이 씻어서 닦아내야 한다."],2,"활동 중 땀 등으로 씻겨나갈 수 있으므로 차단제 효과는 시간이 갈수록 감소될 수 있음. 따라서 여러 번 덧발라주는 것을 권장"],[1,"전자레인지에 사용할 수 있는 용기 재질이 아닌 것은?",["폴리프로필렌","유리제","도자기제","알루미늄제"],4,"알루미늄은 철의 약 1/3정도로 가벼운 금속이며 공기나 물에서 잘 녹슬지 않으나, 열 및 전기를 전달하는 성질이 좋아 전자레인지에 사용할 경우 스파크가 발생하여 화재 및 폭발의 위험이 있음"],[1,"담배와 관련된 유해물질이 아닌 것은?",["타르","일산화탄소","산소","니코틴"],3,""],[1,"다음 중 천연색소가 아닌 것은?",["치자황색소","코치닐색소","식용색소 황색4호","홍국색소"],3,""],[0,"마스크는 재사용이 가능하다.",null,"X","현재까지 식약처에서 허가받은 황사방지용 마스크나 방역용 마스크는 모두 일회용입니다. 한번 사용하면 이미 눈에 보이지 않으나 먼지나 세균에 오염 될 수 있으므로 재사용하면 안 됩니다."],[0,"방역용 마스크는 세균이나 바이러스를 죽인다.",null,"X","세균이나 바이러스를 죽이는 것이 아니라 방역용 마스크에 사용되는 특수한 필터를 통해 외부의 작은 입자를 걸러 노출되는 정도를 줄여 주는 것입니다."],[1,"다음 중 슈퍼 또는 편의점에서 구입할 수 있는 의약품(의약외품)이 아닌 것은?",["황사마스크","항생제","액상소화제","파스"],2,"항생제는 의사의 처방이 있어야 구입할 수 있는 전문의약품이다."],[1,"다음 중 파스 사용 시 주의사항으로 올바르지 않은 것은?",["파스를 사용하는 부위를 확인한다.","파스의 형태(액상, 에어로솔제, 피부에 붙이는 형태 등)에 따라 주의하여 사용한다.","사용하기 전에 파스에 함유된 성분을 확인한다.","증상(근육통, 가려움 등)이 개선될 때까지 계속해서 사용한다."],4,"파스는 일반적으로 원인을 치료하는 것이 아니라 증상을 치료하는 약이므로 5~6일 정도 사용해도 증상이 개선되지 않으면 사용을 중단하고 의사 또는 약사와 상의하도록 한다."],[1,"다음 중 같은 양이 아닌 것은?",["0.1mg/L","1000ppb","1ppm","0.0001%"],1,"1ppm = 1mg/L = 1000ppb = 0.0001%"],[1,"다음 중 방사선에 대한 설명이 아닌 것은?",["방사선은 방사성물질이 내는 에너지 흐름이다.","방사선은 눈에 보이지 않으며, 냄새나 맛이 없다.","방사선은 알파, 베타, 중성자, 엑스, 감마선으로 나뉜다.","방사선 종류별로 형태나 힘의 차이는 같다."],4,"방사선의 종류별로 형태나 힘의 차이는 각각 다르다."],[1,"다음 중 자연방사선이 아닌 것은?",["우주방사선","지각방사선","음식물 내 방사선","의료용 엑스선"],4,"의료용 엑스선은 인공적으로 만들어진 방사선이다."],[1,"방사성물질이 방사선을 내는 강도인 방사능의 단위가 아닌 것은?",["파스칼(Pa)","베크렐(Bq)","시버트(Sv)","그레이(Gy)"],1,"파스칼은 압력, 변형력의 국제단위이다."],[1,"다음 중 자연방사능인 라돈에 대한 설명으로 적합하지 않은 것은?",["땅 속의 천연방사능이 공기 중으로 확산된 형태이다.","라돈 자체를 흡입할 경우 폐의 피폭을 유발하여 폐암을 증가시킨다.","라돈의 자손핵종으로는 폴로늄-218, 납-214, 비스무스-214, 폴로늄-214 등이 있다.","실내공기를 주기적으로 환기시켜 라돈의 농도를 낮출 수 있다."],2,"라돈 자체는 헬륨처럼 불활성기체이므로 사람이 흡입하더라도 체내에 흡수되지 않고 다시 배기되므로 위해도가 미미하다. 라돈이 공기 중에서 붕괴하여 발생되는 자손핵종의 경우 폐암을 증가시키는 요인으로 알려져 있다."],[1,"다음 중 유통기한과 품질유지기한에 대한 설명으로 틀린 것은?",["유통기한 표시는 설탕, 빙과류, 식용얼음, 껌류에는 없다.","유통기한이 경과하더라도 품질유지기한만 넘지 않는다면 판매가 가능하다.","유통기한과 품질유지기한 표시는 식품에 따라 다르다.","레토르트 식품, 통조림 식품, 쨈류에는 품질유지기한이 표시되어 있다."],2,"유통기한은 소비자에게 판매 가능한 기간을 뜻하며, 유통기한이 경과한 제품을 진열, 보관, 판매했다면 과태로 또는 행정처분이 부과된다."],[1,"황사 예보 시 분야별 대비요령으로 올바르지 않은 것은?",["외출 시에는 의약외품 마스크를 착용한다.","황사에 노출된 채소, 과일 등은 충분히 세척한 후 섭취한다.","황사가 발생하더라도 창문을 열어 환기시킨다.","호흡기질환이나 노약자는 되도록 실외활동을 자제한다."],3,"황사가 그친 뒤에 실내 공기를 한 후 선별진료소가 있는 의료기관을 방문한다.","보건소 또는 콜센터(‘1335 또는‘지역번호+120’)로 먼저 상담한다.","방문 시 의료진에게 해외여행력을 알려준다."],3,"보건소 또는 콜센터(‘1339 또는‘지역번호+120’)"],[1,"코로나19가 시작된 나라는 어디일까요?",["일본","미국","중국","영국"],3,"2019년 12월 중국 우한시에서 발생한 바이러스성 호흡기 질환이다."],[1,"코로나19를 예방·극복하기 위한 생활습관이 아닌 것은?",["외출 시 반드시 마스크 착용한다.","기침할 때 옷소매로 코 와 입을 가리고 한다.","흐르는 물에 비누로 30초 이상 손 씻는다.","운동할 땐 마스크를 벗고 한다."],4,"운동할 때도 마스크착용은 반드시 한다."],[1,"코로나19 예방을 위한 “3밀”에 해당되지 않는 것은 무엇일까요?",["밀집","밀폐","밀접","밀고"],4,"코로나 19예방을 위해서는 모이고(밀집), 막히고(밀폐), 접촉(밀접)하는 것을 멀리 해야 합니다. 밀고는 고자질이라는 말과 비슷한 의미입니다."],[1,"코로나19로 인해 사회적 거리두기 3단계 지침을 준수하는 바른 행동은 무엇일까요?",["PC방 가기","온라인 강의 듣기","예식장 뷔페 가기","노래방 가기"],2,"사회적거리두기 3단계 집합금지 지역은 노래연습장, 실내 집단 운동, 방문판매 등 판매 홍보관, 대형학원, 뷔페, PC방"],[1,"코로나19의 환자의 중증도 4가지가 아닌 것은 무엇일까요?",["최중증","중증","중등도","휴식"],4,"확진자 중증도를 4가지(경증·중등도·중증·최중증)로 분류합니다"],[1,"확진환자 치료 및 지원에 따른 방법중 틀린 것은 무엇일까요?",["한국 정부는 환자를 중증도에 따라 분류하고 중증환자는 입원 치료를 우선 제공한다.","생활치료센터 시설에서는 의료진이 1일 1회 모니터링을 실시하고 증상 악화 시에는 의료기관으로 신속 이송한다.","정부는 국민들이 감염 예방에 적극 협조하고 생계에 지장을 받지 않도록, 확진환자 입원ㆍ치료비, 의심환자 등의 진단검사비는 전액 건강보험 또는 국비로 지원한다.","생활치료센터 시설에서 치료중 증상 완화 시에는 격리해제 기준에 따라 퇴소할 수 있다."],2,"② 생활치료센터 시설에서는 의료진이 1일 2회 모니터링을 실시하고 증상 악화 시에는 의료기관으로 신속 이송한다."],[1,"코로나19 예방법으로 틀린 것은 무엇일까요?",["호흡기 증상이 있는 경우에는 마스크를 벗고 있는다.","코를 풀거나 기침, 재채기후에는 손을 씻어 준다.","기저귀 교체 전‧후에는 손을 씻어 준다.","기침할때는 휴지나 옷소매 위쪽으로 입과 코를 가리고 한다."],1,"호흡기 증상이 있는 경우에는 마스크를 쓴다."],[1,"코로나19 치료법으로 맞는 것은 무엇일까요?",["대중치료로 수액보충, 해열제 등 보존적치료","항바이러스제","무좀약","피부연고"],1,""],[1,"코로나19 대표적인 증상으로 틀린 것은 무엇일까요?",["당뇨","호흡곤란","권태감","객혈과 오심"],1,"발열, 권태감, 기침, 호흡곤란 및 폐렴 등 경증에서 중증까지 다양한 호흡기감염증이 나타남. 그 외 가래, 인후통, 두통, 객혈과 오심, 설사 등도 나타남"],[1,"어떤 감염병이 2∼5년을 주기로 유행하는 현상은?",["순환변화","추세변화","계절적 변화","불규칙 변화","규칙변화"],1,"감염병의 유행양식의 시간적 현상 추세변화∶장기변화로서 수 십년 주기로 발생유행:장티푸스(30∼40년), 디프테리아(20년) 순환변화∶주기적변화로서 수년의 단기간을 주기로 반복유행:홍역(2년), 백일해(2∼4년) 계절적변화∶1년 주기로 계절적 발생 유행:여름소화기질환, 겨울호흡기질환"],[1,"모체로부터 출생 시 태반이나 모유를 통해 받는 면역은?",["자연능동면역","인공능동면역","자연수동면역","인공수동면역","선천능동면역"],3,"면역의 종류 ㉠ 선천면역 - 인종, 풍속, 개인특이성 ; 날 때부터 갖고 있는 자연 면역 ㉡ 후천면역 - 질병에 이환된 후, 예방접종 등에 의해 형성된 면 는 계단을 통해 대피한다.","아래층으로 대피가 곤란하면 옥상으로 대피한다.","계단에 연기가 가득할 경우 경량칸막이를 통해 아래층으로 대피한다.","주거지 내에 있는 대피공간에 대피한다."],3,""],[1,"비행기에서의 비상탈출에 관한 설명으로 알맞은 것은?",["이륙 후 3분, 착륙 전 8분에 항공기 사고는 집중적으로 일어난다.","비상탈출용 슬라이드는 튼튼한 성분이므로 하이힐을 신어도 관계없다.","비상구 옆 좌석의 승객은 어린이가 앉아도 된다.","가능한 소지품은 모두 들고 내린다."],1,""],[1,"지하철이 들어오고 있는 지하철 선로에 추락했을 때 해야 할 행동으로 가장 알맞은 것은?",["선로 바닥에 납작 엎드린다.","반대편 선로로 피한다.","다른 승객들의 도움을 받아 승강장으로 올라온다.","승강장 밑 배수로로 피한다."],4,"실수로 선로에 떨어졌을 때에는 승강장 배수로가 도움이 됩니다. 지하철 선로 옆의 공사 및 보수 작업을 위해 마련해 놓은 배수로가 있는데, 이곳의 크기는 높이 1.2m, 깊이가 90cm로 성인도 충분히 대피할 수 있습니다. 자칫하면 안전사고가 일어나기 쉬운 지하철. 지하철 선로에 추락했을 경우 당황하지 말고 다음의 행동으로 위기에서 안전하게 벗어날 수 있습니다. 1. 혼잡한 시간에는 다른 사람에게 밀려서 사고가 발생하기도 합니다. 지하철에서는 반드시 노란색 안전선 뒤에 서고 앞사람을 밀거나 건드리지 않도록 주의하세요. 2. 만약 선로에 떨어진 경우 반대편 선로는 또 다른 열차가 들어올 수 있으므로 반대편 선로로 가지 말고, 전동차가 오지 않을 경우에는 승객의 도움을 받아 승강장으로 올라오세요. 3. 차가 이미 들어오고 잇을 때에는 재빨리 승강장 밑 배수로로 몸을 피해 전동차가 지나갈 때까지 기다립니다."],[1,"지진이 일어났을 때의 대피 방법으로 알맞은 것은?",["실내에 있을 때 테이블 밑으로 들어가는 것은 위험하다.","실내에 있을 때는 가능한 한 빨리 밖으로 대피한다.","야외에서는 기댈 수 있는 곳을 찾아 대피한다.","건축물 주변보다는 공터나 공원 등 넓은 공간으로 대피한다."],4,""],[1,"자전거 안전운전 규칙에 대해 알맞은 것은?",["어두운 색 옷을 입는 것이 안전하다.","야광등을 켜면 눈이 부시므로 어두워져도 켜지 않아야 한다.","방향을 바꿀 때는 수신호를 한다.","자동차 운전자의 사각지대에 들어가는 것이 안전하다."],3,""],[1,"태풍의 위력에 대한 설명으로 알맞은 것은?",["초속 15m에는 지붕이나 기왓장이 뜯겨 날아간다.","초속 35m에는 허술한 집이 붕괴된다.","초속 35m에는 사람은 물론 커다란 바위까지 날아간다.","초속 40m에는 콘크리트로 만든 집이 붕괴된다."],2,""],[1,"감전사고 대처법에 관해 알맞은 설명은 무엇일까요?",["감전당한 사람은 맨손으로 만져야 한다.","비상 시 바닥이 가죽으로 되어 있는 운동화를 작용한다.","집 침수 시, 물을 퍼내기 전 배전반의 스위치를 올린다.","전류가 통하지 않는 절연체를 사용한다."],4,""],[1,"정전 발생 시 조치 방법으로 알맞지 않은 것은 무엇인가요?",["한 집만 정전인지 전체 정전인지 확인한다.","주변의 다른 집들도 정전일 경우 114로 신고한다.","엘리베이터 안에서 정전 시 인터폰으로 연락하고 구조를 기다린다.","한 집만 정전일 경우 누전차단기와 두꺼비 집을 확인한다."],2,""],[1,"일사병에 관한 설명으로 알맞지 않은 것은?",["어지럼증, 두통, 발열 ,구토 등의 증상을 보인다.","환자를 서늘한 곳으로 이동시킨 후 체온을 높여준다.","물이나 전해질 음료를 마시게 한다.","체내의 수분이 과다하게 손실돼 발생하는 질환이다."],2,""],[1,"열사병에 관한 설명으로 알맞은 것은?",["일사병은 심하면 죽을 수도 있지만 열사병은 쉽게 회복된다.","얼음물에 환자를 담그는 것은 위험한 방법이다.","냉수를 이용해 장기를 세척하는 방법으로 심부체온을 낮추기도 한다.","장시간 뜨거운 햇빛에 노출되거나 지나치게 더운 장소에서 오래 있을 때 생긴다."],3,""],[1,"폭염 예방법으로 알맞은 것은?",["커피, 콜라 같은 시원한 음료를 많이 마신다.","낮 12시부터 4시까지는 냉방이 가능한 곳에서 2시간 정도 머무는 것이 좋다.","더운 날 혼자 차에 어린이 혼자 있어도 관계없다.","냉방이 안되는 실내의 경우 창문을 열면 더 더워지므로 창문은 닫고 햇빛을 차단한다."],2,""],[1,"폭설 안전기준에 대한 설명으로 알맞은 것은?",["모든 건축물은 10kg/m2의 습설하중을 견딜 수 있도록 지어야 한다.","지붕의 경사 강도에 따라 기둥의 간격도 정해졌다.","어길 경우 최소 10년 이상의 징역에 처해지도록 법이 바뀌었다.","폭 10m 길이 20m 비닐하우스 지붕에 눈이 1m 쌓이면 그 무게는 60톤 정도이다."],2,""],[1,"마찰력에 대한 설명으로 바르지 않은 것은?",["빙판길에서 자주 넘어지는 이유는 마찰력 때문이다.","표면이 매끄러우면 마찰력이 낮아져 쉽게 미끄러진다.","비나 눈이 오면 마찰력이 커진다.","눈이나 한파로 빙판이 생긴 날에는 운동화나 등산화처럼 바닥이 거친 신발을 신는 것이 안전하다."],3,""]],[[1,"눈이 많이 쌓여 있는 곳에서 운전방법에 대해 알맞은 방법은?",["얼음이 언 곳에서는 2단으로 출발한다.","눈이 쌓여있을 때는 미끄러우므로 브레이크를 세게 밟아야 한다.","내리막길이나 빙판길에서는 1~2단에서 3~4단으로 기어를 높여야 한다.","정차 시에는 풋 브레이크 대신 기어를 변속해 차를 세워야 한다."],1,""],[1,"화학전 공격 징후와 대피 방법으로 알맞은 것은?",["실내에서는 외부공기 차단을 위해 문이나 창문을 닫아야 한다.","환풍기를 켜서 공기를 깨끗하게 해야 한다.","오염지대와 바람의 방향을 일직선상으로 봤을 때 180도 방향으로 대피해야 한다.","강력한 섬광과 3~4000도의 고열로 5km 이내가 완전 연소된다."],1,""],[1,"핵∙방사능전공격 징후와 대피 방법으로 알맞지 않은 것은?",["폭발로 인한 충격과 폭풍으로 4km이내 건물 및 인명 피해가 일어난다.","즉시 가까운 강이나 호수로 대피하여 몸을 씻는다.","비닐 옷이나 우산으로 몸을 보호한다.","지하 시설로 대피한다."],2,""],[1,"미세먼지주의보가 내린 날에 해야 할 일로 알맞은 것은?",["야외 활동을 적극적으로 한다.","공기 정화기를 틀면 외부 공기가 들어오므로 틀지 않는다.","물을 자주 마시는 것은 미세 먼지 주의보와는 관계 없다.","외출 시 보호 안경과 마스크를 필수로 사용한다."],4,""],[1,"미세먼지 높은 날 건강 생활 수칙으로 옳지 않은 것은?",["실외 활동 시에는 마스크, 보호안경, 모자 등 착용한다.","창문을 닫고, 빨래는 실외에서 건조한다.","세면을 자주하고, 흐르는 물에 코를 자주 세척한다.","학교나 유치원은 실내 체육수업으로 대체 권고한다.","가급적 대중교통을 이용하고, 야외 바비큐 등을 자제한다."],2,""],[1,"미세먼지 주의보 발령 시 가정 및 식품 취급 장소에서 생활 수칙으로 옳지 않은 것은?",["노약자, 호흡기 질환자 등은 실외활동을 자제하도록 한다.","창문을 닫고 가급적 외출을 최소화한다.","채소, 과일 등의 농수산물은 간단히 헹구고 섭취하도록 한다.","식품제조·가동, 조리 시 철저한 손 씻기를 한다.","기계·기구류 세척 등 위생관리 2차 오염방지를 한다."],3,""],[1,"미세먼지주의보 발령 시 학교 및 교육기관에서 생활 수칙으로 옳지 않은 것은?",["대기오염예보를 고려해 실내체육으로 대체한다.","외출 시에는 보호안경, 마스크를 착용한다.","가끔씩 창문을 열고 환기시킨다.","쉬는 시간마다 손 씻기를 한다.","천식 등 호흡기 및 심폐질환 학생에 특별 고지한다."],3,""],[1,"낙석의 위험징후로 알맞지 않은 것은?",["바위에 금이 가고 있다.","바람이 불지 않는 데 나무가 흔들리고 넘어진다.","산울림, 땅울림이 들린다.","봄철이 가장 안전하다."],4,""],[1,"지진의 규모에 대한 설명으로 틀린 것은?",["규모 3~3.9 : 인간은 자주 느끼지만 피해는 입히지 않는다.","규모 4~4.9 : 방 안에 물건들이 흔들리는 것을 뚜렷이 관찰할 수 있지만, 심각한 피해는 발생하지 않는다.","규모 6~6.9 : 최대 160km에 걸쳐 건물들을 파괴하며, 1년에 약 120건이 발생한다.","규모 7~7.9 : 수백km 지역에 걸쳐 심한 피해를 입히며, 1년에 1건 정도 발생한다."],4,"0~2.9 : 지진계의 의해서만 탐지가 가능하며 대부분의 사람이 진동을 느끼지 못함 3.0~3.9 : 인간은 자주 느끼지만 피해는 입히지 않음 4.0~4.9 : 방 안의 물건들이 흔들리는 것을 뚜렷이 관찰할 수 있지만 심각한 피해는 입지 않음 5.0~5.9 : 좁은 면적에 걸쳐 부실하게 지어진 건물에 심한 손상 6.0~6.9 : 최대 160Km에 걸쳐 건물들을 파괴하며, 1년에 약 120건 발생 7.0~7.9 : 넓은 지역에 걸쳐 심한 피해를 입히며, 1년에 약 18건 정도 발생 8.0~8.9 : 수백Km 지역에 걸쳐 심한 피해를 입히며, 1년에 1건 정도 발생 9 이상 : 수천km 지역을 완전히 파괴하는데, 약 20년에 1건 꼴로 발생"],[1,"사람과 동물 사이에 상호 전파되는 감염병인 인수공통감염병이 아닌 것은?",["구제역","광견병","조류독감","일본뇌염"],1,""],[1,"신종감염병 예방 습관으로 바르지 않은 것은？",["도마와 칼은 식품별로 구분해 사용한다.","비누로 손만 잘 씻어도 감염병을 70% 이상 예방할 수 있다.","채소류는 익혀 먹으면 영양소가 파괴되므로 가열하지 말고 먹어야 한다.","손으로 눈, 코, 입을 만지지 않는다."],3,""],[1,"가스가 누출되었을 때의 대처 방안으로 알맞은 것은?",["LPG 가스는 공기보다 가벼워 공중에 뜨므로 환풍기를 켠다.","선풍기를 틀어 가스를 내보낸다.","빗자루나 방석으로 바닥에 남은 가스를 쓸어 낸다.","즉시 중간밸브를 차단하고 닫아 외부 공기가 들어오지 못하게 한다."],3,""],[1,"고층건물 붕괴 시의 대피 방법으로 알맞지 않은 것은?",["우선 대피로를 찾는다.","완강기, 로프, 손전등을 들고 탈출 통로를 찾는다.","건물 구조를 잘 아는 사람을 맨 끝에서 이동하게 한다.","대피시엔 방석 등으로 머리를 보호한다."],3,""],[1,"건물 잔해에 깔렸을 때의 대처방법으로 가장 알맞은 것은?",["휴대 전화를 계속 켜놓고 외부와의 연락을 시도한다.","체력 소모가 있더라도 계속 고함을 질러 사람이 있음을 알린다.","더 다칠 수 있으므로 손가락과 발가락을 움직이지 않는다.","주위에 인기척이 나면 파이프 등을 두드려 주의를 끈다."],4,""],[1,"선박 사고를 당했을 때 대처방법에 대해 알맞은 것은?",["구명복은 노약자의 착용을 도운 후 보호자가 착용하도록 한다.","보호자부터 구명정에 먼저 오른 후 어린이와 여성 노약자가 오르도록 한다.","구명조끼를 입고 물 속에서 쉽게 움직일 수 있도록 신발을 신는다.","출입문이나 비상구가 열리지 않을 때는 선내 비치된 도끼로 창문을 깨고 탈출한다."],4,""],[1,"체온유지를 위한 방법으로 알맞은 것은?",["다리를 올리고 양 팔을 끼워 무릎을 감싼다.","머리는 물 안으로 최대한 넣어 열 손실을 줄인다.","피부가 물에 닿는 면적을 최대화 한다.","젖은 옷은 벗지 말고 따뜻한 물병이나 수건 등으로 가슴 부위를 따뜻하게 한다."],1,""],[1,"화상을 입었을 때 대처방법으로 알맞은 것은?",["화상 부위를 따뜻한 물에 10분 동안 담급니다.","물집을 터뜨리고 화상 부위에 붙은 물질을 떼어낸다.","로션이나 연고, 기름을 바른다.","상처를 멸균 처리된 보푸라기 없는 거즈로 덮는다."],4,""],[1,"피부가 햇볕에 타서 화끈거릴 때 대처법으로 알맞지 않은 것은?",["찬물이나 우유로 찜질한다.","물을 충분히 마신다.","고기를 충분히 먹는다,","알로에나 오이로 팩을 한다."],3,""],[0,"응급환자가 발생했을 때 현장의 목격자가 신속한 도움을 주는 것은 매우 중요함으로 응급처치원은 119에 신고할 때 중요한 내용만을 알리고 즉시 환자를 처치해야한다.",null,"X",""]]],"sa":[["성폭력 피해를 당할 위험에 처했을 때 사람들의 관심을 끌기 위해 큰 소리를 지르거나 무엇을 불어야 하나요?","호루라기"],["다음은 어떤 상황을 설명하는 내용일까요?","동상"],["어린이 카시트는 자동차 내부 중 어디에 설치하는 것이 가장 좋을까요?","뒷좌석 가운데"],["추운 겨울동안 암벽 틈새로 스며든 물이나 눈이 얼어붙으면서 바위틈을 벌려놨다가, 날이 풀리면 얼음이 녹으면서 얼음에 붙어 있던 바위가 떨어져 굴러 내리는 현상을 무엇이라 할까요?","낙석"],["헤어스프레이나 부탄가스를 버릴 때 반드시 빼야하는 것은 무엇일까요?","가스"],["놀이터 설계 시 바닥의 두께는 추락의 충격을 흡수할 수 있도록 몇 cm이상으로 해야 하 는가?","15cm"],["일반적으로 과학 실험에서 많이 사용하는 안전 보호 장구 6가지 중 3가지를 적으시오","실험복, 보안경, 실험용 보호장갑, 마스크, 눈 세척기, 비상 샤워기"],["물에 빠졌을 때 스스로 뜨기 위한 동작을 무엇이라 하는가?","새우등 뜨기"],["전기가 아닌 배터리로 운용되며 공연, 행사장에서 비상사태가 발생했을 때 신속한 대피를 위해 사용하는 것은?","유도등"],["겨울 운동 시에 음주를 하면 체온이 떨어진다. 어떠한 작용 때문인가?","이뇨, 발한 작용"],["가끔 신문이나 뉴스에서 보면 지진이 발생했고 규모는 진도 00이다. 라는 말을 들을 수가 있습니다. 진도는 그 수치가 높을수록 지진의 강도가 약할까요? 강할까요?","강하다"],["지진발생 시 불을 끌 기회는 총 몇 번인가?","3번"],["지진 발생 시 자동차는 도로의 어느 부분에 세워야 할까요?","오른쪽"],["진도 몇 이상이 발생했을 때 전철(지하철)은 운행이 정지될까요?","진도 5 이상"],["지진해일이 발생하면 고지대가 안전할까요? 저지대가 안전할까요?","고지대"],["우리나라의 경우 일본 서쪽 연안의 지진대에서 규모 7.0 이상의 지진이 발생하면 일반적으로 약 1-2시간 이내에 동해안에 이것이 도달하게 된다. ‘이것’의 속도는 사람의 움직임보다 빠르고, 그 힘이 강력하여 건물을 파괴할 수 있는 위력을 갖는다. ‘이것’은 무엇일까요?","지진해일"],["한반도 주변지역 등에서 규모 7.0이상의 해저지진이 발생하여 해일의 발생이 우려될 때 지진해일의 발령명은?","지진해일 주의보"],["지하철역이 정전되었더라도 크게 당황할 필요는 없는 것은 이것이 있기 때문입니다. 여기 서 ‘이것’은 무엇일까요?","비상등"],["옷에 불이 붙었을 때 어떻게 꺼야할까요?","바닥에 비벼서 끈다"],["사용하지 않는 전기제품에서 빠져나가는 전력을 무엇이라고 할까요?","대기전력"],["선박 탈출 후 구명조끼를 입고 물속에 있을 때 신발은 신고 있는 것이 좋을까요? 벗는 것이 좋을까요?","벗는다"],["비행기를 타서 위험한 상황 발생 시 누구 안내를 따라야 하나요?","승무원"],["폭발 가스에 의해 눈이 따가울 경우 어떻게 해야 할까요?","깨끗한 물로 씻어낸다"],["공기 속에 먼지나 밀가루 등의 미세한 고체 알갱이가 많아지면 열과 압력이 높아져 불꽃이나 정전기로 인해 불이 붙어 폭발할 수 있어요. 이런 폭발을 무엇이라 할까요?","분진폭발"],["실내에서 가스가 새었을 때 가스를 밖으로 내보내기 위해 즉시 해야 할 일은 무엇일까요?","환기를 시킨다"],["방사선은 빛이나 냄새가 있을까, 없을까요?","없다"],["자전거의 통행은 어느 쪽으로 해야 할까요?","우측"],["철도 건널목에서 차가 멈추면, 자동변속기 차량의 경우 기어를 어떻게 놓고 차를 밀어야 할까요?","중립"],["요즘 백화점, 대형 할인매장 등에서 에스컬레이터 안전사고가 빈번히 발생하고 있다. 사고를 예방하기 위해 에스컬레이터 디딤판 가장자리에는 이것이 표시되어 있다. 이것은 무엇일까요?","황색안전선"],["밤에도 기온이 25℃ 아래로 떨어지지 않는 무더운 밤을 무엇이라고 하나요?","열대야"],["지하철이나 고속철도, 버스 등에서 화재 발생 시 출입문이 자동, 수동으로 모두 열리지 않을 경우 무엇을 이용해서 창문을 깨고 탈출 할 수 있나요?","비상용 망치"],["파도가 해안으로 밀려오다가 해저 언덕 등의 영향으로 흐름의 방향이 바뀌어 해변에서 멀어지는 쪽으로 휩쓸리는 파도를 무엇이라고 하나요?","이안류"],["이동속도가 매우 빠르고 해안에 가까워질수록 급격히 파고가 높아지는 파도의 이름은 무엇인가요?","너울성 파도"],["제1군 감염병에는 콜레라, 장티푸스, 세균성 이질, 파라티푸스, 장출혈성대장균감염증 외 에 무엇이 있나요?","A형 간염"],["하나의 콘센트에서 여러 전기기구를 사용하면 과전류로 인해 전선이 맞붙어 아크와 함께 고열이 발생하여 화재로 이어질 수 있습니다. 이런 식의 위험한 배선 방법을 무엇이라고 하나 요?","문어발식 배선"],["고층 건물에서 화재가 발생했을 때 출입구로 빠져나가지 못할 경우 베란다나 창가에 설치된 ‘이것’을 사용해서 안전하게 대피할 수 있습니다. 몸에 로프를 매고 땅까지 천천히 내려올 수 있도록 만든 ‘이것’은 무엇일까요?","완강기"],["배선의 피복이 손상되거나 전선이 금속체 또는 구조물에 직접 접촉되어 전기가 밖으로 새 어 흐르는 현상을 무엇이라고 하나요?","누전"],["산불이 발생했을 때, 타버린 연료지대, 저지대, 연료가 없는 지역, 도로, 바위 뒤 등은 어떤 장소인가요?","대피장소"],["‘회로를 분류하여 회로별로 누전차단기를 설치한다.’, ‘배선의 피복손상 여부를 수시로 확인한다.’, ‘전선이 금속체나 젖은 구조물에 직접 접촉되지 않도록 배선한다.’ 등은 전기화재 중 어떤 것을 예방하기 위함인가요?","누전"],["‘사용한 전기기구는 반드시 플러그를 뽑아 놓고 외출한다.’, ‘전기장판 등 발열체를 장시간 전원을 켠 상태로 사용하지 않는다.’, ‘한 콘센트에 여러 개의 플러그를 꽂아 문어발식 사용을 하지 않는다.’ 등은 어떤 화재를 예방하기 위한 방법일까요?","전기화재"],["화재 발생 시, 절대로 이용하지 말아야 할 것은 무엇인가요?","엘리베이터"],["건물이 부서지거나 떨어진 물체에 끼이거나 깔린 경우 혈액순환(피가 잘 통하게 하기 위해)이 잘될 수 있도록 취할 수 있는 행동은 무엇일까요?","손가락과 발가락을 움직인다"],["건물이 무너진 후 경우 먼지 마시는 것을 줄이기 위해 옷이나 천으로 어디를 가려야 할까요?","입과 코"],["재난안전 안내전화 중, 전기고장신고는 몇 번인가요?","123"],["재난안전 안내전화 중, 상수도고장신고는 몇 번인가요?","121"],["재난안전 안내전화 중, 일기예보안내는 몇 번인가요?","131"],["물의 맛과 냄새, 색깔 등이 평소와 다르고, 식수 음용이나 사용 후 신체에 이상한 증세가 나타난다. 또는 수면 위 기름 등이 광범위하게 퍼져있고, 하천․호소 내 광범위한 지역에서 어류활동이 이상하거나 폐사하는 경우, 어떤 오염이 예상되나요?","수질오염"],["‘승강문이 열리지 않으면 비상용 망치를 이용하여 비상창문을 깨고 탈출할 수 있다.’, ‘반대선 선로에는 절대로 대피하지 않도록 하고, 선로변 내에 머무르지 않는다.’, ‘터널 내에서는 자세를 낮추고 비상 유도등을 따라 가까운 터널 입구 및 비상대피소로 이동한다.’, ‘안전한 장소에서 구급차, 구원열차, 버스 등 연계수송 교통수단을 기다린다.’ 등은 어디에서 화재발생시의 대피요령인가요?","고속철도"],["물질이 흡수되는 경로는 입, 호흡기, 피부이다. 사고 발생지역으로부터 멀리 떨어져 있는 것이 좋다. 직접 피부가 노출되지 않도록 우의나 비닐을 착용하고, 수건, 마스크, 장갑 등을 이용하여 코, 입 등을 감싸고 대피한 후 안전한 곳에 가서 새 옷으로 갈아입어야 한다. 옷에 소량의 독성물질이 묻어 있어도 건강을 해칠 수 있다. 이는 어떤 사고 발생 시 대처 요령인가요?","화학사고"],["암모니아, 염화수소 등 비중이 공기보다 가벼운 가스는 누출장소 보다 높은 곳으로 대피해야 하는가? 낮은 곳으로 대피해야 할까요?","낮은 곳"],["염소, 아황산가스 등 비중이 공기 function medalCount(){ let m=0; for(let d=1; d<=N_DAYS; d++) if(isPerfect(d)) m++; Object.values(S.comp).forEach(x=>{ if(x.best===COMP_N) m++; }); return m; }
function clearedCount(){ return Object.values(S.days).filter(x=>x.cleared).length; }
function isOpen(d){ return d===1 || (S.days[d-1] && S.days[d-1].cleared); }
function nextDay(){ for(let d=1; d<=N_DAYS; d++){ if(!(S.days[d]&&S.days[d].cleared)) return d; } return null; }

// ---------- code (인증코드) ----------
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h; }
// packs: num(<100) day(<50) first(<100) rounds(<50) study(<100) points(<5000) date(offset from 11/1, <100)
const DBASE = dayNum("2026-11-01");
function makeCode(num, day, first, rounds, points, date, study){
  const off = Math.max(0, Math.min(99, dayNum(date)-DBASE));
  const v = (((((num*50+day)*100+first)*50+Math.min(rounds,49))*100+Math.min(study||0,99))*5000+Math.min(points,4999))*100 + off;
  const body = v.toString(36).toUpperCase();
  const ck = (hash(body+SALT)%1296).toString(36).toUpperCase().padStart(2,'0');
  return 'GB-'+body+'-'+ck;
}
function parseCode(tok){
  const m=/^GB-([0-9A-Z]+)-([0-9A-Z]{2})$/.exec(tok.trim().toUpperCase()); if(!m) return null;
  const ckOf=salt=>(hash(m[1]+salt)%1296).toString(36).toUpperCase().padStart(2,'0');
  const legacy = ckOf(SALT)!==m[2];
  if(legacy && ckOf("maneul-goldenbell-v2")!==m[2]) return null;   // v2 = claude.ai 링크 버전 코드도 인정
  let v=parseInt(m[1],36); if(!Number.isSafeInteger(v)) return null;
  const off=v%100; v=Math.floor(v/100);
  const points=v%5000; v=Math.floor(v/5000);
  const study=v%100; v=Math.floor(v/100);
  const rounds=v%50; v=Math.floor(v/50);
  const first=v%100; v=Math.floor(v/100);
  const day=v%50; const num=Math.floor(v/50);
  if(num<1||num>MAXNUM||day<1||(day>N_DAYS&&!(day>COMP_OFF&&day<=COMP_OFF+NB))) return null;
  return {num, day, first, rounds: legacy?0:rounds, points, study, date:numToDate(DBASE+off)};
}
// 손으로 옮겨 적다 생기는 실수(O↔0, I/L↔1, 띄어쓰기, 소문자)를 바로잡아 읽어요
const LOOK={'O':'0','0':'O','I':'1','L':'1','1':'I'};
function fuzzyParse(body, ck){
  const exact=parseCode('GB-'+body+'-'+ck); if(exact) return exact;
  const s=body+ck, pos=[]; for(let i=0;i<s.length;i++) if(LOOK[s[i]]) pos.push(i);
  if(pos.length>8) return null;
  for(let m=1; m<(1<<pos.length); m++){
    const a=s.split(''); pos.forEach((p,k)=>{ if(m&(1<<k)) a[p]=LOOK[a[p]]; });
    const t=a.join(''); const r=parseCode('GB-'+t.slice(0,body.length)+'-'+t.slice(body.length));
    if(r) return r;
  }
  return null;
}
function findCodes(text){
  const t=String(text).toUpperCase().replace(/[‐-―−]/g,'-');
  const out=[], re=/G\s*B[\s\-]*([0-9A-Z]{4,14})[\s\-]+([0-9A-Z]{2})(?![0-9A-Z])/g; let m;
  while((m=re.exec(t))){ const r=fuzzyParse(m[1].replace(/\s/g,''), m[2].replace(/\s/g,'')); if(r) out.push(r); }
  return out;
}
function applyRestore(cs){
  let n=0;
  cs.filter(x=>x.day>COMP_OFF).forEach(x=>{ const b=x.day-COMP_OFF; if(!S.comp[b]||S.comp[b].best<x.first){ S.comp[b]={best:x.first, tries:x.rounds, points:x.points, date:x.date}; n++; } });
  cs.filter(x=>x.day<=N_DAYS).forEach(x=>{ const r=S.days[x.day];
    if(!(r&&r.cleared)){ S.days[x.day]={cleared:true, first:x.first, rounds:1, points:x.points, date:x.date, n:DATA.days[x.day-1].length, studyR:x.study, fixedR:x.rounds}; n++; }
    else { const before=studyCount(x.day)+fixedCount(x.day); r.studyR=Math.max(r.studyR||0,x.study||0); r.fixedR=Math.max(r.fixedR||0,x.rounds||0); if(studyCount(x.day)+fixedCount(x.day)>before) n++; } });
  if(n){ if(!S.sent) S.sent=[]; allCodes().forEach(c=>{ if(!S.sent.includes(c)) S.sent.push(c); }); }
  persist(); return n;
}
// 다른 기기에서 내 번호로 들어오면, 자동 저장된 내 기록을 불러와요
async function pullMine(manual){
  if(!SYNC_ON||!S.profile) return 0;
  const me=S;
  try{
    const j=await fetch(SYNC_URL+'?t='+Date.now()).then(r=>r.json());
    if(S!==me) return 0;
    const cs=(j.codes||[]).map(parseCode).filter(x=>x&&x.num===me.profile.num);
    const n=applyRestore(cs);
    if(n){ toast(`☁️ 내 기록 ${n}개를 불러왔어요!`); if(view==='home'||view==='codes') render(); }
    else if(manual) toast('불러올 새 기록이 없어요');
    return n;
  }catch(e){ if(manual) toast('기록을 불러오지 못했어요. 인터넷을 확인해 주세요'); return 0; }
}
function codeFor(d){ const r=S.days[d]; return makeCode(S.profile.num, d, r.first, Math.min(fixedCount(d),49), r.points, r.date, studyCount(d)); }  // rounds 자리 = 다시 풀어 맞힌 문제 수
function compCode(b){ const r=S.comp[b]; return makeCode(S.profile.num, COMP_OFF+b, r.best, r.tries, r.points, r.date, 0); }
function compMessage(b){ const bd=blockDays(b); return `[안전골든벨] ${S.profile.num}번 ${S.profile.name} 종합${b}(${bd[0]}~${bd[bd.length-1]}일차) ${S.comp[b].best}/${COMP_N}점! 인증코드 ${compCode(b)}`; }
function codeMessage(d){ return `[안전골든벨] ${S.profile.num}번 ${S.profile.name} ${d}일차 클리어! 인증코드 ${codeFor(d)}`; }

function confetti(){

  $('#nx').onclick=()=>{ if(i+1<n){ studyPos=i+1; renderStudy(); window.scrollTo(0,0); } else startDay(d); };
}
function studyAnswer(k){
  const d=studyDay, i=studyPos; if(!S.study[d]) S.study[d]={}; if(i in S.study[d]) return;
  S.study[d][i]=k; const q=Q(d,i); const ok=q.mc?(+k===q.a):(k===q.a);
  if(!ok) S.wrong[d+'-'+i]=1;
  persist(); renderStudy(); showStudyFeedback(q, ok, true);
}
function showStudyFeedback(q, ok, fresh){
