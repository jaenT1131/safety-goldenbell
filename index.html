    <h3>${ok?'정답! 👏':'아쉬워요! 정답을 기억해요 💪'} ${fresh?`<span class="badge">+${PTS.study}점</span>`:''}</h3>
    ${ok?'':`<div>정답: <b>${esc(ansText)}</b></div>`}
    <div class="muted" style="margin-top:6px">💡 ${q.e?esc(q.e):'해설이 없는 문제예요. 정답을 한 번 더 읽고 기억해요!'}</div></div>`;
}

// ---------- quiz engine ----------
// items: array of [day, idx]
function startDay(d){
  const practice=!!(S.days[d]&&S.days[d].cleared);
  const items=DATA.days[d-1].map((_,i)=>[d,i]);
  S.cur={mode: practice?'practice':'day', day:d, round:1, items, queue:shuffle(items), pos:0, firstCorrect:0, roundWrong:[], roundRight:0};
  persist(); go('quiz');
}
function remainWrong(d){ const r=S.days[d]; if(!r) return []; return (r.wrongIdx||[]).filter(i=>!(r.fixed||[]).includes(i)).map(i=>[d,i]); }
function startRetry(d, items){
  S.cur={mode:'retry', day:d, round:1, items, queue:shuffle(items), pos:0, firstCorrect:0, roundWrong:[], roundRight:0, gained:0};
  persist(); go('quiz');
}
function startWrong(){
  const items=Object.keys(S.wrong).map(k=>k.split('-').map(Number)).filter(([d,i])=>DATA.days[d-1]&&DATA.days[d-1][i]);
  if(!items.length){ toast('오답이 없어요!'); return; }
  S.cur={mode:'wrong', day:0, round:1, items, queue:shuffle(items), pos:0, firstCorrect:0, roundWrong:[], roundRight:0};
  persist(); go('quiz');
}
function resumeQuiz(){ go('quiz'); }
let answered=false;
function renderQuiz(){
  const c=S.cur; if(!c){ go('home'); return; }
  if(c.pos>=c.queue.length) return renderRoundEnd();
  answered=false;
  const [d,i]=c.queue[c.pos]; const q=Q(d,i);
  const title = c.mode==='comp'?`🧩 종합 ${c.block}`:c.mode==='retry'?`🔁 ${c.day}일차 틀린 문제`:c.mode==='wrong'?'📝 오답 다시 풀기':(c.mode==='practice'?`🔁 ${c.day}일차 연습`:`🔔 ${c.day}일차 도전`);
  app().innerHTML=`<div class="top"><button class="btn ghost sm" onclick="go('home')">← 홈</button><h2>${title}</h2>${(c.mode==='comp'||c.mode==='day')?'':`<span class="badge">${c.round}번째 판</span>`}</div>
  <div class="prog"><i style="width:${c.pos/c.queue.length*100}%"></i></div>
  <div class="muted" style="margin:6px 0 10px">${c.pos+1} / ${c.queue.length}문제 ${c.round>1?'· 틀렸던 문제 다시!':''}</div>
  <div class="card">
    <div class="qnum">Q${c.pos+1}. ${q.mc?'':'<span class="badge">OX 퀴즈</span>'}</div>
    <div class="qtext">${esc(q.q)}</div>
    ${q.mc?`<div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k+1}"><span class="n">${CIRC[k]}</span><span class="grow">${esc(o)}</span></button>`).join('')}</div>`
      :`<div class="ox"><button class="o" data-k="O">⭕</button><button class="x" data-k="X">❌</button></div>`}
    <div id="fb"></div>
  </div>`;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>answer(b.dataset.k));
}
function answer(k){
  if(answered) return; answered=true;
  const c=S.cur; const [d,i]=c.queue[c.pos]; const q=Q(d,i);
  const ok = q.mc ? (+k===q.a) : (k===q.a);
  document.querySelectorAll('[data-k]').forEach(b=>{ b.disabled=true;
    const v=b.dataset.k; const isAns = q.mc ? (+v===q.a) : (v===q.a);
    if(isAns) b.classList.add('right'); else if(v===k) b.classList.add('wrong'); });
  const key=d+'-'+i;
  let gained=false;
  if(ok){ c.roundRight++; if(c.round===1) c.firstCorrect++; if(c.mode==='wrong'||c.mode==='retry') delete S.wrong[key];
    if(c.mode==='retry'){ const r=S.days[d]; if(r){ if(!r.fixed) r.fixed=[]; if((r.wrongIdx||[]).includes(i) && !r.fixed.includes(i)){ r.fixed.push(i); gained=true; c.gained=(c.gained||0)+1; } } } }
  else { c.roundWrong.push([d,i]); S.wrong[key]=1; }
  const ansText = q.mc ? `${CIRC[q.a-1]} ${q.o[q.a-1]}` : (q.a==='O'?'⭕ O':'❌ X');
  const cheers=['딩동댕! 🔔','정답이에요! 👏','최고예요! ⭐','안전 박사! 🦺'];
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">
    <h3>${gained?`<span class="badge" style="font-size:18px">+${PTS.retry}점</span> `:''}${ok?cheers[Math.floor(Math.random()*cheers.length)]:(c.mode==='comp'?'아쉬워요! 오답노트에 담아 둘게요 💪':(c.mode==='day'?'아쉬워요! 오답노트에 담아 둘게요 💪':'아쉬워요! 다음 판에 다시 나와요 💪'))}</h3>
    ${ok?'':`<div>정답: <b>${esc(ansText)}</b></div>`}
    ${q.e?`<div class="muted" style="margin-top:6px">💡 ${esc(q.e)}</div>`:''}
    <button class="btn" style="width:100%;margin-top:12px" id="nx">${c.pos+1<c.queue.length?'다음 문제 →':'결과 보기 →'}</button></div>`;
  c.pos++; persist();
  $('#nx').onclick=()=>renderQuiz();
  $('#nx').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderRoundEnd(){
  const c=S.cur; const wrong=c.roundWrong.length; const tot=c.queue.length;
  if(c.mode==='comp') return finishComp();
  if(c.mode==='day') return finishAll();          // 한 번 풀면 바로 클리어
  if(wrong===0){ return finishAll(); }
  app().innerHTML=`<div class="card center">
    <div class="big">💪</div>
    <h2>${c.round}번째 판 끝!</h2>
    ${c.mode==='retry'&&c.gained?`<p>지금까지 다시 맞혀서 <b style="color:var(--gold-d)">+${c.gained*PTS.retry}점</b>! 홈의 🎫 내 인증코드에서 새 코드를 보낼 수 있어요.</p>`:''}
    <p style="font-size:20px">${tot}문제 중 <b style="color:var(--green)">${tot-wrong}개 정답</b>, <b style="color:var(--red)">${wrong}개</b> 남았어요.</p>
    <p class="muted">${c.mode==='retry'?`남은 문제도 맞힐 때마다 +${PTS.retry}점! (선택)`:'더 연습하고 싶으면 틀린 문제만 다시 풀어 봐요. (선택)'}</p>
    <button class="btn gold" style="width:100%" id="again">틀린 ${wrong}문제 다시 도전!</button>
    <div style="height:8px"></div><button class="btn ghost" onclick="go('home')">그만하고 홈으로</button>
  </div>`;
  $('#again').onclick=()=>{ c.round++; c.queue=shuffle(c.roundWrong); c.roundWrong=[]; c.roundRight=0; c.pos=0; persist(); go('quiz'); };
}
function finishAll(){
  const c=S.cur;
  if(c.mode!=='day'){ S.cur=null; persist(); confetti();
    app().innerHTML=`<div class="card center"><div class="big">🎉</div><h2>${c.mode==='wrong'?'오답 모두 해결!':(c.mode==='retry'?'틀린 문제 모두 해결! 💯':'연습 클리어!')}</h2>
    <p class="muted">${c.mode==='wrong'?'맞힌 문제는 오답노트에서 빠졌어요.':(c.mode==='retry'?'':'연습은 포인트가 늘지 않지만 실력은 쑥쑥!')}</p>
    ${c.mode==='retry'?retryReward(c):''}
    <button class="btn gold" onclick="go('home')">홈으로</button></div>`;
    if(c.mode==='retry' && $('#cp')) $('#cp').onclick=()=>copyText(codeMessage(c.day));
    return; }
  const d=c.day, n=c.items.length, t=todayStr();
  const alreadyToday=Object.values(S.days).some(x=>x.cleared&&x.date===t);
  const yStreak=streakAt(numToDate(dayNum(t)-1));
  const streak = alreadyToday ? streakAt(t) : yStreak+1;
  const p={ first:c.firstCorrect*PTS.first, clear:PTS.clear,
    perfect: c.firstCorrect===n?PTS.perfect:0, streak: alreadyToday?0:Math.min(streak,PTS.streakMax)*PTS.streakPer };
  const points=p.first+p.clear+p.perfect+p.streak;
  const rec={cleared:true, first:c.firstCorrect, rounds:1, points, date:t, n, wrongIdx:c.roundWrong.map(x=>x[1]), fixed:[]};
  S.days[d]=rec; S.cur=null; persist();
  go('clear',{d, p, rec, streak, wrongs:c.roundWrong.slice()});
}
function retryReward(c){
  const g=c.gained||0; if(!g) return '';
  return `<p style="font-size:20px">다시 풀어 맞힌 ${g}문제 × ${PTS.retry} = <b style="color:var(--gold-d)">+${g*PTS.retry}점</b></p>
    ${SYNC_ON?`<p class="syncline" style="font-size:18px"></p>`:`<p style="margin-bottom:6px">👇 포인트가 늘었어요! 새 인증코드를 선생님께 보내 주세요</p>`}

    <button class="btn" style="width:100%;margin-bottom:8px" id="cp">📋 새 인증코드 복사하기</button>`;
}

    <div class="codebox" ${SYNC_ON?'style="font-size:14px;opacity:.7"':''}>${codeFor(d)}</div>

function renderComp(){

  for(let b=1;b<=NB;b++){

        <div class="muted">${open?(r?`최고 ${r.best}/${COMP_N}점 · ${r.tries}번 도전 · ${r.points}포인트`:'아직 안 풀었어요'):`🔒 ${need.join(', ')}일차를 클리어하면 열려요`}</div>
      </div>${r&&r.best===COMP_N?'<div class="big" style="font-size:36px">🥇</div>':''}</div>

function startComp(b){
  if(!blockOpen(b)) return;
  const all=[]; blockDays(b).forEach(d=>DATA.days[d-1].forEach((_,i)=>all.push([d,i])));
  const items=shuffle(all).slice(0,COMP_N);
  S.cur={mode:'comp', day:0, block:b, round:1, items, queue:items, pos:0, firstCorrect:0, roundWrong:[], roundRight:0};
  persist(); go('quiz');
}
function finishComp(){
  const c=S.cur, b=c.block, score=c.firstCorrect, t=todayStr();
  const prev=S.comp[b]; const tries=(prev?prev.tries:0)+1;
  const pts=score*PTS.compEach+(score===COMP_N?PTS.compPerfect:0);
  const better=!prev||score>prev.best;
  S.comp[b]= better ? {best:score, tries, points:pts, date:t} : {...prev, tries};
  const wrongs=c.roundWrong.length; S.cur=null; persist();
  if(better) confetti();
  const r=S.comp[b];
  app().innerHTML=`<div class="card center">
    <div class="big">${score===COMP_N?'🥇':(better?'🎉':'💪')}</div>
    <h2 style="margin:6px 0">종합 ${b} · ${score}/${COMP_N}점</h2>
    <p class="muted">${better?(prev?`최고 기록 갱신! (전에는 ${prev.best}점)`:'첫 기록이에요!'):`최고 기록 ${r.best}점은 그대로예요. 다시 도전해 봐요!`}</p>
    ${wrongs?`<p class="muted">틀린 ${wrongs}문제는 📝 오답노트에 담았어요.</p>`:''}
    <p style="margin:6px 0">종합 ${b} 포인트: <b style="color:var(--gold-d)">${r.points}</b></p>
    ${better&&SYNC_ON?`<p class="syncline" style="font-size:18px"></p>`:''}
    ${better?`<p style="margin-bottom:6px">${SYNC_ON?'인증코드 (자동 전송이 안 될 때만 보내요)':'👇 새 기록 인증코드를 선생님께 보내 주세요'}</p><div class="codebox">${compCode(b)}</div><div style="height:10px"></div>
    <button class="btn gold" style="width:100%" id="cp">📋 인증코드 복사하기</button><div style="height:8px"></div>`:''}
    <div class="row" style="justify-content:center"><button class="btn ghost" onclick="go('comp')">종합문제 목록</button><button class="btn" onclick="go('home')">홈으로</button></div>
  </div>`;
  if(better) $('#cp').onclick=()=>copyText(compMessage(b));
}

  <div class="card">${list.length?`<table><tr><th>일차</th><th>날짜</th><th>포인트</th><th>코드</th></tr>
    ${list.map(([d,r])=>`<tr><td>${d}</td><td>${r.date.slice(5)}</td><td>${r.points}</td><td style="font-family:monospace;font-size:13px;user-select:all">${codeFor(d)}</td></tr>`).join('')}
    ${clist.map(b=>`<tr><td>종합${b}</td><td>${S.comp[b].date.slice(5)}</td><td>${S.comp[b].points}</td><td style="font-family:monospace;font-size:13px;user-select:all">${compCode(b)}</td></tr>`).join('')}</table>`:'<p class="muted center">아직 클리어한 일차가 없어요.</p>'}</div>
  ${SYNC_ON?`<div class="card today"><h3 style="margin-top:0">☁️ 내 기록 불러오기</h3><p class="muted">다른 기기에서 푼 기록을 자동으로 가져와요. 내 번호로 들어왔는지 꼭 확인하세요!</p><button class="btn gold" id="pullb">☁️ 내 기록 불러오기</button></div>`:''}
  <div class="card"><h3 style="margin-top:0">🔧 인증코드로 되살리기</h3>
    <p class="muted">인증코드를 붙여 넣거나 그대로 옮겨 적어 주세요. 영어 O와 숫자 0이 헷갈려도 괜찮아요. (내 번호 코드만 되살아나요)</p>
    <textarea id="rs" placeholder="GB-XXXX-XX 코드를 붙여 넣기"></textarea><div style="height:8px"></div>
    <button class="btn" id="rsb">되살리기</button></div>`;
  if(list.length) $('#all').onclick=()=>copyText(list.map(([d])=>codeMessage(d)).concat(clist.map(compMessage)).join('\n'));
  $('#rsb').onclick=()=>{ const all=findCodes($('#rs').value); const cs=all.filter(x=>x.num===S.profile.num);
    const n=applyRestore(cs);
    toast(n?`${n}개 기록을 되살렸어요!`:(all.length&&!cs.length?`이 코드는 ${all[0].num}번 코드예요. 내 번호(${S.profile.num}번)로 들어왔는지 확인해 주세요`:(all.length?'이미 되살린 기록이에요':'코드를 읽지 못했어요. 코드를 다시 확인해 주세요'))); go('codes'); };
  if(SYNC_ON) $('#pullb').onclick=()=>pullMine(true);
}

  <div class="card"><table>

    <tr><td class="l">🔁 틀린 문제를 다시 풀어 맞힘 (선택)</td><td>1문제당 <b>${PTS.retry}점</b></td></tr>

    <tr><td class="l">🧩 종합문제 (최고 기록만)</td><td>맞힌 문제 × ${PTS.compEach}점, 만점이면 🥇 +${PTS.compPerfect}점</td></tr>
    <tr><td class="l">🥇 금메달 (도전하기 모두 정답)</td><td><b>+${PTS.perfect}점</b></td></tr>
    <tr><td class="l">🔥 연속 공부 (하루 첫 클리어)</td><td>연속 일수 × ${PTS.streakPer}점 (최대 ${PTS.streakMax*PTS.streakPer}점)</td></tr>
  </table><p class="muted">틀린 문제 다시 풀기 점수는 문제마다 한 번만 받아요. 35문제 전체 연습은 포인트가 늘지 않아요.</p></div>`;

// ================= TEACHER =================
let T = {roster:{}, recs:{}};
let tdb=null, tUnsub=null, tUnlocked=false, tSrc='local', tTV=false, tWriting=Promise.resolve();
function teacherLocal(){ T=load(TKEY,{roster:{},recs:{}}); }
async function initTeacherStore(){
  teacherLocal(); tSrc='local';
  try{
    const db = window.claude && await window.claude.use('db');
    if(!db) return;
    tdb=db;
    const ref=db.doc('board/v4');
    let timer=setTimeout(()=>{ tSrc='local'; if(view==='teacher') renderTeacher(); },10000);
    tUnsub=ref.onSnapshot(snap=>{
      clearTimeout(timer);
      if(snap.exists){ const d=snap.data(); T={roster:{...(d.roster||{})}, recs:{...(d.recs||{})}}; }
      tSrc='db'; save(TKEY,T); if(view==='teacher') renderTeacher();
    }, err=>{ clearTimeout(timer); tdb=null; tSrc='local'; if(view==='teacher') renderTeacher(); });
  }catch(e){ tdb=null; }
}
function saveTeacher(){
  save(TKEY,T);
  if(tdb && tSrc==='db'){
    const body=JSON.parse(JSON.stringify(T));
    tWriting=tWriting.then(()=>tdb.doc('board/v4').set(body)).catch(e=>{ toast('저장 실패: '+(e&&e.code||'오류')+' — 이 기기에만 저장했어요'); });
  }
}
function renderPin(){}
function mergeCodes(cs){
  let added=0, upd=0, dup=0;
  cs.forEach(x=>{ const k=x.num+'-'+x.day; const o=T.recs[k];
    if(!o){ T.recs[k]=x; added++; }
    else if(x.day<=N_DAYS && ((x.study||0)>(o.study||0) || (x.rounds||0)>(o.rounds||0))){ T.recs[k]={...o, study:Math.max(x.study||0,o.study||0), rounds:Math.max(x.rounds||0,o.rounds||0)}; upd++; }
    else if(x.day>COMP_OFF && x.first>o.first){ T.recs[k]=x; upd++; }
    else dup++; });
  return {added, upd, dup};
}
// 선생님 화면: 구글 시트에서 학생 기록을 30초마다 가져와 바로 반영
let tPull=null, tLast='', tPullErr=false;
async function teacherPull(manual){
  if(!SYNC_ON) return;
  try{
    const r=await fetch(SYNC_URL+'?t='+Date.now()); const j=await r.json();
    const cs=(j.codes||[]).map(parseCode).filter(Boolean);
    const m=mergeCodes(cs); tPullErr=false;
    tLast=new Date().toLocaleTimeString('ko-KR');
    if(m.added||m.upd){ saveTeacher(); if(view==='teacher'&&tUnlocked&&!tTV) renderTeacher(); else if(view==='teacher'&&tTV) renderTeacher(); if(manual||m.added) toast(`새 기록 ${m.added}개${m.upd?` · 갱신 ${m.upd}개`:''} 반영!`); }
    else if(manual) toast('새 기록이 없어요');
  }catch(e){ tPullErr=true; if(manual) toast('기록을 가져오지 못했어요. 인터넷을 확인해 주세요'); }
  const el=document.getElementById('pullinfo'); if(el) el.textContent=pullText();
}
function pullText(){ return tPullErr?'⚠️ 자동 반영 연결에 실패했어요. 잠시 후 다시 시도해요.':(tLast?`☁️ 학생 기록이 자동으로 반영돼요 · 마지막 확인 ${tLast} (30초마다)`:'☁️ 학생 기록을 불러오는 중…'); }
function startPull(){ if(!SYNC_ON||tPull) return; teacherPull(); tPull=setInterval(()=>{ if(view==='teacher'&&tUnlocked) teacherPull(); }, 30000); }
function teacherBackup(){
  const name=n=>T.roster[n]||`${n}번`;
  const lines=Object.keys(T.roster).sort((a,b)=>a-b).map(n=>`[명단] ${n}번 ${T.roster[n]}`);
  Object.values(T.recs).sort((a,b)=>a.num-b.num||a.day-b.day).forEach(r=>{
    const label = r.day>COMP_OFF ? `종합${r.day-COMP_OFF}` : `${r.day}일차`;
    lines.push(`[안전골든벨] ${r.num}번 ${name(r.num)} ${label} 인증코드 ${makeCode(r.num, r.day, r.first, r.rounds||0, r.points, r.date, r.study||0)}`);
  });
  return lines.join('\n');
}
function logout(){
  ROOT.active=null; save(ROOTKEY, ROOT); S=blank(); studyDay=0; tUnlocked=false;
  toast('로그아웃했어요. 다음 친구가 들어와도 돼요 👋'); go('setup');
}
function renderTeacher(){
  if(!tUnlocked){
    app().innerHTML=`<div class="top"><button class="btn ghost sm" onclick="go('home')">← 돌아가기</button><h2>👩‍🏫 선생님 화면</h2></div>
    <div class="card"><p class="muted">선생님 비밀번호를 입력하세요.</p><input id="pin" type="password" inputmode="numeric"><div style="height:10px"></div><button class="btn" id="ok">들어가기</button></div>`;
    $('#ok').onclick=()=>{ if($('#pin').value===TEACHER_PIN){ tUnlocked=true; initTeacherStore(); renderTeacher(); startPull(); } else toast('비밀번호가 달라요'); };
    return;
  }
  // aggregate
  const by={};
  for(let n=1;n<=MAXNUM;n++) by[n]={num:n, pts:0, days:0, first:0, qn:0, study:0, medal:0, last:'', set:{}};
  Object.values(T.recs).forEach(r=>{ const s=by[r.num]||(by[r.num]={num:r.num,pts:0,days:0,first:0,qn:0,study:0,comp:0,medal:0,last:'',set:{}});
    if(r.day>COMP_OFF){ s.pts+=r.points; s.comp=(s.comp||0)+1; if(r.first===COMP_N) s.medal++; return; }
    if(r.first===DATA.days[r.day-1].length) s.medal++;
    s.pts+=r.points+(r.study||0)*PTS.study+(r.rounds||0)*PTS.retry; s.study+=(r.study||0); s.days++; s.first+=r.first; s.qn+=DATA.days[r.day-1].length; if(r.date>s.last) s.last=r.date; s.set[r.day]=r.first===DATA.days[r.day-1].length?'p':'c'; });
  const rows=Object.values(by).sort((a,b)=>b.pts-a.pts||b.days-a.days||a.num-b.num);
  let rank=0, prev=null;
  const name=n=>T.roster[n]||`${n}번`;
  const t=todayStr();
  const sch=scheduledDay();
  const table=`<table class="board ${tTV?'tv':''}"><tr><th>순위</th><th class="l">이름</th><th>포인트</th><th>클리어</th><th>🥇</th><th>공부</th><th>종합</th><th>정답률</th><th>진도</th></tr>
    ${rows.map((s,i)=>{ if(s.pts!==prev){ rank=i+1; prev=s.pts; } const medal=s.pts? (['🥇','🥈','🥉'][rank-1]||rank):'-';
      return `<tr class="${rank===1&&s.pts?'rank1':''}"><td>${medal}</td><td class="l">${esc(name(s.num))}</td><td><b>${s.pts.toLocaleString()}</b></td><td>${s.days}/${N_DAYS}</td><td>${s.medal||''}</td><td>${s.study}</td><td>${s.comp||0}/${NB}</td><td>${s.qn?Math.round(s.first/s.qn*100)+'%':'-'}</td><td>${s.days>=sch?'✅':`<span style="color:var(--red)">${sch-s.days}개 남음</span>`}</td></tr>`; }).join('')}</table>`;
  if(tTV){ app().innerHTML=`<div class="hero center"><h1>🔔 육쪽 마늘반 안전골든벨 순위 🔔</h1><div style="opacity:.8">${t} 기준 · 오늘은 ${sch}일차 숙제 날 · ${CONTEST} 대회</div></div><div class="card">${table}</div><div class="center"><button class="btn ghost sm" id="tv">TV 화면 끄기</button></div>`; $('#tv').onclick=()=>{tTV=false;renderTeacher();}; return; }
  let rosterHtml=''; for(let n=1;n<=MAXNUM;n++) rosterHtml+=`<div class="row" style="flex-wrap:nowrap"><span style="min-width:42px">${n}번</span><input data-n="${n}" value="${esc(T.roster[n]||'')}" placeholder="이름"></div>`;
  const progress=rows.slice().sort((a,b)=>a.num-b.num).map(s=>`<tr><td class="l" style="white-space:nowrap">${esc(name(s.num))}</td><td><div class="mini">${Array.from({length:N_DAYS},(_,k)=>`<i class="${s.set[k+1]||''}" title="${k+1}일차"></i>`).join('')}</div></td></tr>`).join('');
  app().innerHTML=`<div class="top"><button class="btn ghost sm" onclick="tUnlocked=false;go('home')">← 나가기</button><h2>👩‍🏫 선생님 화면</h2><button class="btn gold sm" id="tv">📺 TV로 크게</button></div>
  ${SYNC_ON?`<div class="card today row" style="margin-bottom:12px"><div class="grow" id="pullinfo">${pullText()}</div><button class="btn sm" onclick="teacherPull(true)">🔄 지금 새로고침</button></div>`:''}
  <div class="note" style="margin-bottom:12px">${tSrc==='db'?'☁️ 순위표가 이 아티팩트에 저장돼요 (선생님 계정으로 열었을 때). 다른 기기에서도 그대로 보여요.':'💾 순위표는 이 기기(브라우저)에 저장돼요. 항상 같은 기기로 들어오시고, 가끔 아래 「백업 복사」로 보관해 두세요.'}</div>
  <div class="card"><h3 style="margin-top:0">📮 인증코드 넣기 ${SYNC_ON?'<span class="muted" style="font-size:14px">(자동 반영이 안 된 기록만)</span>':''}</h3>
    <p class="muted">아이들이 보낸 메시지를 통째로 붙여 넣어도 돼요. 코드만 골라 읽어요. 클리어 뒤에 공부하기나 틀린 문제 다시 풀기를 더 한 아이가 코드를 다시 보내면 늘어난 포인트만 새로 반영돼요.</p>
    <textarea id="codes" placeholder="[안전골든벨] 3번 김마늘 1일차 클리어! 인증코드 GB-....-.."></textarea><div style="height:8px"></div>
    <button class="btn" id="add">순위표에 반영</button></div>
  <div class="card"><h3 style="margin-top:0">🏅 순위표</h3><div style="overflow-x:auto">${table}</div><p class="muted" style="margin:8px 0 0">공부 = 공부하기에서 푼 문제 수 · 정답률 = 도전 첫 판 정답률 · 진도 = 오늘까지 끝내야 할 일차 기준</p></div>
  <div class="card"><h3 style="margin-top:0">📅 진도 한눈에 <span class="muted">(초록 클리어 · 노랑 금메달)</span></h3><table>${progress}</table></div>
  <div class="card"><h3 style="margin-top:0">👥 명단 (번호별 이름)</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${rosterHtml}</div><div style="height:10px"></div><button class="btn sm" id="sv">명단 저장</button></div>
  <div class="card"><h3 style="margin-top:0">💾 백업 · 옮기기</h3><p class="muted">명단과 모든 기록을 글로 복사해요. 다른 기기나 새 주소의 선생님 화면에서 「인증코드 넣기」에 붙여 넣으면 그대로 옮겨져요.</p>
    <button class="btn sm" id="bk">📋 백업 복사</button></div>
  <div class="card"><h3 style="margin-top:0">🧹 관리</h3><p class="muted">잘못 넣은 기록 지우기: 번호와 일차를 입력하세요.</p>
    <div class="row"><input id="dn" type="number" placeholder="번호" style="width:90px"><input id="dd" type="number" placeholder="일차" style="width:90px"><button class="btn red sm" id="del">기록 지우기</button></div></div>`;
  $('#tv').onclick=()=>{ tTV=true; renderTeacher(); };
  $('#add').onclick=()=>{ const raw=$('#codes').value; const cs=findCodes(raw); let added=0, dup=0;
    // pick up names written like "3번 홍길동"
    (raw.match(/\[명단\]\s*\d{1,2}번\s+[^\s\d]{1,10}/g)||[]).forEach(m=>{ const mm=/(\d{1,2})번\s+(\S+)/.exec(m); if(mm) T.roster[+mm[1]]=mm[2]; });
    (raw.match(/(\d{1,2})번\s+([^\s\d]{1,10})\s+\d{1,2}일차/g)||[]).forEach(m=>{ const mm=/(\d{1,2})번\s+(\S+)/.exec(m); if(mm && !T.roster[+mm[1]]) T.roster[+mm[1]]=mm[2]; });
    const m=mergeCodes(cs); added=m.added; dup=m.dup; const upd=m.upd;
    saveTeacher(); toast(cs.length?`새 기록 ${added}개${upd?` · 기록 갱신 ${upd}개`:''}${dup?` · 이미 있는 ${dup}개는 건너뜀`:''}`:'올바른 인증코드를 찾지 못했어요'); renderTeacher(); };
  $('#bk').onclick=()=>copyText(teacherBackup());
  $('#sv').onclick=()=>{ document.querySelectorAll('[data-n]').forEach(i=>{ const v=i.value.trim(); if(v) T.roster[i.dataset.n]=v; else delete T.roster[i.dataset.n]; }); saveTeacher(); toast('명단을 저장했어요'); renderTeacher(); };
  $('#del').onclick=()=>{ const k=$('#dn').value+'-'+$('#dd').value; if(T.recs[k]){ delete T.recs[k]; saveTeacher(); toast('지웠어요'); renderTeacher(); } else toast('그 기록이 없어요'); };
}

render();
if(S.profile) setTimeout(()=>pullMine(), 300);
</script>
